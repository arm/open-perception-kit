services:
  coturn:
    image: coturn/coturn:4.13.1
    network_mode: bridge
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "${PEK_WEBRTC_TURN_MIN_PORT:-49000}-${PEK_WEBRTC_TURN_MAX_PORT:-49050}:${PEK_WEBRTC_TURN_MIN_PORT:-49000}-${PEK_WEBRTC_TURN_MAX_PORT:-49050}/udp"
    command:
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --user=${PEK_WEBRTC_TURN_USERNAME:-test}:${PEK_WEBRTC_TURN_CREDENTIAL:-test123}
      - --realm=pek.local
      - --external-ip=${WEBRTC_HOST_IP}
      - --min-port=${PEK_WEBRTC_TURN_MIN_PORT:-49000}
      - --max-port=${PEK_WEBRTC_TURN_MAX_PORT:-49050}
      - --no-cli
      - --no-tls
      - --no-dtls
      - --log-file=stdout

  pek-dev-base:
    extends: 
      file: ../compose.base.yaml
      service: pek-common-dev

    network_mode: bridge
    depends_on:
      - coturn
    environment:
      - HF_TOKEN_PATH=/run/secrets/huggingface_token
      - WEBRTC_HOST_IP=${WEBRTC_HOST_IP}
      - PEK_WEBRTC_TURN_USERNAME=${PEK_WEBRTC_TURN_USERNAME:-test}
      - PEK_WEBRTC_TURN_CREDENTIAL=${PEK_WEBRTC_TURN_CREDENTIAL:-test123}
      - PEK_WEBRTC_TURN_MIN_PORT=${PEK_WEBRTC_TURN_MIN_PORT:-49000}
      - PEK_WEBRTC_TURN_MAX_PORT=${PEK_WEBRTC_TURN_MAX_PORT:-49050}
    container_name: ${PEK_DEV_BASE_CONTAINER_NAME:-perception-experience-kit}
    hostname: ${PEK_DEV_BASE_CONTAINER_NAME:-perception-experience-kit}
    volumes:
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
    secrets:
      - huggingface_token

    build:
      context: ..
      dockerfile: Dockerfile
      target: pek-dev-base
      additional_contexts:
        modelfetch_sdks: ../.cache/modelfetch
      # BuildKit calls its bridge/NAT-backed build network "default".
      network: ${BUILD_NETWORK_MODE:-default}
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
        EXECUTORCH_ARTIFACTORY_USERNAME: ${EXECUTORCH_ARTIFACTORY_USERNAME:-}
        EXECUTORCH_ARTIFACTORY_PASSWORD: ${EXECUTORCH_ARTIFACTORY_PASSWORD:-}
        EXECUTORCH_VERSION: ${EXECUTORCH_VERSION:-}
        EXECUTORCH_DEB_REVISION: ${EXECUTORCH_DEB_REVISION:-}

  pek-dev-rpi5:
    extends: 
      file: ../compose.base.yaml
      service: pek-common-dev

    network_mode: host
    ports: []
    container_name: ${PEK_DEV_RPI5_CONTAINER_NAME:-perception-experience-kit-rpi5}
    hostname: ${PEK_DEV_RPI5_CONTAINER_NAME:-perception-experience-kit-rpi5}
    environment:
      - HF_TOKEN_PATH=/run/secrets/huggingface_token
    build:
      context: ..
      dockerfile: Dockerfile
      target: pek-dev-rpi5
      additional_contexts:
        modelfetch_sdks: ../.cache/modelfetch
      network: ${BUILD_NETWORK_MODE:-host}
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
        EXECUTORCH_ARTIFACTORY_USERNAME: ${EXECUTORCH_ARTIFACTORY_USERNAME:-}
        EXECUTORCH_ARTIFACTORY_PASSWORD: ${EXECUTORCH_ARTIFACTORY_PASSWORD:-}
        EXECUTORCH_VERSION: ${EXECUTORCH_VERSION:-}
        EXECUTORCH_DEB_REVISION: ${EXECUTORCH_DEB_REVISION:-}
    volumes:
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
    secrets:
      - huggingface_token

  pek-dev-rpi5-h8:
