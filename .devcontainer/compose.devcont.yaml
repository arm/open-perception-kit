services:
  pek-dev-base:
    extends: 
      file: ../compose.base.yaml
      service: pek-common-dev

    network_mode: bridge
    container_name: perception-experience-kit
    hostname: perception-experience-kit
    build:
      context: ..
      dockerfile: Dockerfile
      target: pek-dev-base

  pek-dev-rpi5-h8:
    extends: 
      file: ../compose.base.yaml
      service: pek-common-dev

    network_mode: host
    ports: []
    container_name: perception-experience-kit-rpi5
    hostname: perception-experience-kit-rpi5
    build:
      context: ..
      dockerfile: Dockerfile
      target: pek-dev-rpi5-h8

  pek-dev-rpi5-h10:
    extends:
      file: ../compose.base.yaml
      service: pek-common-dev

    network_mode: host
    ports: []
    container_name: perception-experience-kit-rpi5-h10
    hostname: perception-experience-kit-rpi5-h10
    build:
      context: ..
      dockerfile: Dockerfile
      target: pek-dev-rpi5-h10
