services:
  opk-dev:
    image: ${OPK_DEV_IMAGE:?Set OPK_DEV_IMAGE to a prepared RPi5 GPU development image}
    build: !reset null
    user: root
    privileged: false
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "${OPK_RENDER_GID:?Missing render-device group}"
    # Preserve the image's Vulkan environment, including on Compose 2.26.
    environment: !override
      USERNAME: dev
      HOST_UID: ${HOST_UID}
      HOST_GID: ${HOST_GID}
      DISPLAY: ${DISPLAY:-}
      CCACHE_DIR: /work/.cache/ccache
      CCACHE_MAXSIZE: 2G
      OPK_MLWL: enabled
      OPK_MLWL_RUNTIME: rpi5-gpu
