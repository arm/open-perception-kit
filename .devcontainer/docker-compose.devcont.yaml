services:

  amp-dev-base:
    build:
      context: .
      dockerfile: Dockerfile   
      target: amp-dev-base

    container_name: amp-dev-forge

    hostname: amp-dev-forge

    cap_add:
      - SYS_PTRACE

    security_opt:
      - seccomp:unconfined

    network_mode: bridge

    command: /bin/bash -c "while true; do sleep 1; done"

    environment:
      - WAYLAND_DISPLAY=wayland-0
      - DISPLAY
      - USERNAME=devgoblin

    env_file:
      - cameras.env

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ..:/work     

    ports:
      - 8000:8000
      - 8001:8001
      - 9999:9999

    stdin_open: true
    tty: true
    restart: unless-stopped


