services:

  pek-dev-rich:
    build:
      context: ..
      dockerfile: Dockerfile
      target: pek-dev-rich

    container_name: pek-dev-rich

    network_mode: bridge

    hostname: pek

    user: "0:0"

    command: | 
      /bin/bash -c "/work/.devcontainer/setup.sh && 
      /work/.devcontainer/devsetup.sh && 
      ln -sf ~/configs/.gitconfig ~/.gitconfig &&
      while true; do sleep 1; done"

    environment:
      - XDG_RUNTIME_DIR=/run/user/${HOST_UID}
      - WAYLAND_DISPLAY=wayland-0
      - DISPLAY
      - USERNAME=devgoblin
      - HOST_UID=${HOST_UID:-}
      - HOST_GID=${HOST_GID:-}
      - PEKCOMM_FILE=/tmp/pekcomm

    volumes:
      - /run/user/${HOST_UID}:/run/user/${HOST_UID}
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOME}/configs:/home/devgoblin/configs
      - ..:/work     
      - ../../pek-work-tree:/pek-work-tree
      - ${SSH_AUTH_SOCK}:/ssh-agent

    privileged: true

    ports:
      - 8000:8000
      - 8001:8001
      - 9999:9999

    stdin_open: true
    tty: true
    restart: unless-stopped

