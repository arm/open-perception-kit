name: Codex Proxy Bootstrap
description: Start the Codex Responses API proxy before openai/codex-action on self-hosted runners.

inputs:
  api-key:
    description: API key used by the local Codex Responses API proxy.
    required: false
    default: ""
  responses-api-endpoint:
    description: Optional upstream Responses API endpoint.
    required: false
    default: ""
  codex-home:
    description: Codex home directory that should hold the per-run server info file.
    required: false
    default: ""
  run-id:
    description: GitHub Actions run ID used for the server info file name.
    required: false
    default: ""
  npm-userconfig-path:
    description: Optional npm userconfig path for internal mirrors or proxies.
    required: false
    default: ""
  codex-version:
    description: Optional version of @openai/codex-responses-api-proxy to install.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
      with:
        node-version: "24"

    - name: Start Codex Responses API proxy
      if: ${{ inputs.api-key != '' }}
      shell: bash
      env:
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_RESPONSES_API_ENDPOINT: ${{ inputs.responses-api-endpoint }}
        INPUT_CODEX_HOME: ${{ inputs.codex-home }}
        INPUT_RUN_ID: ${{ inputs.run-id }}
        INPUT_NPM_USERCONFIG_PATH: ${{ inputs.npm-userconfig-path }}
        CODEX_VERSION: ${{ inputs.codex-version }}
      run: |
        set -euo pipefail

        if [ -n "$INPUT_NPM_USERCONFIG_PATH" ]; then
          export NPM_CONFIG_USERCONFIG="$INPUT_NPM_USERCONFIG_PATH"
        fi

        codex_home="${INPUT_CODEX_HOME:-$HOME/.codex}"
        run_id="${INPUT_RUN_ID:-$GITHUB_RUN_ID}"
        server_info_file="$codex_home/$run_id.json"

        mkdir -p "$codex_home"

        if [ -s "$server_info_file" ]; then
          exit 0
        fi

        npm install -g "@openai/codex-responses-api-proxy@${CODEX_VERSION}"

        args=(
          codex-responses-api-proxy
          --http-shutdown
          --server-info "$server_info_file"
        )

        if [ -n "$INPUT_RESPONSES_API_ENDPOINT" ]; then
          args+=(--upstream-url "$INPUT_RESPONSES_API_ENDPOINT")
        fi

        (
          printenv INPUT_API_KEY | env -u INPUT_API_KEY "${args[@]}"
        ) &

        for _ in {1..10}; do
          if [ -s "$server_info_file" ]; then
            exit 0
          fi
          sleep 1
        done

        echo "responses-api-proxy did not write server info" >&2
        exit 1
