name: OpenAI Codex Run
description: Runs openai/codex-action with workflow-scoped npm config and transient retry handling.

inputs:
  openai-api-key:
    description: OpenAI or proxy API key for Codex.
    required: true
  responses-api-endpoint:
    description: Optional responses endpoint override.
    required: false
    default: ""
  prompt-file:
    description: Prompt file path.
    required: true
  output-file:
    description: Output file path.
    required: true
  output-schema-file:
    description: Optional output schema file path.
    required: false
    default: ""
  sandbox:
    description: Codex sandbox mode.
    required: true
  safety-strategy:
    description: Codex safety strategy.
    required: true
  allow-bots:
    description: Whether bot commits/users are allowed.
    required: false
    default: "false"
  allow-bot-users:
    description: Allowed bot usernames.
    required: false
    default: ""
  codex-args:
    description: JSON array of extra Codex CLI arguments.
    required: false
    default: "[]"
  model:
    description: Optional Codex model override.
    required: false
    default: ""
  effort:
    description: Optional Codex reasoning effort override.
    required: false
    default: ""
  npm-userconfig-path:
    description: Repository-relative npm userconfig path for openai/codex-action.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - if: ${{ inputs.npm-userconfig-path != '' }}
      name: Configure npm userconfig
      shell: bash
      run: echo "NPM_CONFIG_USERCONFIG=${GITHUB_WORKSPACE}/${{ inputs.npm-userconfig-path }}" >> "${GITHUB_ENV}"

    - id: codex-attempt-1
      name: Run Codex (attempt 1)
      continue-on-error: true
      uses: openai/codex-action@v1
      with:
        openai-api-key: ${{ inputs.openai-api-key }}
        responses-api-endpoint: ${{ inputs.responses-api-endpoint }}
        prompt-file: ${{ inputs.prompt-file }}
        output-file: ${{ inputs.output-file }}
        output-schema-file: ${{ inputs.output-schema-file }}
        sandbox: ${{ inputs.sandbox }}
        codex-home: ${{ runner.temp }}/openai-codex-run/attempt-1
        safety-strategy: ${{ inputs.safety-strategy }}
        allow-bots: ${{ inputs.allow-bots }}
        allow-bot-users: ${{ inputs.allow-bot-users }}
        codex-args: ${{ inputs.codex-args }}
        model: ${{ inputs.model }}
        effort: ${{ inputs.effort }}

    - if: steps.codex-attempt-1.outcome != 'success'
      name: Wait before Codex retry 2
      shell: bash
      run: sleep 15

    - id: codex-attempt-2
      if: steps.codex-attempt-1.outcome != 'success'
      name: Run Codex (attempt 2)
      continue-on-error: true
      uses: openai/codex-action@v1
      with:
        openai-api-key: ${{ inputs.openai-api-key }}
        responses-api-endpoint: ${{ inputs.responses-api-endpoint }}
        prompt-file: ${{ inputs.prompt-file }}
        output-file: ${{ inputs.output-file }}
        output-schema-file: ${{ inputs.output-schema-file }}
        sandbox: ${{ inputs.sandbox }}
        codex-home: ${{ runner.temp }}/openai-codex-run/attempt-2
        safety-strategy: ${{ inputs.safety-strategy == 'drop-sudo' && 'unsafe' || inputs.safety-strategy }}
        allow-bots: ${{ inputs.allow-bots }}
        allow-bot-users: ${{ inputs.allow-bot-users }}
        codex-args: ${{ inputs.codex-args }}
        model: ${{ inputs.model }}
        effort: ${{ inputs.effort }}

    - if: steps.codex-attempt-1.outcome != 'success' && steps.codex-attempt-2.outcome != 'success'
      name: Wait before Codex retry 3
      shell: bash
      run: sleep 30

    - id: codex-attempt-3
      if: steps.codex-attempt-1.outcome != 'success' && steps.codex-attempt-2.outcome != 'success'
      name: Run Codex (attempt 3)
      continue-on-error: true
      uses: openai/codex-action@v1
      with:
        openai-api-key: ${{ inputs.openai-api-key }}
        responses-api-endpoint: ${{ inputs.responses-api-endpoint }}
        prompt-file: ${{ inputs.prompt-file }}
        output-file: ${{ inputs.output-file }}
        output-schema-file: ${{ inputs.output-schema-file }}
        sandbox: ${{ inputs.sandbox }}
        codex-home: ${{ runner.temp }}/openai-codex-run/attempt-3
        safety-strategy: ${{ inputs.safety-strategy == 'drop-sudo' && 'unsafe' || inputs.safety-strategy }}
        allow-bots: ${{ inputs.allow-bots }}
        allow-bot-users: ${{ inputs.allow-bot-users }}
        codex-args: ${{ inputs.codex-args }}
        model: ${{ inputs.model }}
        effort: ${{ inputs.effort }}

    - if: steps.codex-attempt-1.outcome != 'success' && steps.codex-attempt-2.outcome != 'success' && steps.codex-attempt-3.outcome != 'success'
      name: Wait before Codex retry 4
      shell: bash
      run: sleep 60

    - id: codex-attempt-4
      if: steps.codex-attempt-1.outcome != 'success' && steps.codex-attempt-2.outcome != 'success' && steps.codex-attempt-3.outcome != 'success'
      name: Run Codex (attempt 4)
      continue-on-error: true
      uses: openai/codex-action@v1
      with:
        openai-api-key: ${{ inputs.openai-api-key }}
        responses-api-endpoint: ${{ inputs.responses-api-endpoint }}
        prompt-file: ${{ inputs.prompt-file }}
        output-file: ${{ inputs.output-file }}
        output-schema-file: ${{ inputs.output-schema-file }}
        sandbox: ${{ inputs.sandbox }}
        codex-home: ${{ runner.temp }}/openai-codex-run/attempt-4
        safety-strategy: ${{ inputs.safety-strategy == 'drop-sudo' && 'unsafe' || inputs.safety-strategy }}
        allow-bots: ${{ inputs.allow-bots }}
        allow-bot-users: ${{ inputs.allow-bot-users }}
        codex-args: ${{ inputs.codex-args }}
        model: ${{ inputs.model }}
        effort: ${{ inputs.effort }}

    - if: steps.codex-attempt-1.outcome != 'success' && steps.codex-attempt-2.outcome != 'success' && steps.codex-attempt-3.outcome != 'success' && steps.codex-attempt-4.outcome != 'success'
      name: Wait before Codex retry 5
      shell: bash
      run: sleep 120

    - id: codex-attempt-5
      if: steps.codex-attempt-1.outcome != 'success' && steps.codex-attempt-2.outcome != 'success' && steps.codex-attempt-3.outcome != 'success' && steps.codex-attempt-4.outcome != 'success'
      name: Run Codex (attempt 5)
      uses: openai/codex-action@v1
      with:
        openai-api-key: ${{ inputs.openai-api-key }}
        responses-api-endpoint: ${{ inputs.responses-api-endpoint }}
        prompt-file: ${{ inputs.prompt-file }}
        output-file: ${{ inputs.output-file }}
        output-schema-file: ${{ inputs.output-schema-file }}
        sandbox: ${{ inputs.sandbox }}
        codex-home: ${{ runner.temp }}/openai-codex-run/attempt-5
        safety-strategy: ${{ inputs.safety-strategy == 'drop-sudo' && 'unsafe' || inputs.safety-strategy }}
        allow-bots: ${{ inputs.allow-bots }}
        allow-bot-users: ${{ inputs.allow-bot-users }}
        codex-args: ${{ inputs.codex-args }}
        model: ${{ inputs.model }}
        effort: ${{ inputs.effort }}
