services:
  amp-docs-base: &amp-docs-base
    extends: 
      file: ../compose.base.yaml
      service: amp-common-dev

    network_mode: bridge
    container_name: amp-docs-base
    hostname: amp-docs-base
    build:
      context: ..
      dockerfile: Dockerfile
      target: amp-docs-base

  amp-release-with-ut:
    <<: *amp-docs-base
    container_name: amp-release-with-ut
    hostname: amp-release-with-ut
    command: |
      bash -c '
        .devcontainer/setup.sh &&
        .devcontainer/platform_init.sh amp-dev-base &&
        ./scripts/build-elements.sh release true &&
        meson test -C development/build --print-errorlogs
      '

  amp-valgrind-check:
    <<: *amp-docs-base
    container_name: amp-valgrind-check
    hostname: amp-valgrind-check
    command: |
      bash -c '
        .devcontainer/setup.sh &&
        .devcontainer/platform_init.sh amp-dev-base &&
        ./scripts/testing/valgrind/test-elements-with-valgrind.sh clean
      '

  amp-quality-check-pull-request:
    <<: *amp-docs-base
    container_name: amp-quality-check-pull-request
    command: |
      bash -c '
        .devcontainer/devsetup.sh &&
        .devcontainer/platform_init.sh amp-dev-base &&
        source /work/tools/lazer/.venv/bin/activate &&
        expkits-ci --all-checks --pr-target-branch ${PULL_REQUEST_TARGET_BRANCH}
      '

  amp-quality-check-full:
    <<: *amp-docs-base
    container_name: amp-quality-check-full
    command: |
      bash -c '
        .devcontainer/devsetup.sh &&
        .devcontainer/platform_init.sh amp-dev-base &&
        ./scripts/gen-doc.sh &&
        source /work/tools/lazer/.venv/bin/activate &&
        expkits-ci --clang-format-check --python-format-check --cmake-format-check --shell-format-check --license-header-check
      '

  amp-sonar-check:
    extends: 
      file: ../compose.base.yaml
      service: amp-common-dev
    container_name: amp-sonar-check
    hostname: amp-sonar-check
    network_mode: bridge
    build:
      context: ..
      dockerfile: Dockerfile
      target: amp-dev-sonar 
    environment:
      PROJECT_ROOT: /work/development
      BUILD_DIR: /work/development/build
      SONAR_HOST_URL: ${SONAR_HOST_URL}
      SONAR_TOKEN: ${SONAR_TOKEN}
      SONAR_BRANCH: ${SONAR_BRANCH}
      SONAR_QUALITYGATE_WAIT: 
      PR_KEY: ${PR_KEY}
      PR_BRANCH: ${PR_BRANCH}
      PR_BASE: ${PR_BASE} 
    command: |
      bash -c '
        .devcontainer/devsetup.sh &&
        .devcontainer/platform_init.sh amp-dev-base &&
        source /work/tools/lazer/.venv/bin/activate &&
        meson setup "$$BUILD_DIR" "$$PROJECT_ROOT" --buildtype=debug --wipe -Dtests=true -Db_coverage=true &&
        meson compile -C "$$BUILD_DIR" &&
        meson test -C "$$BUILD_DIR" --print-errorlogs &&
        gcovr -r . --sonarqube coverage.xml &&
        sonar-scanner -Dsonar.qualitygate.wait="$${SONAR_QUALITYGATE_WAIT}" \
          -Dsonar.branch.name="$$SONAR_BRANCH"
      '

  amp-sonar-check-release:
    extends: 
      file: ../compose.base.yaml
      service: amp-common-dev
    container_name: amp-sonar-check-release
    hostname: amp-sonar-check-release
    network_mode: bridge
    build:
      context: ..
      dockerfile: Dockerfile
      target: amp-dev-sonar 
    environment:
      PROJECT_ROOT: /work/development
      BUILD_DIR: /work/development/build
      SONAR_HOST_URL: ${SONAR_HOST_URL}
      SONAR_TOKEN: ${SONAR_TOKEN}
      SONAR_BRANCH: ${SONAR_BRANCH}
      SONAR_QUALITYGATE_WAIT: 
      BUILD_STRING:
      SONAR_PROJECT_VERSION:
    command: |
      bash -c '
        .devcontainer/devsetup.sh &&
        .devcontainer/platform_init.sh amp-dev-base &&
        source /work/tools/lazer/.venv/bin/activate &&
        meson setup "$$BUILD_DIR" "$$PROJECT_ROOT" --buildtype=debug --wipe -Dtests=true -Db_coverage=true &&
        meson compile -C "$$BUILD_DIR" &&
        meson test -C "$$BUILD_DIR" --print-errorlogs &&
        gcovr -r . --sonarqube coverage.xml &&
        sonar-scanner -Dsonar.qualitygate.wait="$${SONAR_QUALITYGATE_WAIT}" \
          -Dsonar.branch.name="$$SONAR_BRANCH" \
          -Dsonar.projectVersion="$$SONAR_PROJECT_VERSION" \
          -Dsonar.buildString="$$BUILD_STRING"
      '
