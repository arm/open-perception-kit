x-opk-tool-build: &opk-tool-build
  context: ..
  dockerfile: Dockerfile

services:
  opk-build-base:
    build:
      context: ..
      dockerfile: Dockerfile
      target: opk-build-base

  opk-deployment-base:
    extends:
      file: ../compose.base.yaml
      service: opk-model-image
    platform: linux/arm64
    build:
      target: opk-deployment-base

  opk-docs: &opk-docs
    extends:
      file: ../compose.base.yaml
      service: opk-common-dev

    network_mode: bridge
    hostname: opk-docs
    build:
      <<: *opk-tool-build
      target: opk-docs

  opk-ci: &opk-ci
    extends:
      file: ../compose.base.yaml
      service: opk-common-dev

    image: ${OPK_CI_IMAGE:-opk-ci}
    network_mode: bridge
    hostname: opk-ci
    environment:
      CCACHE_DIR: /work/.cache/ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_UMASK: "000"
    volumes:
      - ${CCACHE_PATH:-../.cache/ccache}:/work/.cache/ccache
    build:
      <<: *opk-tool-build
      target: opk-ci

  opk-dev: &opk-dev
    extends:
      file: ../compose.base.yaml
      service: opk-common-dev-model-image

    network_mode: bridge
    hostname: opk-dev
    build:
      <<: *opk-tool-build
      target: opk-dev

  opk-pre-commit-runtime:
    network_mode: bridge
    hostname: opk-pre-commit-runtime
    build:
      context: ..
      dockerfile: Dockerfile.pre-commit

  opk-playwright-pages:
    network_mode: bridge
    hostname: opk-playwright-pages
    build:
      context: ..
      dockerfile: Dockerfile.pages

  opk-release-with-ut:
    <<: *opk-ci
    hostname: opk-release-with-ut
    command: |
      bash -c '
        .devcontainer/setup.sh &&
        .devcontainer/platform_init.sh opk-dev disabled &&
        ccache --zero-stats &&
        ./scripts/build.sh release true &&
        meson test -C development/build --print-errorlogs &&
        ccache --show-stats
      '

  opk-clang-tidy-baseline-check:
    <<: *opk-ci
    hostname: opk-clang-tidy-baseline-check
    command: |
      bash -c '
        set -o pipefail &&
        .devcontainer/devsetup.sh &&
        .devcontainer/platform_init.sh opk-dev disabled &&
        source /work/tools/.venv/bin/activate &&
        rm -f clang-tidy.log clang-tidy-stats.log clang-tidy-stats.json &&
        clang_tidy_baseline=.github/ci/baselines/clang-tidy-baseline.json &&
        if [ -n "$${PULL_REQUEST_TARGET_BRANCH:-}" ]; then
          full_tree_delta="$$(git diff --name-only "origin/$${PULL_REQUEST_TARGET_BRANCH}...HEAD" -- \
            "*.h" "*.hh" "*.hpp" "*.hxx" "*.tpp" \
            ".clang-tidy" ".github/ci/baselines/clang-tidy-baseline.json" \
            ".github/compose.ci.yaml" ".github/workflows/public-opk-ci.yml" \
            ".devcontainer" "Dockerfile" "scripts/build.sh" "tools/opk-ci" \
            ":(glob)development/**/meson.build" "development/meson.options" \
            ":(glob)development/**/*.wrap")";
          if [ -n "$${full_tree_delta}" ]; then
            echo "Clang-tidy policy or compile configuration delta detected; running full-tree clang-tidy.";
            PULL_REQUEST_TARGET_BRANCH=;
          fi;
        fi &&
        if [ -n "$${PULL_REQUEST_TARGET_BRANCH:-}" ]; then
          printf "%s\n" "{\"checks\": {}}" > /tmp/clang-tidy-pr-baseline.json &&
          clang_tidy_baseline=/tmp/clang-tidy-pr-baseline.json &&
          echo "PR delta uses a zero-diagnostic clang-tidy baseline." &&
          opk-ci \
            --clang-tidy \
            --pr-target-branch "$${PULL_REQUEST_TARGET_BRANCH}" \
            --clang-tidy-binary /opt/opk-venvs/devtools/bin/clang-tidy \
            --log-output both \
            --log-file clang-tidy.log;
        else
          opk-ci \
            --clang-tidy \
            --clang-tidy-binary /opt/opk-venvs/devtools/bin/clang-tidy \
            --log-output both \
            --log-file clang-tidy.log;
        fi &&
        opk-ci \
          --clang-tidy-stats clang-tidy.log \
          --clang-tidy-stats-output clang-tidy-stats.json \
          --clang-tidy-baseline "$${clang_tidy_baseline}" \
          --clang-tidy-baseline-mode enforce \
          | tee clang-tidy-stats.log
      '

  opk-valgrind-check:
    <<: *opk-ci
    hostname: opk-valgrind-check
    command: |
      bash -c '
        .devcontainer/setup.sh &&
        .devcontainer/platform_init.sh opk-dev disabled &&
        ccache --zero-stats &&
        ./scripts/testing/valgrind/test-elements-with-valgrind.sh clean --pipeline only-onnx-yolo &&
        ccache --show-stats
      '

  opk-generate-valgrind-summary:
    <<: *opk-ci
    hostname: opk-generate-valgrind-summary
    command: |
      bash -c '
        if [ -n "$(find scripts/testing/valgrind/logs -name "*.valgrind.*.xml" -print -quit 2>/dev/null)" ]; then
          python3 scripts/testing/valgrind/summarize-valgrind-output.py \
            --logs-dir scripts/testing/valgrind/logs \
            --output scripts/testing/valgrind/valgrind-error-summary.xml \
            --suppressions-file scripts/testing/valgrind/suppressed-warnings;
        else
          echo "No valgrind log files found; refusing to publish a new baseline." >&2;
          exit 1;
        fi
      '

  opk-quality-check-pull-request:
    <<: *opk-ci
    hostname: opk-quality-check-pull-request
    command: |
      bash -c '
        .devcontainer/devsetup.sh &&
        .devcontainer/platform_init.sh opk-dev disabled &&
        mkdir -p /work/.github/artifacts &&
        meson setup /tmp/opk-config-validator-build /work/development --buildtype=release --layout=flat -Dtests=false &&
        meson compile -C /tmp/opk-config-validator-build opk-config-check &&
        source /work/tools/.venv/bin/activate &&
        PATH="/tmp/opk-config-validator-build/meson-out:$$PATH" \
          opk-ci --ci-pr-checks --pr-target-branch ${PULL_REQUEST_TARGET_BRANCH} \
          --report-file /work/.github/artifacts/opk-ci-pr-report.txt
      '

  opk-quality-check-full:
    <<: *opk-ci
    hostname: opk-quality-check-full
    command: |
      bash -c '
        .devcontainer/devsetup.sh &&
        .devcontainer/platform_init.sh opk-dev disabled &&
        mkdir -p /work/.github/artifacts &&
        ./scripts/gen-doc.sh &&
        meson setup /tmp/opk-config-validator-build /work/development --buildtype=release --layout=flat -Dtests=false &&
        meson compile -C /tmp/opk-config-validator-build opk-config-check &&
        source /work/tools/.venv/bin/activate &&
        PATH="/tmp/opk-config-validator-build/meson-out:$$PATH" \
          opk-ci --ci-full-checks \
          --report-file /work/.github/artifacts/opk-ci-full-report.txt
      '

  opk-sonar-check:
    <<: *opk-ci
    hostname: opk-sonar-check
    environment:
      CCACHE_DIR: /work/.cache/ccache
      CCACHE_MAXSIZE: 2G
      PROJECT_ROOT: /work/development
      BUILD_DIR: /work/development/build
      SONAR_HOST_URL: ${SONAR_HOST_URL}
      SONAR_TOKEN: ${SONAR_TOKEN}
      SONAR_BRANCH: ${SONAR_BRANCH}
      SONAR_QUALITYGATE_WAIT: ${SONAR_QUALITYGATE_WAIT:-false}
      PR_KEY: ${PR_KEY}
      PR_BRANCH: ${PR_BRANCH}
      PR_BASE: ${PR_BASE}
    command: |
      bash -c '
        .devcontainer/devsetup.sh &&
        .devcontainer/platform_init.sh opk-dev disabled &&
        source /work/tools/.venv/bin/activate &&
        ccache --zero-stats &&
        ./scripts/build.sh debug true --extra-setup-args=-Db_coverage=true,--wipe &&
        meson test -C "$$BUILD_DIR" --print-errorlogs --num-processes 1 --timeout-multiplier 2 &&
        ./scripts/private/generate-sonar-coverage.sh &&
        if [ -n "$$PR_KEY" ] && [ -n "$$PR_BRANCH" ] && [ -n "$$PR_BASE" ]; then
          sonar_scope_args=(
            -Dsonar.pullrequest.key="$$PR_KEY"
            -Dsonar.pullrequest.branch="$$PR_BRANCH"
            -Dsonar.pullrequest.base="$$PR_BASE"
          )
        else
          sonar_scope_args=(-Dsonar.branch.name="$$SONAR_BRANCH")
        fi &&
        sonar_coverage_args=() &&
        if [ -s test-results/playwright/coverage/lcov.info ]; then
          sonar_coverage_args=(-Dsonar.javascript.lcov.reportPaths=development/web/coverage/lcov.info,test-results/playwright/coverage/lcov.info)
        fi &&
        sonar-scanner -Dsonar.qualitygate.wait="$${SONAR_QUALITYGATE_WAIT}" \
          "$${sonar_scope_args[@]}" "$${sonar_coverage_args[@]}" &&
        ccache --show-stats
      '

  opk-sonar-check-release:
    <<: *opk-ci
    hostname: opk-sonar-check-release
    environment:
      CCACHE_DIR: /work/.cache/ccache
      CCACHE_MAXSIZE: 2G
      PROJECT_ROOT: /work/development
      BUILD_DIR: /work/development/build
      SONAR_HOST_URL: ${SONAR_HOST_URL}
      SONAR_TOKEN: ${SONAR_TOKEN}
      SONAR_BRANCH: ${SONAR_BRANCH}
      SONAR_QUALITYGATE_WAIT: ${SONAR_QUALITYGATE_WAIT}
      BUILD_STRING: ${BUILD_STRING} 
      SONAR_PROJECT_VERSION: ${SONAR_PROJECT_VERSION}
    command: |
      bash -c '
        .devcontainer/devsetup.sh &&
        .devcontainer/platform_init.sh opk-dev disabled &&
        source /work/tools/.venv/bin/activate &&
        ccache --zero-stats &&
        ./scripts/build.sh debug true --extra-setup-args=-Db_coverage=true,--wipe &&
        meson test -C "$$BUILD_DIR" --print-errorlogs --num-processes 1 --timeout-multiplier 2 &&
        ./scripts/private/generate-sonar-coverage.sh &&
        test -s test-results/playwright/coverage/lcov.info &&
        sonar-scanner -Dsonar.qualitygate.wait="$${SONAR_QUALITYGATE_WAIT}" \
          -Dsonar.branch.name="$$SONAR_BRANCH" \
          -Dsonar.projectVersion="$$SONAR_PROJECT_VERSION" \
          -Dsonar.buildString="$$BUILD_STRING" \
          -Dsonar.javascript.lcov.reportPaths=development/web/coverage/lcov.info,test-results/playwright/coverage/lcov.info &&
        ccache --show-stats
      '

secrets:
  huggingface_token:
    environment: HF_TOKEN
