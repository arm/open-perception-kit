x-pek-tool-build: &pek-tool-build
  context: ..
  dockerfile: Dockerfile

services:
  pek-build-base:
    build:
      context: ..
      dockerfile: Dockerfile
      target: pek-build-base

  pek-deployment-base:
    platform: linux/arm64
    build:
      context: ..
      dockerfile: Dockerfile
      target: pek-deployment-base
      secrets:
        - huggingface_token
      args:
        HF_DOWNLOAD_CACHEBUST: ${HF_DOWNLOAD_CACHEBUST:-${HF_TOKEN:+${GITHUB_RUN_ID:?Set HF_DOWNLOAD_CACHEBUST when HF_TOKEN is set}-${GITHUB_RUN_ATTEMPT:-0}}}

  pek-docs: &pek-docs
    extends:
      file: ../compose.base.yaml
      service: pek-common-dev

    network_mode: bridge
    hostname: pek-docs
    build:
      <<: *pek-tool-build
      target: pek-docs

  pek-ci: &pek-ci
    extends:
      file: ../compose.base.yaml
      service: pek-common-dev

    network_mode: bridge
    hostname: pek-ci
    environment:
      CCACHE_DIR: /work/.cache/ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_UMASK: "000"
    volumes:
      - ${CCACHE_PATH:-../.cache/ccache}:/work/.cache/ccache
    build:
      <<: *pek-tool-build
      target: pek-ci

  pek-dev: &pek-dev
    extends:
      file: ../compose.base.yaml
      service: pek-common-dev

    network_mode: bridge
    hostname: pek-dev
    build:
      <<: *pek-tool-build
      target: pek-dev
      secrets:
        - huggingface_token
      args:
        HF_DOWNLOAD_CACHEBUST: ${HF_DOWNLOAD_CACHEBUST:-${HF_TOKEN:+${GITHUB_RUN_ID:?Set HF_DOWNLOAD_CACHEBUST when HF_TOKEN is set}-${GITHUB_RUN_ATTEMPT:-0}}}

  pek-pre-commit-runtime:
    network_mode: bridge
    hostname: pek-pre-commit-runtime
    build:
      context: ..
      dockerfile: Dockerfile.pre-commit

  pek-playwright-pages:
    network_mode: bridge
    hostname: pek-playwright-pages
    build:
      context: ..
      dockerfile: Dockerfile.pages

  pek-release-with-ut:
    <<: *pek-ci
    hostname: pek-release-with-ut
    command: |
      bash -c '
        .devcontainer/setup.sh &&
        .devcontainer/platform_init.sh pek-dev disabled &&
        ccache --zero-stats &&
        ./scripts/build-elements.sh release true &&
        meson test -C development/build --print-errorlogs &&
        ccache --show-stats
      '

  pek-clang-tidy-baseline-check:
    <<: *pek-ci
    hostname: pek-clang-tidy-baseline-check
    command: |
      bash -c '
        set -o pipefail &&
        .devcontainer/devsetup.sh &&
        .devcontainer/platform_init.sh pek-dev disabled &&
        source /work/tools/.venv/bin/activate &&
        rm -f clang-tidy.log clang-tidy-stats.log clang-tidy-stats.json &&
        if [ -n "$${PULL_REQUEST_TARGET_BRANCH:-}" ]; then
          expkits-ci \
            --clang-tidy \
            --pr-target-branch "$${PULL_REQUEST_TARGET_BRANCH}" \
            --clang-tidy-binary /opt/pek-venvs/devtools/bin/clang-tidy \
            --log-output both \
            --log-file clang-tidy.log;
        else
          expkits-ci \
            --clang-tidy \
            --clang-tidy-binary /opt/pek-venvs/devtools/bin/clang-tidy \
            --log-output both \
            --log-file clang-tidy.log;
        fi &&
        expkits-ci \
          --clang-tidy-stats clang-tidy.log \
          --clang-tidy-stats-output clang-tidy-stats.json \
          --clang-tidy-baseline .github/ci/baselines/clang-tidy-baseline.json \
          --clang-tidy-baseline-mode enforce \
          | tee clang-tidy-stats.log
      '

  pek-valgrind-check:
    <<: *pek-ci
    hostname: pek-valgrind-check
    command: |
      bash -c '
        .devcontainer/setup.sh &&
        .devcontainer/platform_init.sh pek-dev disabled &&
        ccache --zero-stats &&
        ./scripts/testing/valgrind/test-elements-with-valgrind.sh clean --pipeline only-onnx-yolo &&
        ccache --show-stats
      '

  pek-generate-valgrind-summary:
    <<: *pek-ci
    hostname: pek-generate-valgrind-summary
    command: |
      bash -c '
        if find scripts/testing/valgrind/logs -name "*.valgrind.*.xml" -print -quit 2>/dev/null | grep -q .; then
          python3 scripts/testing/valgrind/summarize-valgrind-output.py \
            --logs-dir scripts/testing/valgrind/logs \
            --output scripts/testing/valgrind/valgrind-error-summary.xml;
        else
          echo "No valgrind log files found; refusing to publish a new baseline." >&2;
          exit 1;
        fi
      '

  pek-quality-check-pull-request:
    <<: *pek-ci
    hostname: pek-quality-check-pull-request
    command: |
      bash -c '
        .devcontainer/devsetup.sh &&
        .devcontainer/platform_init.sh pek-dev disabled &&
        mkdir -p /work/.github/artifacts &&
        source /work/tools/.venv/bin/activate &&
        expkits-ci --ci-pr-checks --pr-target-branch ${PULL_REQUEST_TARGET_BRANCH} \
          --report-file /work/.github/artifacts/expkits-ci-pr-report.txt
      '

  pek-quality-check-full:
    <<: *pek-ci
    hostname: pek-quality-check-full
    command: |
      bash -c '
        .devcontainer/devsetup.sh &&
        .devcontainer/platform_init.sh pek-dev disabled &&
        mkdir -p /work/.github/artifacts &&
        ./scripts/gen-doc.sh &&
        source /work/tools/.venv/bin/activate &&
        expkits-ci --ci-full-checks \
          --report-file /work/.github/artifacts/expkits-ci-full-report.txt
      '

  pek-sonar-check:
    <<: *pek-ci
    hostname: pek-sonar-check
    environment:
      CCACHE_DIR: /work/.cache/ccache
      CCACHE_MAXSIZE: 2G
      PROJECT_ROOT: /work/development
      BUILD_DIR: /work/development/build
      SONAR_HOST_URL: ${SONAR_HOST_URL}
      SONAR_TOKEN: ${SONAR_TOKEN}
      SONAR_BRANCH: ${SONAR_BRANCH}
      SONAR_QUALITYGATE_WAIT: ${SONAR_QUALITYGATE_WAIT:-false}
      PR_KEY: ${PR_KEY}
      PR_BRANCH: ${PR_BRANCH}
      PR_BASE: ${PR_BASE}
    command: |
      bash -c '
        .devcontainer/devsetup.sh &&
        .devcontainer/platform_init.sh pek-dev disabled &&
        source /work/tools/.venv/bin/activate &&
        ccache --zero-stats &&
        ./scripts/build-elements.sh debug true --extra-setup-args=-Db_coverage=true,--wipe &&
        meson test -C "$$BUILD_DIR" --print-errorlogs &&
        gcovr -r . --sonarqube coverage.xml &&
        if [ -n "$$PR_KEY" ] && [ -n "$$PR_BRANCH" ] && [ -n "$$PR_BASE" ]; then
          sonar_scope_args=(
            -Dsonar.pullrequest.key="$$PR_KEY"
            -Dsonar.pullrequest.branch="$$PR_BRANCH"
            -Dsonar.pullrequest.base="$$PR_BASE"
          )
        else
          sonar_scope_args=(-Dsonar.branch.name="$$SONAR_BRANCH")
        fi &&
        sonar-scanner -Dsonar.qualitygate.wait="$${SONAR_QUALITYGATE_WAIT}" "$${sonar_scope_args[@]}" &&
        ccache --show-stats
      '

  pek-sonar-check-release:
    <<: *pek-ci
    hostname: pek-sonar-check-release
    environment:
      CCACHE_DIR: /work/.cache/ccache
      CCACHE_MAXSIZE: 2G
      PROJECT_ROOT: /work/development
      BUILD_DIR: /work/development/build
      SONAR_HOST_URL: ${SONAR_HOST_URL}
      SONAR_TOKEN: ${SONAR_TOKEN}
      SONAR_BRANCH: ${SONAR_BRANCH}
      SONAR_QUALITYGATE_WAIT: ${SONAR_QUALITYGATE_WAIT}
      BUILD_STRING: ${BUILD_STRING} 
      SONAR_PROJECT_VERSION: ${SONAR_PROJECT_VERSION}
    command: |
      bash -c '
        .devcontainer/devsetup.sh &&
        .devcontainer/platform_init.sh pek-dev disabled &&
        source /work/tools/.venv/bin/activate &&
        ccache --zero-stats &&
        ./scripts/build-elements.sh debug true --extra-setup-args=-Db_coverage=true,--wipe &&
        meson test -C "$$BUILD_DIR" --print-errorlogs &&
        gcovr -r . --sonarqube coverage.xml &&
        sonar-scanner -Dsonar.qualitygate.wait="$${SONAR_QUALITYGATE_WAIT}" \
          -Dsonar.branch.name="$$SONAR_BRANCH" \
          -Dsonar.projectVersion="$$SONAR_PROJECT_VERSION" \
          -Dsonar.buildString="$$BUILD_STRING" &&
        ccache --show-stats
      '

secrets:
  huggingface_token:
    environment: HF_TOKEN
