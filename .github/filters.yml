sdk_inputs: &sdk_inputs
  - '.github/actions/setup-sdk/**'
  - 'requirements/sdk.txt'
  - 'requirements/build.json'
  - 'schemas/perception/**'
  - 'tools/perception/**'
  - 'tools/flowdata-sdk/**'
  - 'generated/perception/**'
  - 'scripts/perception-sdk.sh'
  - 'scripts/private/run-perception-sdk.sh'
  - 'scripts/private/install-perception-flatbuffers.sh'
  - '.clang-format'
  - 'setup.cfg'

native_build: &native_build
  - *sdk_inputs
  - '.github/filters.yml'
  - '.github/workflows/changes.yml'
  - '.github/actions/setup-build/**'
  - '**/meson.build'
  - '**/meson.options'
  - '**/meson_options.txt'
  - 'development/subprojects/**'
  - 'requirements/meson.txt'
  - 'scripts/build.sh'
  - 'scripts/private/shtools.sh'
  - 'scripts/private/install-onnxruntime.sh'
  - 'scripts/setup-python-ops-runtime.sh'
  - 'development/ops-python/runtime.json'
  - 'development/web/package*.json'
  - 'config/schemas/**'

native_sources: &native_sources
  - 'development/**/*.{c,cc,cpp,cxx,C,h,hh,hpp,hxx,H,tpp,inl,inc,ipp,h.in,hpp.in}'

meson:
  - *native_build
  - *native_sources
  - 'development/tests/**'
  - 'development/web/**'
  - 'development/ops-python/**'
  - 'config/**'
  - 'scripts/quick_start.sh'
  - 'scripts/quick-start/**'
  - 'scripts/setup-lxc-dev.sh'
  - 'scripts/download-models.py'
  - 'scripts/opksink-web.sh'
  - 'scripts/run.sh'
  - 'scripts/release/**'
  - 'scripts/private/clang-tidy-report.py'
  - 'scripts/private/deployment-*.sh'
  - 'scripts/private/development-entrypoint.sh'
  - 'scripts/private/generate-hf-download-cachebust.sh'
  - 'scripts/private/download-demo-videos.sh'
  - 'scripts/private/demo-videos.manifest'
  - 'scripts/private/detect-webrtc-host-ip.sh'
  - 'scripts/private/select-webrtc-turn-mode.sh'
  - 'Dockerfile'
  - 'compose*.yaml'
  - '.devcontainer/compose*.yaml'
  - 'tools/config_versions.py'
  - 'tools/opk-menu'
  - '.github/workflows/meson-tests.yml'

valgrind:
  - *native_build
  - *native_sources
  - 'config/**'
  - 'development/tests/**'
  - 'scripts/testing/valgrind/**'
  - '.github/workflows/valgrind-tests.yml'

sdk:
  - *sdk_inputs
  - '.github/filters.yml'
  - '.github/workflows/changes.yml'
  - '.github/workflows/sdk-tests.yml'

clang_tidy_all: &clang_tidy_all
  - *native_build
  - 'development/**/*.{h,hh,hpp,hxx,H,tpp,inl,inc,ipp,h.in,hpp.in}'
  - '.clang-tidy'
  - '.github/workflows/clang-tidy.yml'

sources: &sources
  - added|modified: 'development/**/*.{c,cc,cpp,cxx,C}'

clang_tidy:
  - *clang_tidy_all
  - *sources
