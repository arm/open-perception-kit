name: Agent Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Branch or ref to diff against for manual runs
        required: false
        default: origin/main
        type: string
      head_ref:
        description: Branch, SHA, or ref to review for manual runs
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: agent-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.head_ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch Agent review base ref
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.base_ref || format('origin/{0}', github.base_ref) }}
        run: |
          set -euo pipefail
          if [[ "${REVIEW_BASE_REF}" == origin/* ]]; then
            base_branch="${REVIEW_BASE_REF#origin/}"
            auth_header="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w 0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
              fetch --no-tags origin "+refs/heads/${base_branch}:refs/remotes/origin/${base_branch}"
          fi

      - name: Render Agent review prompt
        shell: bash
        env:
          REVIEW_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.base_ref || format('origin/{0}', github.base_ref) }}
          REVIEW_HEAD_REF: ${{ github.event_name == 'workflow_dispatch' && 'HEAD' || github.event.pull_request.head.sha || github.sha }}
          REVIEW_REPOSITORY: ${{ github.repository }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          REVIEW_PR_TITLE: ${{ github.event.pull_request.title || '' }}
          REVIEW_PR_URL: ${{ github.event.pull_request.html_url || '' }}
        run: |
          mkdir -p .github/agent-workflows/review/out
          ./.github/agent-workflows/review/scripts/render-prompt.sh .github/agent-workflows/review/out/review.prompt.md

      - name: Install OpenAI agent runtime
        shell: bash
        run: |
          python3 -m venv .agent-workflows/openai-agent-venv
          .agent-workflows/openai-agent-venv/bin/python -m pip install --upgrade pip
          .agent-workflows/openai-agent-venv/bin/python -m pip install -r .github/agent-workflows/runtime/requirements-openai-agents.txt

      # <agent-review:suppress-begin> Intentional current self-hosted OpenAI
      # review trust boundary for same-repo pull requests.
      - name: Run OpenAI SDK review
        id: review
        shell: bash
        env:
          OPENAI_PROXY_KEY_FOR_SELF_HOSTED_RUNNERS: ${{ secrets.OPENAI_PROXY_KEY_FOR_SELF_HOSTED_RUNNERS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_PROXY_KEY_FOR_SELF_HOSTED_RUNNERS }}
          OPENAI_BASE_URL: https://openai-api-proxy.geo.arm.com/api/providers/openai-eu/v1
          OPENAI_AGENTS_DISABLE_TRACING: "1"
        run: |
          .agent-workflows/openai-agent-venv/bin/python scripts/private/agent_workflows/openai_agent_runner.py run-review \
            --agent-instance review \
            --model-config-file .github/agent-workflows/runtime/agent-models.json \
            --prompt-file .github/agent-workflows/review/out/review.prompt.md \
            --schema-file .github/agent-workflows/review/schemas/review.schema.json \
            --output-file .github/agent-workflows/review/out/review.json
      # <agent-review:suppress-end>

      - name: Render review summary
        if: ${{ success() }}
        shell: bash
        run: |
          python3 ./.github/agent-workflows/review/scripts/publish-review.py \
            --input .github/agent-workflows/review/out/review.json \
            --markdown-out .github/agent-workflows/review/out/review-summary.md
          cat .github/agent-workflows/review/out/review-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish review summary comment
        if: ${{ success() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_BASE_REF: ${{ format('origin/{0}', github.base_ref) }}
        run: |
          python3 ./.github/agent-workflows/review/scripts/publish-review.py \
            --input .github/agent-workflows/review/out/review.json \
            --markdown-out .github/agent-workflows/review/out/review-summary.md \
            --publish-pr-comment

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agent-review-out
          path: .github/agent-workflows/review/out
          if-no-files-found: warn
