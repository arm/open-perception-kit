name: Black Duck Detect wrapper

on:
  workflow_call:

permissions: {}

jobs:
  download:
    name: Prepare verified Detect wrapper
    runs-on: self-hosted-ubuntu-latest-x64
    timeout-minutes: 5
    steps:
      - name: Download and verify Detect wrapper
        env:
          DETECT_SHA256: 37c678bb1cb770fdf0e841c2d281aaf06abec2fa211bee33de6ddd04e13b84fd # pragma: allowlist secret
          DETECT_URL: https://artifactory.arm.com/artifactory/synopsys-blackduck.detect-arm/detect-arm.sh
        run: |
          set -euo pipefail
          scanner_dir="${RUNNER_TEMP}/blackduck-detect"
          install -d -m 0777 "$scanner_dir"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --retry 3 --retry-all-errors --output "$scanner_dir/detect-arm.sh" "$DETECT_URL"
          echo "$DETECT_SHA256  $scanner_dir/detect-arm.sh" | sha256sum --check --strict

      - name: Share verified Detect wrapper
        uses: actions/upload-artifact@v7
        with:
          name: detect-arm.sh
          path: ${{ runner.temp }}/blackduck-detect/detect-arm.sh
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 1
