name: Black Duck Security and License Scan

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact source SHA to scan.
        required: true
        type: string
      ci_image_sha:
        description: Exact PEK CI image SHA from the caller run.
        required: true
        type: string
      version_name:
        description: Black Duck project version name.
        required: true
        type: string
    secrets:
      BLACKDUCK_URL:
        required: true
      BLACKDUCK_TOKEN:
        required: true
      DEPLOY_KEY_FLOWDATA_SDK:
        required: true
  pull_request_target:
    branches: [main, develop, "feature/**", "sandbox/**"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  select-scan-slot:
    name: Select Black Duck scan slot
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    outputs:
      slot: ${{ steps.slot.outputs.value }}
    steps:
      - name: Calculate scan slot
        id: slot
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: printf 'value=%02d\n' "$((PR_NUMBER % 20))" >> "$GITHUB_OUTPUT"

  snippet-scan:
    name: Black Duck snippet scan
    needs: select-scan-slot
    if: >-
      github.event_name == 'pull_request_target' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: blackduck-pr-slot-${{ needs.select-scan-slot.outputs.slot }}
      cancel-in-progress: false
    runs-on: self-hosted-ubuntu-24.04-arm64-ephemeral
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # The PR checkout is untrusted scan input. No files from it are executed.
      - name: Checkout scan target
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          path: scan-target
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          show-progress: false

      - name: Run snippet scan
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BLACKDUCK_API_TOKEN: ${{ secrets.BLACKDUCK_TOKEN }}
          BLACKDUCK_URL: ${{ secrets.BLACKDUCK_URL }}
          BLACKDUCK_PROJECT_NAME: ${{ github.repository }}
          BLACKDUCK_PROJECT_VERSION: pr-slot-${{ needs.select-scan-slot.outputs.slot }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PATCHSCAN_SHA256: ac0e0bc820e86f3b011c1a77f45c5db75832108eadd9d02cd02eac11868bac07 # pragma: allowlist secret
          PATCHSCAN_URL: https://artifactory.arm.com/artifactory/blackduck.patch-snippet-checker/2.2.0/linux/arm64/patchscan
          GIT_DIR: ${{ github.workspace }}/scan-target/.git
          GIT_WORK_TREE: ${{ github.workspace }}/scan-target
        run: |
          set -euo pipefail
          test -n "${BLACKDUCK_API_TOKEN:-}"
          test -n "${BLACKDUCK_URL:-}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"

          curl --proto '=https' --tlsv1.2 --fail --location \
            --retry 3 --retry-all-errors --output patchscan "$PATCHSCAN_URL"
          echo "$PATCHSCAN_SHA256  patchscan" | sha256sum --check --strict
          chmod +x patchscan

          export BLACKDUCK_PROJECT_NAME="${BLACKDUCK_PROJECT_NAME//\//:}"
          ./patchscan "${BASE_SHA}..${HEAD_SHA}" \
            --detect.project.name "$BLACKDUCK_PROJECT_NAME" \
            --detect.project.version.name "$BLACKDUCK_PROJECT_VERSION"

  full-scan:
    name: Black Duck full source scan
    if: ${{ inputs.ci_image_sha != '' }}
    runs-on: self-hosted-ubuntu-latest-x64
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      BLACKDUCK_VERSION: ${{ inputs.version_name }}
      CI_CHECKOUT_PATH: repo-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      CI_IMAGE_SHA: ${{ inputs.ci_image_sha }}
      COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      WORKSPACE_ROOT: ${{ github.workspace }}/repo-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - name: Download PEK CI image
        uses: actions/download-artifact@v8
        with:
          name: pek-ci-image
          path: ${{ runner.temp }}/pek-ci-image

      - name: Load PEK CI image
        run: |
          tools_dir="${RUNNER_TEMP}/pek-ci-image"
          python3 "$tools_dir/ci_image.py" prepare "$CI_IMAGE_SHA" \
            --archive "$tools_dir/pek-ci-image.tar" pek-ci

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          path: ${{ env.CI_CHECKOUT_PATH }}
          persist-credentials: false
          ref: ${{ inputs.checkout_ref }}

      - name: Prepare private submodules
        working-directory: ${{ env.WORKSPACE_ROOT }}
        env:
          DEPLOY_KEY_FLOWDATA_SDK: ${{ secrets.DEPLOY_KEY_FLOWDATA_SDK }}
        run: |
          source .github/scripts/configure_workspace_ssh.sh
          git submodule update --init --recursive

      - name: Download verified Detect wrapper
        env:
          DETECT_SHA256: 37c678bb1cb770fdf0e841c2d281aaf06abec2fa211bee33de6ddd04e13b84fd # pragma: allowlist secret
          DETECT_URL: https://artifactory.arm.com/artifactory/synopsys-blackduck.detect-arm/detect-arm.sh
        run: |
          set -euo pipefail
          scanner_dir="${RUNNER_TEMP}/blackduck"
          install -d -m 0777 "$scanner_dir/output"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --retry 3 --retry-all-errors --output "$scanner_dir/detect-arm.sh" "$DETECT_URL"
          echo "$DETECT_SHA256  $scanner_dir/detect-arm.sh" | sha256sum --check --strict
          chmod +x "$scanner_dir/detect-arm.sh"

      - name: Run full source scan in PEK CI image
        env:
          BLACKDUCK_TOKEN: ${{ secrets.BLACKDUCK_TOKEN }}
          BLACKDUCK_URL: ${{ secrets.BLACKDUCK_URL }}
        run: |
          set -euo pipefail
          test -n "${BLACKDUCK_URL:-}"
          test -n "${BLACKDUCK_TOKEN:-}"
          project_name="${GITHUB_REPOSITORY//\//:}"
          source_version="${BLACKDUCK_VERSION//\//-}--source"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env BLACKDUCK_TOKEN \
            --env BLACKDUCK_URL \
            --env HOME=/tmp/blackduck-home \
            --env PROJECT_NAME="$project_name" \
            --env SOURCE_VERSION="$source_version" \
            --volume "$WORKSPACE_ROOT:/work:ro" \
            --volume "$RUNNER_TEMP/blackduck:/blackduck" \
            --workdir /work \
            --entrypoint bash \
            "$PEK_CI_IMAGE" -c '
              set -euo pipefail
              /blackduck/detect-arm.sh \
                "--blackduck.url=${BLACKDUCK_URL}" \
                "--blackduck.api.token=${BLACKDUCK_TOKEN}" \
                "--detect.project.name=${PROJECT_NAME}" \
                "--detect.project.version.name=${SOURCE_VERSION}" \
                "--detect.code.location.name=${PROJECT_NAME}/${SOURCE_VERSION}/source" \
                --detect.cleanup=false \
                --detect.timeout=1800 \
                --detect.tools=DETECTOR,SIGNATURE_SCAN \
                --detect.blackduck.signature.scanner.snippet.matching=SNIPPET_MATCHING \
                --detect.blackduck.signature.scanner.upload.source.mode=true \
                --detect.excluded.directories=.git,.cache,.github/workflows,development/build,node_modules \
                --detect.output.path=/blackduck/output \
                --detect.source.path=/work \
                --logging.level.detect=INFO
            '

      - name: Upload Black Duck Detect output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blackduck-full-scan-output
          path: ${{ runner.temp }}/blackduck/output
          if-no-files-found: warn
          retention-days: 10

      - name: Cleanup isolated workspace and PEK CI image
        if: always()
        run: |
          docker image rm "${COMPOSE_PROJECT_NAME}-pek-ci" "${PEK_CI_IMAGE:-}" || true
          case "$WORKSPACE_ROOT" in
            "$GITHUB_WORKSPACE"/repo-*) rm -rf -- "$WORKSPACE_ROOT" ;;
            *) echo "Skipping unexpected workspace: $WORKSPACE_ROOT" >&2 ;;
          esac
