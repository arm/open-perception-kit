name: Select CI checks

on:
  workflow_call:
    inputs:
      scope:
        type: string
        default: changed
    outputs:
      meson:
        value: ${{ jobs.changes.outputs.meson }}
      valgrind:
        value: ${{ jobs.changes.outputs.valgrind }}
      sdk:
        value: ${{ jobs.changes.outputs.sdk }}
      clang_tidy:
        value: ${{ jobs.changes.outputs.clang_tidy }}
      clang_tidy_all:
        value: ${{ jobs.changes.outputs.clang_tidy_all }}
      sources:
        value: ${{ jobs.changes.outputs.sources }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      meson: ${{ steps.scope.outputs.all == 'true' || steps.paths.outputs.meson == 'true' }}
      valgrind: ${{ steps.scope.outputs.all == 'true' || steps.paths.outputs.valgrind == 'true' }}
      sdk: ${{ steps.scope.outputs.all == 'true' || steps.paths.outputs.sdk == 'true' }}
      clang_tidy: ${{ steps.scope.outputs.all == 'true' || steps.paths.outputs.clang_tidy == 'true' }}
      clang_tidy_all: ${{ steps.scope.outputs.all == 'true' || steps.paths.outputs.clang_tidy_all == 'true' }}
      sources: ${{ steps.paths.outputs.sources_files || '[]' }}
    steps:
      - name: Select scope
        id: scope
        env:
          SCOPE: ${{ inputs.scope }}
          RUN_ALL: ${{ inputs.scope == 'all' || (github.event_name != 'pull_request' && github.event_name != 'push') || github.event.pull_request.changed_files >= 3000 }}
        run: |
          [[ "$SCOPE" == changed || "$SCOPE" == all ]]
          echo "all=$RUN_ALL" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.scope.outputs.all != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find changed files
        id: paths
        if: steps.scope.outputs.all != 'true'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: .github/filters.yml
          list-files: json
