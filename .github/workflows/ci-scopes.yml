name: CI scope tests

on:
  pull_request:
    paths:
      - '.github/filters.yml'
      - '.github/workflows/**'
      - '.github/scripts/test-ci-scopes.mjs'
  push:
    branches: [main, develop]
    paths:
      - '.github/filters.yml'
      - '.github/workflows/**'
      - '.github/scripts/test-ci-scopes.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scopes:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Checkout paths-filter
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: dorny/paths-filter
          ref: ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
          path: .ci-test-tools/paths-filter
          persist-credentials: false

      - name: Test change selection
        env:
          PATHS_FILTER_ACTION: .ci-test-tools/paths-filter
        run: node --test .github/scripts/test-ci-scopes.mjs
