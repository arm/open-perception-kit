name: clang-format check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  clang-format:
    runs-on: ubuntu-latest     # Host runner (required)
    container:
      image: debian:trixie     # Your actual build/test environment
      options: --user root     # Ensure we can install packages

    steps:
      - name: Install basic dependencies
        run: |
          apt-get update
          apt-get install -y git clang-format-19

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git safe directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Get list of changed C/C++ files
        id: changed_files
        run: |
          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then
            echo "Error: github.base_ref is not set. This workflow requires a pull request event."
            exit 1
          fi
          git fetch origin "$BASE_REF"

          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRTUB "origin/$BASE_REF"...HEAD \
            | grep -E '\.(c|cc|cpp|cxx|h|hpp)$' || true)

          echo "Changed C/C++ files:"
          echo "$CHANGED_FILES"

          # Output files as a newline-separated string for safe parsing
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED_FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Run clang-format on changed files
        if: steps.changed_files.outputs.files != ''
        shell: bash
        run: |
          FILES="${{ steps.changed_files.outputs.files }}"
          echo "Checking formatting for:"

          EXIT_CODE=0
          # Read FILES into an array, preserving spaces in filenames
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # Skip if file doesn't exist (was deleted in this PR)
            [ ! -f "$f" ] && continue
            echo "  -> $f"
            ERROR_MSG=$(clang-format -style=file --dry-run --Werror "$f" 2>&1) || {
              EXIT_CODE=1
              echo "clang-format failed for $f:"
              echo "$ERROR_MSG"
            }
          done <<< "$FILES"
          exit $EXIT_CODE

      - name: No C/C++ changes
        if: steps.changed_files.outputs.files == ''
        run: echo "No C/C++ files changed; skipping clang-format."