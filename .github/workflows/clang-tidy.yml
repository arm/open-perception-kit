name: Clang-tidy

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  clang-tidy:
    name: Clang-tidy
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find changed files
        id: changes
        if: github.event.pull_request.changed_files < 3000
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: |
            sources:
              - added|modified: 'development/**/*.{c,cc,cpp,cxx,C}'
            full:
              - 'development/**/*.{h,hh,hpp,hxx,H,tpp,inl,inc,ipp,h.in,hpp.in}'
              - 'development/subprojects/**'
              - '**/meson.build'
              - '**/meson.options'
              - '**/meson_options.txt'
              - '.clang-tidy'
              - '.clang-format'
              - 'setup.cfg'
              - '.github/workflows/clang-tidy.yml'
              - '.github/actions/setup-build/**'
              - '.github/actions/setup-sdk/**'
              - 'requirements/build.json'
              - 'requirements/meson.txt'
              - 'requirements/sdk.txt'
              - 'tools/flowdata-sdk/**'
              - 'tools/perception/**'
              - 'schemas/perception/**'
              - 'generated/perception/**'
              - 'config/schemas/**'
              - 'scripts/build.sh'
              - 'scripts/perception-sdk.sh'
              - 'scripts/private/shtools.sh'
              - 'scripts/private/run-perception-sdk.sh'
              - 'scripts/private/install-perception-flatbuffers.sh'
              - 'scripts/private/install-onnxruntime.sh'
              - 'scripts/setup-python-ops-runtime.sh'
              - 'development/ops-python/runtime.json'
              - 'development/web/package*.json'

      - name: Select changed-line check
        id: scope
        env:
          HAS_RELEVANT_CHANGES: ${{ github.event.pull_request.changed_files >= 3000 || steps.changes.outputs.full == 'true' }}
          HAS_SOURCES: ${{ steps.changes.outputs.sources == 'true' }}
        run: |
          if [[ "$HAS_RELEVANT_CHANGES" == true || "$HAS_SOURCES" == true ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up build environment
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/setup-build

      - name: Install clang-tidy
        if: steps.scope.outputs.run == 'true'
        run: python3 -m pip install clang-tidy==20.1.0 ./tools/opk-ci

      - name: Build
        if: steps.scope.outputs.run == 'true'
        run: ./scripts/build.sh debug true

      - name: Check changed lines
        if: steps.scope.outputs.run == 'true'
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          CLANG_TIDY_BASE="origin/$PR_BASE_REF" ninja -C development/build-active clang-tidy-new
          grep -q 'Unique findings: 0\.' development/build-active/meson-logs/clang-tidy-new.md
