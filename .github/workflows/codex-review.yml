name: Codex Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run codex-reviewer
        id: review
        uses: Arm-Debug/codex-reviewer@v0.2.0
        with:
          openai-api-key: ${{ secrets.OPENAI_PROXY_KEY_FOR_SELF_HOSTED_RUNNERS }}
          github-token: ${{ github.token }}
          config-path: .github/codex-reviewer/config.base-branch.json
          instructions-path: .github/instructions/codex-review.instructions.md
          base-branch: origin/${{ github.base_ref || github.ref_name }}
          output-dir: codex-reviewer-out
          publish-review: "true"
          codex-bypass-sandbox: "true"

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-reviewer-out
          path: ${{ steps.review.outputs.output-dir }}
          if-no-files-found: warn
