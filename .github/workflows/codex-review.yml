name: Codex Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Branch or ref to diff against for manual runs
        required: false
        default: origin/main
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Render Codex review prompt
        shell: bash
        env:
          REVIEW_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.base_ref || format('origin/{0}', github.base_ref) }}
          REVIEW_HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          REVIEW_REPOSITORY: ${{ github.repository }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          REVIEW_PR_TITLE: ${{ github.event.pull_request.title || '' }}
          REVIEW_PR_URL: ${{ github.event.pull_request.html_url || '' }}
        run: |
          mkdir -p codex-review/out
          ./codex-review/scripts/render-prompt.sh codex-review/out/review.prompt.md

      - name: Prepare isolated Codex home
        shell: bash
        run: |
          codex_home="${RUNNER_TEMP}/codex-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          mkdir -p "${codex_home}"
          printf '{"port":0}\n' > "${codex_home}/${GITHUB_RUN_ID}.json"
          cat > "${codex_home}/config.toml" <<'EOF'
          model_provider = "arm-openai-proxy"

          [model_providers.arm-openai-proxy]
          name = "Arm OpenAI proxy"
          base_url = "https://openai-api-proxy.geo.arm.com/api/providers/openai/v1"
          wire_api = "responses"
          env_key = "OPENAI_API_KEY"
          EOF
          echo "CODEX_HOME=${codex_home}" >> "${GITHUB_ENV}"

      # <codex-review:suppress-begin> Intentional current self-hosted Codex
      # review trust boundary for same-repo pull requests.
      - name: Run Codex review
        id: review
        uses: openai/codex-action@v1
        env:
          CODEX_HOME: ${{ env.CODEX_HOME }}
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/codex-review/.npmrc
          OPENAI_API_KEY: ${{ secrets.OPENAI_PROXY_KEY_FOR_SELF_HOSTED_RUNNERS }}
        with:
          model: gpt-5.3-codex
          sandbox: danger-full-access
          safety-strategy: unsafe
          prompt-file: codex-review/out/review.prompt.md
          output-schema-file: codex-review/schemas/review.schema.json
          output-file: codex-review/out/review.json
      # <codex-review:suppress-end>

      - name: Render review summary
        if: ${{ success() }}
        shell: bash
        run: |
          python3 ./codex-review/scripts/publish-review.py \
            --input codex-review/out/review.json \
            --markdown-out codex-review/out/review-summary.md
          cat codex-review/out/review-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish review summary comment
        if: ${{ success() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 ./codex-review/scripts/publish-review.py \
            --input codex-review/out/review.json \
            --markdown-out codex-review/out/review-summary.md \
            --publish-pr-comment

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: codex-review-out
          path: codex-review/out
          if-no-files-found: warn
