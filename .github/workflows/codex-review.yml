name: Codex Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Debug npm registry config
        shell: bash
        env:
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc
        run: |
          echo "pwd=$(pwd)"
          echo "workspace=${GITHUB_WORKSPACE}"
          echo "NPM_CONFIG_USERCONFIG=${NPM_CONFIG_USERCONFIG}"
          echo "repo .npmrc:"
          if [ -f "${GITHUB_WORKSPACE}/.npmrc" ]; then
            sed -e 's/_authToken=.*/_authToken=[REDACTED]/' "${GITHUB_WORKSPACE}/.npmrc"
          else
            echo "not found"
          fi

      - name: Run codex-reviewer
        id: review
        uses: Arm-Debug/codex-reviewer@v0.2.1
        env:
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc
        with:
          openai-api-key: ${{ secrets.OPENAI_PROXY_KEY_FOR_SELF_HOSTED_RUNNERS }}
          github-token: ${{ github.token }}
          config-path: .github/codex-reviewer/config.base-branch.json
          instructions-path: .github/instructions/codex-review.instructions.md
          base-branch: origin/${{ github.base_ref || github.ref_name }}
          output-dir: codex-reviewer-out
          # openai/codex-action defaults to drop-sudo, which does not fit this self-hosted runner setup.
          safety-strategy: unsafe
          publish-review: "true"
          codex-bypass-sandbox: "true"

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: codex-reviewer-out
          path: ${{ steps.review.outputs.output-dir }}
          if-no-files-found: warn
