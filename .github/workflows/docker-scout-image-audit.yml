name: Docker Scout Image Audit

on:
  workflow_call:
    secrets:
      DOCKER_USER:
        required: true
      DOCKER_TOKEN:
        required: true
  workflow_dispatch:
  pull_request:
    branches: [ main, develop, "feature/**", "sandbox/**" ]
    types: [ labeled, synchronize, reopened ]
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  docker-scout:
    name: docker-scout (${{ matrix.image.service }})
    runs-on: ${{ matrix.image.runner }}
    if: |
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (github.event.action == 'labeled' && github.event.label.name == 'run-docker-scout') ||
          ((github.event.action == 'synchronize' || github.event.action == 'reopened') &&
            contains(github.event.pull_request.labels.*.name, 'run-docker-scout'))
        )
      )
    strategy:
      fail-fast: false
      matrix:
        image:
          - service: pek-deployment-base
            runner: self-hosted-ubuntu-latest-arm64
            scout-asset: docker-scout-action_linux_arm64
          - service: pek-docs
            runner: self-hosted-ubuntu-latest-x64
            scout-asset: docker-scout-action_linux_amd64
          - service: pek-dev
            runner: self-hosted-ubuntu-latest-x64
            scout-asset: docker-scout-action_linux_amd64
          - service: pek-pre-commit-runtime
            runner: self-hosted-ubuntu-latest-x64
            scout-asset: docker-scout-action_linux_amd64
          - service: pek-playwright-pages
            runner: self-hosted-ubuntu-latest-x64
            scout-asset: docker-scout-action_linux_amd64

    env:
      DOCKER_COMPOSE_FILE: .github/compose.ci.yaml
      CI_CHECKOUT_PATH: repo-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.image.service }}
      COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

    steps:
      - name: Checkout current ref
        id: checkout-current-ref
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.ref }}
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Checkout pull request head
        id: checkout-pr-head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Validate Docker Scout credentials
        id: validate-docker-credentials
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKER_USER}" ] || [ -z "${DOCKER_TOKEN}" ]; then
            echo "DOCKER_USER and DOCKER_TOKEN are required for Docker Scout image audits." >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }} # pragma: allowlist secret

      - name: Build docker image
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} build ${{ matrix.image.service }}

      - name: Resolve built image reference
        id: resolve-image
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          image_ref="${COMPOSE_PROJECT_NAME}-${{ matrix.image.service }}:latest"
          if ! docker image inspect "${image_ref}" >/dev/null 2>&1; then
            echo "Expected compose-built image tag '${image_ref}' was not found for service '${{ matrix.image.service }}'." >&2
            exit 1
          fi
          mkdir -p ".github/artifacts/docker-scout/${{ matrix.image.service }}"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"

      - name: Download Docker Scout action binary with authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          action_dir="$(dirname "$RUNNER_WORKSPACE")/_actions/docker/scout-action/v1.24.0"
          mkdir -p "$action_dir/dist"
          gh release download v1.24.0 \
            --repo docker/scout-action \
            --pattern ${{ matrix.image.scout-asset }} \
            --dir "$action_dir/dist" \
            --clobber

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        env:
          SYFT_PARALLELISM: "1"
        with:
          image: ${{ steps.resolve-image.outputs.image_ref }}
          format: spdx-json
          output-file: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/.github/artifacts/docker-scout/${{ matrix.image.service }}/image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Run Docker Scout CVE audit
        id: docker-scout
        uses: docker/scout-action@v1.24.0
        with:
          command: cves
          image: sbom://${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/.github/artifacts/docker-scout/${{ matrix.image.service }}/image.spdx.json
          dockerhub-user: ${{ secrets.DOCKER_USER }}
          dockerhub-password: ${{ secrets.DOCKER_TOKEN }}
          github-token: ${{ github.token }}
          sarif-file: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/.github/artifacts/docker-scout/${{ matrix.image.service }}/cves.sarif.json
          summary: true
          write-comment: false

      - name: Render Docker Scout component report
        if: |
          always() &&
          !cancelled() &&
          (
            steps.checkout-current-ref.conclusion == 'success' ||
            steps.checkout-pr-head.conclusion == 'success'
          )
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          artifact_dir=".github/artifacts/docker-scout/${{ matrix.image.service }}"
          python3 scripts/private/docker_scout_component_report.py \
            --service "${{ matrix.image.service }}" \
            --sarif-file "$artifact_dir/cves.sarif.json" \
            --markdown-output "$artifact_dir/component-report.md" \
            --json-output "$artifact_dir/component-report.json" \
            --summary-limit 6 \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Write report metadata
        if: |
          always() &&
          !cancelled() &&
          (
            steps.checkout-current-ref.conclusion == 'success' ||
            steps.checkout-pr-head.conclusion == 'success'
          )
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: |
          mkdir -p ".github/artifacts/docker-scout/${{ matrix.image.service }}"
          cat <<EOF > ".github/artifacts/docker-scout/${{ matrix.image.service }}/report.txt"
          service=${{ matrix.image.service }}
          image_ref=${{ steps.resolve-image.outputs.image_ref }}
          credentials_available=${{ steps.validate-docker-credentials.outcome == 'success' }}
          scout_outcome=${{ steps.docker-scout.outcome }}
          scout_summary=github-job-summary
          sbom_file=image.spdx.json
          sarif_file=cves.sarif.json
          component_report_markdown=component-report.md
          component_report_json=component-report.json
          EOF

      - name: Upload Docker Scout artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-scout-${{ matrix.image.service }}
          path: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/.github/artifacts/docker-scout/${{ matrix.image.service }}
          if-no-files-found: warn
          retention-days: 10

      - name: Clean Docker Scout workspace and image
        if: always()
        run: |
          set +e
          checkout_path="${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}"
          expected_workspace_prefix="${{ github.workspace }}/repo-"
          image_ref="${{ steps.resolve-image.outputs.image_ref }}"
          case "${checkout_path}" in
            "${expected_workspace_prefix}"*)
              ;;
            *)
              echo "Skipping cleanup for unexpected checkout_path='${checkout_path}'" >&2
              exit 0
              ;;
          esac
          if [ -n "$image_ref" ]; then
            docker image rm -f "$image_ref" || true
          fi
          rm -rf "$checkout_path"
