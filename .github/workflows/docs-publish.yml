name: Publish Docs

on:
  push:
    branches:
      - "develop"
    tags-ignore:
      - "**"
    paths:
      - .github/workflows/docs-publish.yml
      - docs/**
      - scripts/private/inject_docs_build_info.py
  workflow_dispatch:
    inputs:
      publish_ref:
        description: Commit SHA or ref to publish.
        required: false
        default: ""
  workflow_call:
    inputs:
      publish_ref:
        description: Commit SHA or ref to publish.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish-docs:
    name: Publish docs site
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-1
      AWS_ROLE_ARN: arn:aws:iam::529607359382:role/Proj-GHA-amp-dev-forge-s3-upload
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.publish_ref || github.sha }}

      - name: Inject published build info
        shell: bash
        run: |
          python3 scripts/private/inject_docs_build_info.py --target docs/public/index.md

      - name: Validate docs site
        uses: ARM-software/docs-action/validate@v0.3.1
        with:
          docs-root: docs/public
          site-id: perception-xpk

      - name: AWS GitHub OIDC Login
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish docs site
        uses: ARM-software/docs-action/publish@v0.3.1
        with:
          docs-root: docs/public
          site-id: perception-xpk
          environment: staging

      - name: Write publish summary
        shell: bash
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Summary

          - Published ref: `${{ inputs.publish_ref || github.sha }}`
          - Site URL: [https://docs.staging.devplatform.arm.com/perception-xpk](https://docs.staging.devplatform.arm.com/perception-xpk)
          EOF
