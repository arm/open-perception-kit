name: Meson tests

on:
  pull_request:
    paths: &paths
      - 'development/**'
      - 'config/**'
      - 'schemas/perception/**'
      - 'generated/perception/**'
      - 'tools/perception/**'
      - 'tools/flowdata-sdk/**'
      - 'tools/config_versions.py'
      - 'tools/opk-menu'
      - '**/meson.build'
      - '**/meson.options'
      - '**/meson_options.txt'
      - 'requirements/build.json'
      - 'requirements/meson.txt'
      - 'requirements/sdk.txt'
      - 'scripts/build.sh'
      - 'scripts/perception-sdk.sh'
      - 'scripts/setup-python-ops-runtime.sh'
      - 'scripts/setup-lxc-dev.sh'
      - 'scripts/quick_start.sh'
      - 'scripts/quick-start/**'
      - 'scripts/download-models.py'
      - 'scripts/opksink-web.sh'
      - 'scripts/run.sh'
      - 'scripts/release/**'
      - 'scripts/private/shtools.sh'
      - 'scripts/private/run-perception-sdk.sh'
      - 'scripts/private/install-perception-flatbuffers.sh'
      - 'scripts/private/install-onnxruntime.sh'
      - 'scripts/private/clang-tidy-report.py'
      - 'scripts/private/deployment-*.sh'
      - 'scripts/private/development-entrypoint.sh'
      - 'scripts/private/generate-hf-download-cachebust.sh'
      - 'scripts/private/download-demo-videos.sh'
      - 'scripts/private/demo-videos.manifest'
      - 'scripts/private/detect-webrtc-host-ip.sh'
      - 'scripts/private/select-webrtc-turn-mode.sh'
      - 'Dockerfile'
      - 'compose*.yaml'
      - '.devcontainer/compose*.yaml'
      - '.clang-format'
      - 'setup.cfg'
      - '.github/actions/setup-build/**'
      - '.github/actions/setup-sdk/**'
      - '.github/workflows/meson-tests.yml'
  push:
    branches: [main, develop]
    paths: *paths
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  meson-tests:
    name: Meson tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build

      - name: Build
        run: ./scripts/build.sh release true

      - name: Install test dependencies
        run: python3 -m pip install -r requirements/tests.txt

      - name: Run tests
        run: meson test -C development/build-active --print-errorlogs

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: meson-test-logs
          path: development/build-active/meson-logs/
          if-no-files-found: warn
          retention-days: 7
