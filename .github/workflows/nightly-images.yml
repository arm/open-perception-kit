name: Nightly images

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  images:
    name: ${{ matrix.target }} image (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: [opk-docs, opk-cairn-runtime]
        platform:
          - {arch: x86_64, runner: ubuntu-24.04}
          - {arch: aarch64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build image
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p nightly-logs
          git rev-parse HEAD > nightly-logs/source-commit.txt
          docker buildx build --load --progress=plain --target "$TARGET" \
            --tag "opk-nightly-$TARGET" . 2>&1 | tee nightly-logs/image.txt
      - name: Retain logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-${{ matrix.target }}-logs-${{ matrix.platform.arch }}
          path: nightly-logs/
          if-no-files-found: warn
          retention-days: 14
