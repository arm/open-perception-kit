name: Nightly builds (build coverage)

on:
  push:
    branches: [test/EXPKITS-1514-nightly-once]
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      upload_packages:
        description: Retain the generated packages for 14 days
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  development:
    name: Development build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, deb_arch: amd64, runner: ubuntu-24.04}
          - {arch: aarch64, deb_arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare build
        env:
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          mkdir -p nightly-logs
          git rev-parse HEAD > nightly-logs/source-commit.txt
          cache_key="$(scripts/private/generate-hf-download-cachebust.sh)"
          echo "HF_DOWNLOAD_CACHEBUST=$cache_key" >> "$GITHUB_ENV"
          bash scripts/private/executorch/fetch-released-deb.sh "$DEB_ARCH" var 2>&1 | tee nightly-logs/executorch.txt
      - name: Build development image
        run: |
          docker buildx build --load --progress=plain --target opk-dev \
            --build-arg USER_UID="$(id -u)" --build-arg USER_GID="$(id -g)" \
            --build-arg NO_EXAMPLE_CONTENT=true \
            --build-arg HF_DOWNLOAD_CACHEBUST="$HF_DOWNLOAD_CACHEBUST" \
            --tag opk-nightly-dev . 2>&1 | tee nightly-logs/development-image.txt
      - name: Build and test debug
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e OPK_EXECUTORCH=enabled -e OPK_PYTHON_OPS=enabled \
            opk-nightly-dev bash -lc \
            './scripts/build.sh clean && ./scripts/build.sh debug true && meson test -C development/build-active --print-errorlogs' \
            2>&1 | tee nightly-logs/development-debug.txt
          cp -a development/build-active/meson-logs nightly-logs/debug-meson-logs
      - name: Build and test release
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e OPK_EXECUTORCH=enabled -e OPK_PYTHON_OPS=enabled \
            opk-nightly-dev bash -lc \
            './scripts/build.sh clean && ./scripts/build.sh release true && meson test -C development/build-active --print-errorlogs' \
            2>&1 | tee nightly-logs/development-release.txt
      - name: Retain logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-development-logs-${{ matrix.arch }}
          path: |
            nightly-logs/
            development/build*/meson-logs/
          if-no-files-found: warn
          retention-days: 14

  images:
    name: ${{ matrix.target }} image (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: [opk-docs, opk-cairn-runtime]
        platform:
          - {arch: x86_64, runner: ubuntu-24.04}
          - {arch: aarch64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build image
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p nightly-logs
          git rev-parse HEAD > nightly-logs/source-commit.txt
          docker buildx build --load --progress=plain --target "$TARGET" \
            --tag "opk-nightly-$TARGET" . 2>&1 | tee nightly-logs/image.txt
      - name: Retain logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-${{ matrix.target }}-logs-${{ matrix.platform.arch }}
          path: nightly-logs/
          if-no-files-found: warn
          retention-days: 14

  packages:
    name: ${{ matrix.kind }} package build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kind: archive, arch: x86_64, deb_arch: amd64, runner: ubuntu-24.04}
          - {kind: archive, arch: aarch64, deb_arch: arm64, runner: ubuntu-24.04-arm}
          - {kind: debian, arch: x86_64, deb_arch: amd64, runner: ubuntu-24.04}
          - {kind: debian, arch: aarch64, deb_arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare build
        env:
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          mkdir -p nightly-logs nightly-packages
          git rev-parse HEAD > nightly-logs/source-commit.txt
          cache_key="$(scripts/private/generate-hf-download-cachebust.sh)"
          echo "HF_DOWNLOAD_CACHEBUST=$cache_key" >> "$GITHUB_ENV"
          python3 -c 'from pathlib import Path; from scripts.release.ReleaseTool import read_version; print("OPK_VERSION=" + read_version(Path.cwd()))' >> "$GITHUB_ENV"
          bash scripts/private/executorch/fetch-released-deb.sh "$DEB_ARCH" var 2>&1 | tee nightly-logs/executorch.txt
      - name: Build deployment image and archive
        if: matrix.kind == 'archive'
        run: |
          docker buildx build --load --progress=plain --target opk-deployment-base \
            --build-arg OPK_RELEASE_BUILD=true --build-arg OPK_MLWL=enabled \
            --build-arg NO_EXAMPLE_CONTENT=true \
            --build-arg OPK_RELEASE_VERSION="$OPK_VERSION" \
            --build-arg OPK_RELEASE_SOURCE_COMMIT="$GITHUB_SHA" \
            --tag opk-nightly-deployment . 2>&1 | tee nightly-logs/deployment-image.txt
          container_id="$(docker create opk-nightly-deployment)"
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          docker cp "$container_id:/opt/opk-release-artifacts/." nightly-packages/
      - name: Build Debian packages
        if: matrix.kind == 'debian'
        run: |
          docker buildx build --progress=plain --target opk-debian-packages \
            --build-arg OPK_RELEASE_BUILD=true --build-arg OPK_MLWL=enabled \
            --build-arg NO_EXAMPLE_CONTENT=true \
            --build-arg OPK_RELEASE_SOURCE_COMMIT="$GITHUB_SHA" \
            --build-arg HF_DOWNLOAD_CACHEBUST="$HF_DOWNLOAD_CACHEBUST" \
            --output type=local,dest=nightly-packages . \
            2>&1 | tee nightly-logs/debian-packages.txt
      - name: Test packages in a clean Debian container
        env:
          PACKAGE_KIND: ${{ matrix.kind }}
        run: |
          docker run --rm \
            -v "$PWD/nightly-packages:/artifacts:ro" -v "$PWD:/source:ro" \
            debian:trixie-slim bash /source/scripts/testing/nightly-package-smoke.sh "$PACKAGE_KIND" \
            2>&1 | tee nightly-logs/package-smoke.txt
      - name: Report remaining nightly coverage
        if: always()
        run: echo 'Inference, container entrypoint and packaged SDK consumer tests are not yet implemented.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain packages when requested
        if: inputs.upload_packages == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-${{ matrix.kind }}-packages-${{ matrix.arch }}
          path: nightly-packages/
          if-no-files-found: error
          retention-days: 14
      - name: Retain logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-${{ matrix.kind }}-logs-${{ matrix.arch }}
          path: nightly-logs/
          if-no-files-found: warn
          retention-days: 14
