name: PEK CI Image Cleanup

on:
  pull_request_target:
    branches: [main, develop, "feature/**", "sandbox/**"]
    types: [closed, synchronize]
  workflow_run:
    workflows: [PEK CI]
    types: [completed]

permissions:
  contents: read

jobs:
  cleanup-pr-image:
    name: Delete superseded PR CI image
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - name: Checkout trusted workflow helper
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Delete superseded PR image
        env:
          GH_TOKEN: ${{ github.token }}
          PR_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_IMAGE_TAG: ${{ github.event.action == 'closed' && github.event.pull_request.head.sha || github.event.before }}
        run: |
          if [ "$PR_ACTION" != closed ]; then
            python3 scripts/private/ci_image.py cleanup "$CI_IMAGE_TAG"
            exit
          fi
          while IFS= read -r commit_sha; do
            python3 scripts/private/ci_image.py cleanup "$commit_sha"
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" --jq '.[].sha')

  cleanup-run-image:
    name: Delete completed run CI image
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Checkout trusted workflow helper
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download image cleanup metadata
        id: metadata
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: pek-ci-image-metadata
          path: ${{ runner.temp }}/pek-ci-image-metadata
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Delete completed run image
        if: steps.metadata.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/private/ci_image.py cleanup-metadata
          "${RUNNER_TEMP}/pek-ci-image-metadata/pek-ci-image.json"
