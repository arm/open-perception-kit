name: PEK CI Image Cleanup

on:
  pull_request_target:
    branches: [main, develop, "feature/**", "sandbox/**"]
    types: [closed, synchronize]

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete superseded PR CI image
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout trusted workflow helper
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Delete superseded PR image
        env:
          GH_TOKEN: ${{ github.token }}
          CI_IMAGE_TAG: ${{ github.event.action == 'closed' && github.event.pull_request.head.sha || github.event.before }}
        run: python3 scripts/private/ci_image.py cleanup "$CI_IMAGE_TAG"
