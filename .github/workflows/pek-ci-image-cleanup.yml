name: PEK CI Image

on:
  pull_request_target:
    branches: [main, develop, "feature/**", "sandbox/**"]
    types: [closed]
  workflow_run:
    workflows: ["PEK CI"]
    types: [completed]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pek-ci-image-${{ github.event.pull_request.number || github.run_id }}

jobs:
  resolve-blackduck-pr-context:
    name: Resolve Black Duck PR context
    if: >-
      (
        github.event_name == 'pull_request_target' &&
        github.event.action == 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (
          (
            github.event.workflow_run.event == 'pull_request' &&
            github.event.workflow_run.pull_requests[0].number
          ) ||
          (
            github.event.workflow_run.event == 'workflow_dispatch' &&
            github.event.workflow_run.actor.login == 'github-actions[bot]' &&
            startsWith(github.event.workflow_run.display_title, 'PEK CI (head): ') &&
            contains(github.event.workflow_run.display_title, ' run-pek-ci ')
          )
        )
      )
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      closed: ${{ steps.pr.outputs.closed }}
      number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Check PR is closed
        id: pr
        env:
          DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            test "$RUN_EVENT" = workflow_dispatch
            context="${DISPLAY_TITLE#PEK CI (head): }"
            read -r head_sha pr_label PR_NUMBER extra <<< "$context"
            test -z "${extra:-}"
            test "${#head_sha}" = 40
            case "$head_sha" in *[!0-9a-f]*) exit 1 ;; esac
            test "$pr_label" = run-pek-ci
          fi
          case "$PR_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          state="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .state)"
          if [ "$state" = closed ]; then
            echo 'closed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'closed=false' >> "$GITHUB_OUTPUT"
          fi

  cleanup-superseded-pr-caches:
    name: Delete superseded PR compiler caches
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    concurrency:
      group: pr-cache-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: false
    steps:
      - name: Delete superseded PR compiler caches
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PR_REF: refs/pull/${{ github.event.workflow_run.pull_requests[0].number }}/merge
        run: |
          set -euo pipefail
          current_head_sha="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          if [ "$current_head_sha" != "$HEAD_SHA" ]; then
            echo "Skipping stale run for $HEAD_SHA; current PR head is $current_head_sha"
            exit 0
          fi

          gh api --paginate --method GET "repos/${GITHUB_REPOSITORY}/actions/caches" \
            -f ref="$PR_REF" -f per_page=100 |
            jq -sr --arg head_sha "$HEAD_SHA" '
              [.[].actions_caches[]
               | select(.key | startswith("pek-ccache-"))
               | select(.key | test("-[0-9a-f]{40}$"))] as $caches
              | [$caches[]
                 | select(.key | endswith("-" + $head_sha))
                 | .key[:-40]] as $replaced_prefixes
              | $caches[]
              | select((.key | endswith("-" + $head_sha)) | not)
              | select(.key[:-40] as $prefix | $replaced_prefixes | index($prefix))
              | [.id, .key] | @tsv
            ' |
            while IFS=$'\t' read -r cache_id cache_key; do
              echo "Deleting superseded cache: $cache_key"
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}"
            done

  cleanup-blackduck-pr-version:
    name: Delete Black Duck PR version
    needs: resolve-blackduck-pr-context
    if: ${{ needs.resolve-blackduck-pr-context.outputs.closed == 'true' }}
    runs-on: self-hosted-ubuntu-latest-x64
    permissions:
      contents: read
    concurrency:
      group: blackduck-pr-${{ needs.resolve-blackduck-pr-context.outputs.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout cleanup helper
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: blackduck-cleanup
          persist-credentials: false

      - name: Delete Black Duck PR version
        env:
          BLACKDUCK_TOKEN: ${{ secrets.BLACKDUCK_TOKEN }} # pragma: allowlist secret
          BLACKDUCK_URL: ${{ secrets.BLACKDUCK_URL }}
          VERSION_NAME: pr-${{ needs.resolve-blackduck-pr-context.outputs.number }}
        run: blackduck-cleanup/.github/scripts/blackduck_version_cleanup.sh delete "$VERSION_NAME"

  cleanup-pr-caches:
    name: Delete PR caches
    if: ${{ github.event_name == 'pull_request_target' && github.event.action == 'closed' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    concurrency:
      group: pr-cache-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Delete PR caches
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -euo pipefail
          gh api --paginate --method GET "repos/${GITHUB_REPOSITORY}/actions/caches" \
            -f ref="$PR_REF" -f per_page=100 --jq '.actions_caches[].id' |
            while IFS= read -r cache_id; do
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}"
            done

  cleanup-stale-images:
    name: Delete stale PEK CI images
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout cleanup helper
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Delete CI images older than one day
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/private/ci_image.py retain-ci --hours 24

  cleanup-retired-yolo-cache:
    name: Delete retired YOLO Pages dataset cache
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete retired YOLO Pages dataset cache
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          LEGACY_CACHE_KEY: yolo-performance-datasets-coco-val2017-4f7e2ccb2866ec5041993c9cf2a952bbed69647b115d0f74da7ce8f4bef82f05
        run: |
          set -euo pipefail
          gh api --paginate --method GET "repos/${GITHUB_REPOSITORY}/actions/caches" \
            -f key="${LEGACY_CACHE_KEY}" -f ref="refs/heads/${DEFAULT_BRANCH}" -f per_page=100 \
            --jq '.actions_caches[].id' |
            while IFS= read -r cache_id; do
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}"
            done
