name: PEK CI Image

on:
  pull_request_target:
    branches: [main, develop, "feature/**", "sandbox/**"]
    types: [closed, synchronize]
  workflow_run:
    workflows: [PEK CI]
    types: [completed]

permissions:
  contents: read

jobs:
  cleanup-run-cache:
    name: Delete CI image cache
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete run-scoped cache
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: pek-ci-image-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
        run: |
          cache_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=${CACHE_KEY}" --jq '.actions_caches[0].id // empty')"
          if [ -n "$cache_id" ]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}"
          fi

  cleanup-pr-image:
    name: Delete superseded PR CI image
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - name: Checkout trusted workflow helper
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Delete superseded PR image
        env:
          GH_TOKEN: ${{ github.token }}
          PR_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_IMAGE_TAG: ${{ github.event.action == 'closed' && github.event.pull_request.head.sha || github.event.before }}
        run: |
          if [ "$PR_ACTION" != closed ]; then
            python3 scripts/private/ci_image.py cleanup "$CI_IMAGE_TAG"
            exit
          fi
          while IFS= read -r commit_sha; do
            python3 scripts/private/ci_image.py cleanup "$commit_sha"
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" --jq '.[].sha')

  publish-build-cache:
    name: Publish Docker cache
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["push","schedule"]'), github.event.workflow_run.event) &&
      contains(fromJSON('["main","develop"]'), github.event.workflow_run.head_branch) &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Checkout trusted workflow helper
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download CI image
        uses: actions/download-artifact@v8
        with:
          name: pek-ci-image
          path: ${{ runner.temp }}/pek-ci-image
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish trusted Docker cache
        env:
          EXPECTED_IMAGE_TAG: ${{ format('{0}-{1}-{2}', github.event.workflow_run.head_sha, github.event.workflow_run.id, github.event.workflow_run.run_attempt) }}
        run: |
          python3 scripts/private/ci_image.py publish-cache \
            "${RUNNER_TEMP}/pek-ci-image/pek-ci-image.tar" \
            "${RUNNER_TEMP}/pek-ci-image/pek-ci-image.json" \
            "$EXPECTED_IMAGE_TAG"
