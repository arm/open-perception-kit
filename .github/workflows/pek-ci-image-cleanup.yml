name: PEK CI Image

on:
  pull_request_target:
    branches: [main, develop, "feature/**", "sandbox/**"]
    types: [closed]
  workflow_run:
    workflows: [PEK CI]
    types: [completed]

permissions:
  contents: read

jobs:
  cleanup-run-cache:
    name: Delete CI image cache
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete run-scoped cache
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: pek-ci-image-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
        run: |
          cache_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=${CACHE_KEY}" --jq '.actions_caches[0].id // empty')"
          if [ -n "$cache_id" ]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}"
          fi

  cleanup-pr-caches:
    name: Delete PR caches
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete PR caches
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          gh api --paginate --method GET "repos/${GITHUB_REPOSITORY}/actions/caches" \
            -f ref="$PR_REF" -f per_page=100 --jq '.actions_caches[].id' |
            while IFS= read -r cache_id; do
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}"
            done
