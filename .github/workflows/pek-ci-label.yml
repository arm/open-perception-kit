name: PEK CI label rerun

on:
  pull_request_target:
    branches: [main, develop, "feature/**", "sandbox/**"]
    types: [labeled]
  workflow_run:
    workflows: [PEK CI]
    types: [completed]

permissions: {}

jobs:
  dispatch-conflicted-pr:
    name: Dispatch PEK CI for conflicted head
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' &&
      contains(fromJSON('["run-pek-ci","run-macos-ci","run-rpi-ci","run-python-audit","run-docker-scout","run-workflow-audit"]'), github.event.label.name) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Dispatch exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABEL: ${{ github.event.label.name }}
          WORKFLOW_REF: ${{ github.event.repository.default_branch }}
        run: |
          read -r mergeable base_ref head_ref head_sha < <(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '[(.mergeable | tostring), .base.ref, .head.ref, .head.sha] | @tsv'
          )
          if [ "$mergeable" = true ]; then
            echo "The native pull_request workflow handles this PR."
            exit 0
          fi

          # ponytail: an unknown mergeability result dispatches too; duplication is safer than dropping the label request.
          checks=label
          if [ "$PR_LABEL" = run-pek-ci ]; then
            checks=all
          fi
          gh workflow run pek-ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$WORKFLOW_REF" \
            -f checks="$checks" \
            -f pr_number="$PR_NUMBER" \
            -f pr_base_ref="$base_ref" \
            -f pr_head_ref="$head_ref" \
            -f pr_head_sha="$head_sha" \
            -f pr_label="$PR_LABEL"

  report-dispatched-run:
    name: Report PEK CI head result
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.actor.login == 'github-actions[bot]' &&
      startsWith(github.event.workflow_run.display_title, 'PEK CI (head): ') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      statuses: write
    steps:
      - name: Report result on exact PR head
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          context="${DISPLAY_TITLE#PEK CI (head): }"
          read -r head_sha pr_label extra <<< "$context"
          test -z "${extra:-}"
          test "${#head_sha}" = 40
          case "$head_sha" in *[!0-9a-f]*) exit 1 ;; esac
          case "$pr_label" in
            run-pek-ci|run-macos-ci|run-rpi-ci|run-python-audit|run-docker-scout|run-workflow-audit) ;;
            *) exit 1 ;;
          esac

          case "$CONCLUSION" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac

          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
            -f state="$state" \
            -f context="PEK CI (head): ${pr_label}" \
            -f description="${pr_label} head validation concluded: ${CONCLUSION}" \
            -f target_url="$RUN_URL"
          test "$state" = success
