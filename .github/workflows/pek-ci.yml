          git submodule update --init --recursive

      - name: Generate Hugging Face download cache key
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          cache_key="$(scripts/private/generate-hf-download-cachebust.sh)"
          echo "HF_DOWNLOAD_CACHEBUST=${cache_key}" >> "$GITHUB_ENV"

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_PATH }}
          key: pek-ccache-${{ env.CCACHE_SCHEMA_VERSION }}-${{ runner.os }}-${{ runner.arch }}-sonar-${{ needs.build-ci-image.outputs.head_sha }}
          restore-keys: |
            pek-ccache-${{ env.CCACHE_SCHEMA_VERSION }}-${{ runner.os }}-${{ runner.arch }}-sonar-

      - name: Run SonarQube release analysis
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_BRANCH: tags/${{ github.ref_name }}
          SONAR_PROJECT_VERSION: ${{ github.ref_name }}
          SONAR_QUALITYGATE_WAIT: "true"
          BUILD_STRING: ${{ needs.build-ci-image.outputs.head_sha }}
        run: |
          SONAR_PROJECT_VERSION="${SONAR_PROJECT_VERSION#release/}"
          export SONAR_PROJECT_VERSION
          docker compose -f "$DOCKER_COMPOSE_FILE" run --rm pek-sonar-check-release

      - name: Save compiler cache
        if: ${{ success() && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_PATH }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Cleanup isolated workspace
        if: always()
        run: |
          workspace_root="${WORKSPACE_ROOT:-}"
          expected_workspace_prefix="${GITHUB_WORKSPACE:-}/repo-"

          case "$workspace_root" in
            "${expected_workspace_prefix}"*) ;;
            *)
              echo "Skipping cleanup for unexpected WORKSPACE_ROOT='$workspace_root'" >&2
              exit 0
              ;;
          esac

          if [ -d "$workspace_root" ]; then
            if [ -f "$workspace_root/$DOCKER_COMPOSE_FILE" ]; then
              (
                cd "$workspace_root"
                docker compose -f "$DOCKER_COMPOSE_FILE" down --remove-orphans --rmi local || true
              )
            fi
            sudo chown -R "$(id -u):$(id -g)" "$workspace_root" || true
            chmod -R u+rwX "$workspace_root" || true
            rm -rf "$workspace_root" || sudo rm -rf "$workspace_root" || true
          fi
          if [ -n "${PEK_CI_IMAGE:-}" ]; then
            docker image rm "$PEK_CI_IMAGE" || true
          fi

  valgrind:
    name: Run Valgrind checks in Docker
    needs: build-ci-image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./valgrind-source
    if: |
      !cancelled() &&
      (
        github.event_name == 'schedule' ||
        (github.event_name == 'push' && github.ref_type == 'branch') ||
        (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","valgrind"]'), inputs.checks)) ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (github.event.action != 'labeled' || contains(github.event.label.name, 'run-pek-ci')) &&
          (
            github.event.pull_request.draft == false ||
            (github.event.action == 'labeled' && contains(github.event.label.name, 'run-pek-ci'))
          )
        )
      )
    permissions:
      actions: read
      contents: read
      artifact-metadata: write
      packages: read
    env:
      DOCKER_COMPOSE_FILE: .github/compose.ci.yaml
      VALGRIND_BASELINE_WORKFLOW: pek-ci.yml
      CCACHE_PATH: ${{ github.workspace }}/.cache/ccache
    steps:
      - name: Restore PEK CI image
        uses: actions/cache/restore@v6
        with:
          path: .cache/pek-ci-image
          key: ${{ env.CI_IMAGE_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Load PEK CI image
        working-directory: ${{ github.workspace }}
        env:
          CI_IMAGE_SHA: ${{ needs.build-ci-image.outputs.head_sha }}
          IMAGE_JOB_RESULT: ${{ needs.build-ci-image.result }}
        run: |
          test "$IMAGE_JOB_RESULT" = success
          tools_dir="${GITHUB_WORKSPACE}/.cache/pek-ci-image"
          echo "CI_IMAGE_TOOLS=$tools_dir" >> "$GITHUB_ENV"
          python3 "$tools_dir/ci_image.py" prepare "$CI_IMAGE_SHA" \
            --archive "$tools_dir/pek-ci-image.tar" \
            pek-valgrind-check \
            pek-generate-valgrind-summary

      - name: Prepare compiler cache
        working-directory: ${{ github.workspace }}
        run: install -d -m 0777 "$CCACHE_PATH"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.build-ci-image.outputs.head_sha }}
          path: valgrind-source
          persist-credentials: false

      - name: Prepare private submodules
        working-directory: ${{ github.workspace }}/valgrind-source
        env:
          DEPLOY_KEY_FLOWDATA_SDK: ${{ secrets.DEPLOY_KEY_FLOWDATA_SDK }}
        run: |
          source .github/scripts/configure_workspace_ssh.sh
          git submodule update --init --recursive

      - name: Generate Hugging Face download cache key
        run: |
          set -euo pipefail
          cache_key="$(scripts/private/generate-hf-download-cachebust.sh)"
          echo "HF_DOWNLOAD_CACHEBUST=${cache_key}" >> "$GITHUB_ENV"

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_PATH }}
          key: pek-ccache-${{ env.CCACHE_SCHEMA_VERSION }}-${{ runner.os }}-${{ runner.arch }}-valgrind-${{ needs.build-ci-image.outputs.head_sha }}
          restore-keys: |
            pek-ccache-${{ env.CCACHE_SCHEMA_VERSION }}-${{ runner.os }}-${{ runner.arch }}-valgrind-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Run Valgrind Python unit tests
        run: |
          cd "$CI_IMAGE_TOOLS/valgrind"
          python3 -m unittest \
            test_valgrind_baseline_artifact.py \
            test_compare_valgrind_results.py \
            test_summarize_valgrind_output.py

      - name: Download Valgrind baseline from GHCR
        if: needs.build-ci-image.outputs.pr_context == 'true'
        id: valgrind_baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VALGRIND_BASELINE_BRANCH: ${{ needs.build-ci-image.outputs.base_ref }}
          VALGRIND_BASELINE_SHA: ${{ needs.build-ci-image.outputs.base_sha }}
        run: |
          python3 "$CI_IMAGE_TOOLS/valgrind/valgrind-baseline-artifact.py" download \
            --sha "$VALGRIND_BASELINE_SHA" \
            --output-dir scripts/testing/valgrind/baseline

      - name: Wait for missing Valgrind baseline in GHCR
        if: >-
          needs.build-ci-image.outputs.pr_context == 'true' &&
          steps.valgrind_baseline.outcome != 'success'
        id: waited_valgrind_baseline
        env:
          GH_TOKEN: ${{ github.token }}
          VALGRIND_BASELINE_BRANCH: ${{ needs.build-ci-image.outputs.base_ref }}
          VALGRIND_BASELINE_SHA: ${{ needs.build-ci-image.outputs.base_sha }}
        run: |
          python3 "$CI_IMAGE_TOOLS/valgrind/valgrind-baseline-artifact.py" wait \
            --sha "$VALGRIND_BASELINE_SHA" \
            --output-dir scripts/testing/valgrind/baseline

      - name: Require existing Valgrind baseline
        if: >-
          needs.build-ci-image.outputs.pr_context == 'true' &&
          steps.valgrind_baseline.outcome != 'success' &&
          steps.waited_valgrind_baseline.outcome == 'skipped'
        run: |
          echo "Missing Valgrind baseline in GHCR and no automatic publisher is available." >&2
          exit 1

      - name: Clear stale Valgrind logs
        run: find scripts/testing/valgrind/logs -name "*.valgrind.*.xml" -delete 2>/dev/null || true

      - name: Run Valgrind checks
        id: valgrind_checks
        run: docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm pek-valgrind-check

      - name: Generate Valgrind error summary
        id: valgrind_summary
        if: always() && steps.valgrind_checks.outcome != 'skipped'
        run: docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm pek-generate-valgrind-summary

      - name: Compare Valgrind results to baseline
        if: ${{ needs.build-ci-image.outputs.pr_context == 'true' && steps.valgrind_checks.outcome == 'success' && steps.valgrind_summary.outcome == 'success' }}
        id: valgrind_compare
        run: |
          python3 "$CI_IMAGE_TOOLS/valgrind/compare-valgrind-results.py" \
            --baseline scripts/testing/valgrind/baseline/valgrind-error-summary.xml \
            --current scripts/testing/valgrind/valgrind-error-summary.xml

      - name: Upload Valgrind raw logs
        if: ${{ always() && !cancelled() && (steps.valgrind_checks.outcome == 'failure' || steps.valgrind_summary.outcome == 'failure' || steps.valgrind_compare.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: valgrind-baseline-logs
          path: valgrind-source/scripts/testing/valgrind/logs
          if-no-files-found: warn
          retention-days: 5

      - name: Upload Valgrind report artifact
        if: ${{ needs.build-ci-image.outputs.pr_context != 'true' && startsWith(github.ref, 'refs/heads/') && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && steps.valgrind_checks.outcome == 'success' && steps.valgrind_summary.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: valgrind-baseline
          path: valgrind-source/scripts/testing/valgrind/valgrind-error-summary.xml
          if-no-files-found: error
          retention-days: 60

      - name: Save compiler cache
        if: ${{ !cancelled() && steps.valgrind_checks.outcome == 'success' && steps.valgrind_summary.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_PATH }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

  publish-valgrind-baseline:
    name: Publish Valgrind baseline
    needs:
      - build-ci-image
      - valgrind
    if: ${{ needs.valgrind.result == 'success' && needs.build-ci-image.outputs.pr_context != 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Checkout trusted baseline publisher
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download Valgrind report
        uses: actions/download-artifact@v8
        with:
          name: valgrind-baseline
          path: valgrind-baseline

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish baseline to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/testing/valgrind/valgrind-baseline-artifact.py upload \
            --sha "${{ needs.build-ci-image.outputs.head_sha }}" \
            --input valgrind-baseline/valgrind-error-summary.xml

  report-label-result:
    name: Report PEK CI head result
    needs:
      - validate-label-dispatch
      - build-ci-image
      - python-dependency-audit
      - workflow-dependency-freshness
      - docker-scout
      - linux-quick-start-build-test
      - rpi5-quick-start-build-test
      - macos-nightly-test
      - quality-checks
      - sonar
      - valgrind
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.pr_label != '' }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report selected checks on PR head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.pr_head_sha }}
          PR_LABEL: ${{ inputs.pr_label }}
          VALIDATION_RESULT: ${{ needs.validate-label-dispatch.result }}
          BUILD_RESULT: ${{ needs.build-ci-image.result }}
          PYTHON_RESULT: ${{ needs.python-dependency-audit.result }}
          WORKFLOW_RESULT: ${{ needs.workflow-dependency-freshness.result }}
          SCOUT_RESULT: ${{ needs.docker-scout.result }}
          LINUX_RESULT: ${{ needs.linux-quick-start-build-test.result }}
          RPI_RESULT: ${{ needs.rpi5-quick-start-build-test.result }}
          MACOS_RESULT: ${{ needs.macos-nightly-test.result }}
          QUALITY_RESULT: ${{ needs.quality-checks.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          VALGRIND_RESULT: ${{ needs.valgrind.result }}
        run: |
          case "$PR_LABEL" in
            run-pek-ci) results="$VALIDATION_RESULT $BUILD_RESULT $LINUX_RESULT $RPI_RESULT $QUALITY_RESULT $SONAR_RESULT $VALGRIND_RESULT" ;;
            run-macos-ci) results="$VALIDATION_RESULT $MACOS_RESULT" ;;
            run-python-audit) results="$VALIDATION_RESULT $PYTHON_RESULT" ;;
            run-docker-scout) results="$VALIDATION_RESULT $BUILD_RESULT $SCOUT_RESULT" ;;
            run-workflow-audit) results="$VALIDATION_RESULT $WORKFLOW_RESULT" ;;
            *) exit 1 ;;
          esac

          state=success
          for result in $results; do
            if [ "$result" = cancelled ]; then
              state=error
            elif [ "$result" != success ] && [ "$state" = success ]; then
              state=failure
            fi
          done

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context="PEK CI (head): ${PR_LABEL}" \
            -f description="${PR_LABEL} head validation concluded: ${state}" \
            -f target_url="$run_url"
          test "$state" = success
