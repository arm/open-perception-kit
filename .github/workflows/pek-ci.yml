name: PEK CI
run-name: "${{ inputs.valgrind_baseline_sha != '' && format('Valgrind baseline {0}', inputs.valgrind_baseline_sha) || inputs.pr_label != '' && format('PEK CI (head): {0}', inputs.pr_label) || 'PEK CI' }}"

on:
  workflow_dispatch:
    inputs:
      checks:
        description: Checks to run after preparing the shared CI image.
        required: true
        default: all
        type: choice
        options:
          - all
          - quality
          - sonar
          - valgrind
          - label
      pr_number:
        description: Optional PR number to run the PR validation path manually.
        required: false
        default: ""
        type: string
      pr_base_ref:
        description: Optional PR base branch override for manual PR-context runs.
        required: false
        default: ""
        type: string
      pr_head_ref:
        description: Optional PR head branch for manual PR-context runs.
        required: false
        default: ""
        type: string
      pr_head_sha:
        description: Optional PR head SHA for manual PR-context runs.
        required: false
        default: ""
        type: string
      pr_label:
        description: Optional PR label whose selected checks are being replayed.
        required: false
        default: ""
        type: string
      valgrind_baseline_sha:
        description: Internal exact source SHA for a Valgrind baseline backfill.
        required: false
        default: ""
        type: string
  pull_request:
    branches: [main, develop, "feature/**", "sandbox/**" ]
    types: [ opened, synchronize, reopened, ready_for_review, labeled ]
  schedule:
    - cron: "0 2 * * *" # Every day at 2 AM UTC'
  push:
    branches: [main, develop]
    tags: ["release/*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.inputs.pr_number || format('{0}-{1}-{2}-{3}', github.event_name, github.ref, github.event.inputs.checks || 'all', github.event.inputs.valgrind_baseline_sha || 'current') }}-${{ github.event.inputs.pr_label || (github.event.action == 'labeled' && (!contains(github.event.label.name, 'run-pek-ci') || contains(github.event.pull_request.labels.*.name, 'run-macos-ci')) && github.run_id || 'validation') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CCACHE_SCHEMA_VERSION: v2
  CI_IMAGE_CACHE_KEY: pek-ci-image-${{ github.run_id }}

jobs:
  validate-label-dispatch:
    name: Validate label dispatch
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_label != '' }}
    permissions: {}
    steps:
      - name: Validate selected label checks
        env:
          CHECKS: ${{ inputs.checks }}
          PR_BASE_REF: ${{ inputs.pr_base_ref }}
          PR_HEAD_REF: ${{ inputs.pr_head_ref }}
          PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
          PR_LABEL: ${{ inputs.pr_label }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          test -n "$PR_NUMBER"
          test -n "$PR_BASE_REF"
          test -n "$PR_HEAD_REF"
          test "${#PR_HEAD_SHA}" = 40
          case "$PR_HEAD_SHA" in *[!0-9a-f]*) exit 1 ;; esac
          if [ "$PR_LABEL" = run-pek-ci ]; then
            test "$CHECKS" = all
          else
            test "$CHECKS" = label
            case "$PR_LABEL" in
              run-macos-ci|run-python-audit|run-docker-scout|run-workflow-audit) ;;
              *) exit 1 ;;
            esac
          fi

  build-ci-image:
    name: Build PEK CI image
    runs-on: ubuntu-latest
    if: |
      (
        github.event_name == 'workflow_dispatch' &&
        (inputs.checks != 'label' || inputs.pr_label == 'run-docker-scout')
      ) ||
      (
        github.event_name != 'workflow_dispatch' &&
        github.event_name != 'pull_request'
      ) ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          github.event.action != 'labeled' ||
          contains(fromJSON('["run-pek-ci","run-docker-scout"]'), github.event.label.name)
        ) &&
        (
          github.event.pull_request.draft == false ||
          github.event.action == 'labeled'
        )
      )
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_ref: ${{ steps.context.outputs.base_ref }}
      base_sha: ${{ steps.context.outputs.base_sha }}
      head_ref: ${{ steps.context.outputs.head_ref }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      pr_context: ${{ steps.context.outputs.pr_context }}
      pr_number: ${{ steps.context.outputs.pr_number }}
    steps:
      - name: Validate Valgrind baseline backfill
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.valgrind_baseline_sha != '' }}
        env:
          CHECKS: ${{ github.event.inputs.checks }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: test "$CHECKS" = valgrind && test -z "$PR_NUMBER"

      - name: Checkout manual-run helper
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.workflow_sha }}
          path: manual-helpers
          persist-credentials: false

      - name: Resolve manual PR
        id: manual_pr
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '' }}
        working-directory: ${{ github.workspace }}/manual-helpers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/private/github_pr_context.py \
            --pr-number "${{ github.event.inputs.pr_number }}" \
            --repo "${{ github.repository }}" \
            --base-ref-override "${{ github.event.inputs.pr_base_ref }}" \
            --head-ref-override "${{ github.event.inputs.pr_head_ref }}" \
            --head-sha-override "${{ github.event.inputs.pr_head_sha }}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.inputs.valgrind_baseline_sha || steps.manual_pr.outputs.head_sha || steps.manual_pr.outputs.head_ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare private submodules
        env:
          DEPLOY_KEY_FLOWDATA_SDK: ${{ secrets.DEPLOY_KEY_FLOWDATA_SDK }}
        run: |
          source .github/scripts/configure_workspace_ssh.sh
          git submodule update --init --recursive

      - name: Checkout workflow helpers
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .cache/workflow-helpers
          persist-credentials: false

      - name: Prepare Docker build
        id: context
        env:
          BASE_REF: ${{ steps.manual_pr.outputs.base_ref || github.base_ref }}
          BASE_SHA: ${{ steps.manual_pr.outputs.base_sha || github.event.pull_request.base.sha || '' }}
          HEAD_REF: ${{ steps.manual_pr.outputs.head_ref || github.head_ref || github.ref_name }}
          PR_CONTEXT: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '') }}
          PR_NUMBER: ${{ steps.manual_pr.outputs.pr_number || github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [ "$PR_CONTEXT" = "true" ]; then
            test -n "$BASE_SHA"
          fi
          tools_dir="${GITHUB_WORKSPACE}/.cache/pek-ci-image"
          helpers_dir="${GITHUB_WORKSPACE}/.cache/workflow-helpers"
          mkdir -p "$tools_dir/valgrind"
          cp "$helpers_dir/scripts/private/ci_image.py" "$tools_dir/ci_image.py"
          cp \
            "$helpers_dir/scripts/testing/valgrind/compare-valgrind-results.py" \
            "$helpers_dir/scripts/testing/valgrind/summarize-valgrind-output.py" \
            "$helpers_dir/scripts/testing/valgrind/suppressed-warnings" \
            "$helpers_dir/scripts/testing/valgrind/test-elements-with-valgrind.sh" \
            "$helpers_dir/scripts/testing/valgrind/test_compare_valgrind_results.py" \
            "$helpers_dir/scripts/testing/valgrind/test_summarize_valgrind_output.py" \
            "$helpers_dir/scripts/testing/valgrind/test_valgrind_baseline_artifact.py" \
            "$helpers_dir/scripts/testing/valgrind/valgrind-baseline-artifact.py" \
            "$tools_dir/valgrind/"
          {
            printf 'base_ref=%s\n' "$BASE_REF"
            printf 'base_sha=%s\n' "$BASE_SHA"
            printf 'head_ref=%s\n' "$HEAD_REF"
            printf 'head_sha=%s\n' "$head_sha"
            printf 'pr_context=%s\n' "$PR_CONTEXT"
            printf 'pr_number=%s\n' "$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v4

      - name: Validate model cache key guard
        env:
          PEK_REQUIRE_DOCKER_BUILD_TEST: "1"
        run: >-
          python3 development/tests/model_artifact_build_test.py
          ModelArtifactBuildTest.test_raw_model_build_requires_cache_key
          ModelArtifactBuildTest.test_main_compose_uses_model_bearing_target

      - name: Validate tokenless Compose config
        run: env -u HF_TOKEN -u HF_DOWNLOAD_CACHEBUST docker compose -f compose.yaml config --quiet

      - name: Build PEK CI image
        uses: docker/build-push-action@v7
        with:
          # GitHub keeps this scope per ref: PRs read base/default, then write only their merge ref.
          cache-from: type=gha,scope=pek-ci
          cache-to: type=gha,mode=max,scope=pek-ci
          context: .
          file: Dockerfile
          labels: |
            org.opencontainers.image.revision=${{ steps.context.outputs.head_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.context.outputs.head_sha }}
          outputs: type=docker,dest=${{ github.workspace }}/.cache/pek-ci-image/pek-ci-image.tar
          provenance: false
          pull: true
          push: false
          tags: pek-ci:${{ steps.context.outputs.head_sha }}
          target: pek-ci

      - name: Share PEK CI image
        uses: actions/cache/save@v6
        with:
          path: .cache/pek-ci-image
          key: ${{ env.CI_IMAGE_CACHE_KEY }}

      - name: Upload PEK CI image for publishing
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: pek-ci-image
          path: .cache/pek-ci-image/pek-ci-image.tar
          compression-level: 0
          retention-days: 1

  build-deployment-images:
    name: Build deployment image (${{ matrix.architecture }})
    if: ${{ github.event_name == 'schedule' }}
    strategy:
      matrix:
        include:
          - architecture: x86_64
            cache_tag: amd64
            platform: linux/amd64
            runner: self-hosted-ubuntu-latest-x64
          - architecture: aarch64
            cache_tag: arm64
            platform: linux/arm64
            runner: self-hosted-ubuntu-latest-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      CCACHE_PATH: .cache/ccache-deployment
      DEPLOYMENT_IMAGE: ghcr.io/arm-debug/amp-dev-forge-deployment
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve release cache inputs
        id: source
        run: |
          echo "flowdata_commit=$(git rev-parse HEAD:tools/flowdata-sdk)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker builder
        id: builder
        uses: docker/setup-buildx-action@v4

      - name: Restore deployment compiler cache
        id: compiler-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_PATH }}
          key: pek-ccache-${{ env.CCACHE_SCHEMA_VERSION }}-${{ runner.os }}-${{ runner.arch }}-deployment-${{ github.sha }}
          restore-keys: |
            pek-ccache-${{ env.CCACHE_SCHEMA_VERSION }}-${{ runner.os }}-${{ runner.arch }}-deployment-

      - name: Attach compiler cache to Docker builder
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.builder.outputs.name }}
          cache-map: |
            {
              ".cache/ccache-deployment": {
                "target": "/work/.cache/ccache",
                "id": "pek-deployment-ccache",
                "sharing": "locked"
              }
            }
          skip-extraction: ${{ steps.compiler-cache.outputs.cache-hit }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish deployment image
        uses: docker/build-push-action@v7
        with:
          build-args: |
            HF_DOWNLOAD_CACHEBUST=github-${{ github.run_id }}-${{ github.run_attempt }}
            PEK_RELEASE_BUILD=true
            PEK_RELEASE_SOURCE_COMMIT=${{ github.sha }}
            PEK_FLOWDATA_SDK_COMMIT=${{ steps.source.outputs.flowdata_commit }}
          cache-from: type=registry,ref=${{ env.DEPLOYMENT_IMAGE }}:buildcache-${{ matrix.cache_tag }}
          cache-to: type=registry,ref=${{ env.DEPLOYMENT_IMAGE }}:buildcache-${{ matrix.cache_tag }},mode=max
          context: .
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=nightly-${{ github.sha }}
          platforms: ${{ matrix.platform }}
          provenance: false
          pull: true
          push: true
          secrets: |
            "huggingface_token=${{ secrets.HF_TOKEN }}"
            "executorch_artifactory_username=${{ secrets.PEK_ARTIFACTORY_USERNAME }}"
            "executorch_artifactory_password=${{ secrets.PEK_ARTIFACTORY_API_KEY }}"
          tags: ${{ env.DEPLOYMENT_IMAGE }}:nightly-${{ matrix.cache_tag }}
          target: pek-deployment-base

  python-dependency-audit:
    name: Python Dependency Audit
    if: |
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.checks == 'label' &&
        inputs.pr_label == 'run-python-audit'
      ) ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (github.event.action == 'labeled' && github.event.label.name == 'run-python-audit') ||
          (
            contains(fromJSON('["synchronize","reopened"]'), github.event.action) &&
            contains(github.event.pull_request.labels.*.name, 'run-python-audit')
          )
        )
      )
    permissions:
      contents: read
    uses: ./.github/workflows/python-dependency-audit.yml
    with:
      checkout_ref: ${{ inputs.pr_head_sha }}

  workflow-dependency-freshness:
    name: Workflow Dependency Freshness
    if: |
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.checks == 'label' &&
        inputs.pr_label == 'run-workflow-audit'
      ) ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (github.event.action == 'labeled' && github.event.label.name == 'run-workflow-audit') ||
          (
            contains(fromJSON('["synchronize","reopened"]'), github.event.action) &&
            contains(github.event.pull_request.labels.*.name, 'run-workflow-audit')
          )
        )
      )
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/workflow-audit.yml
    with:
      checkout_ref: ${{ inputs.pr_head_sha }}

  docker-scout:
    name: Docker Scout Image Audit
    needs: build-ci-image
    if: |
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.checks == 'label' &&
        inputs.pr_label == 'run-docker-scout'
      ) ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (github.event.action == 'labeled' && github.event.label.name == 'run-docker-scout') ||
          (
            contains(fromJSON('["synchronize","reopened"]'), github.event.action) &&
            contains(github.event.pull_request.labels.*.name, 'run-docker-scout')
          )
        )
      )
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/docker-scout-image-audit.yml
    with:
      ci_image_sha: ${{ needs.build-ci-image.outputs.head_sha }}
      checkout_ref: ${{ inputs.pr_head_sha }}
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }} # pragma: allowlist secret
      HF_TOKEN: ${{ secrets.HF_TOKEN }} # pragma: allowlist secret

  linux-quick-start-build-test:
    name: Quick-start on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      pull-requests: read
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.checks == 'all') ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.action != 'labeled' || contains(github.event.label.name, 'run-pek-ci')) &&
        (
          github.event.pull_request.draft == false ||
          (github.event.action == 'labeled' && contains(github.event.label.name, 'run-pek-ci'))
        )
      )
    env:
      PEK_QUICK_START_CI_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      CI_CHECKOUT_PATH: repo-pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - name: Checkout manual-run helper
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}
          path: ${{ env.CI_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Resolve manual PR
        id: manual_pr
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '' }}
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/private/github_pr_context.py \
            --pr-number "${{ github.event.inputs.pr_number }}" \
            --repo "${{ github.repository }}" \
            --base-ref-override "${{ github.event.inputs.pr_base_ref }}" \
            --head-ref-override "${{ github.event.inputs.pr_head_ref }}" \
            --head-sha-override "${{ github.event.inputs.pr_head_sha }}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ steps.manual_pr.outputs.head_sha || steps.manual_pr.outputs.head_ref || github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.CI_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Prepare private submodules
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          DEPLOY_KEY_FLOWDATA_SDK: ${{ secrets.DEPLOY_KEY_FLOWDATA_SDK }}
        run: |
          source .github/scripts/configure_workspace_ssh.sh
          git submodule update --init --recursive

      - name: Show detected quick-start platform
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./scripts/quick-start/detect-environment.sh

      - name: Build and start quick-start container
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./scripts/quick-start/start-container.sh --recreate

      - name: Reconcile running quick-start container
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./scripts/quick-start/start-container.sh

      - name: Build PEK in quick-start container
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./scripts/build.sh

      - name: Clean quick-start workspace
        if: always()
        env:
          PEK_QUICK_START_CI_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          checkout_path="${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}"
          cleanup_status=0
          if [ -x "$checkout_path/scripts/quick-start/cleanup-container.sh" ]; then
            "$checkout_path/scripts/quick-start/cleanup-container.sh" || cleanup_status=$?
          fi
          rm -rf -- "$checkout_path"
          exit "$cleanup_status"

  rpi5-quick-start-build-test:
    name: Quick-start and Playwright on Raspberry Pi 5
    needs: build-ci-image
    runs-on: [self-hosted, Linux, ARM64, amp-dev-forge-runner-rpi5]
    timeout-minutes: 240
    permissions:
      contents: read
      pull-requests: read
    # Fork PR code must not run on the self-hosted RPI runner. Dependabot PRs only need
    # host CI; other same-repo PRs run RPI whenever the Linux quick-start build runs.
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.checks == 'all') ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        (
          (github.event.action != 'labeled' || contains(github.event.label.name, 'run-pek-ci')) &&
          (
            github.event.pull_request.draft == false ||
            (github.event.action == 'labeled' && contains(github.event.label.name, 'run-pek-ci'))
          )
        )
      )
    env:
      PEK_QUICK_START_CI_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      CI_CHECKOUT_PATH: repo-pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.build-ci-image.outputs.head_sha }}
          path: ${{ env.CI_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Prepare private submodules
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          DEPLOY_KEY_FLOWDATA_SDK: ${{ secrets.DEPLOY_KEY_FLOWDATA_SDK }}
        run: |
          source .github/scripts/configure_workspace_ssh.sh
          git submodule update --init --recursive

      - name: Clean stale browser smoke containers
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./scripts/playwright/browser-smoke/run.sh --cleanup-stale

      - name: Show detected quick-start platform
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./scripts/quick-start/detect-environment.sh

      - name: Build and start quick-start container
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./scripts/quick-start/start-container.sh --recreate

      - name: Build PEK in quick-start container
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./scripts/build.sh

      - name: Browser smoke test with local data
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          BROWSER_SMOKE_BROWSERS: chromium,firefox,webkit
          BROWSER_SMOKE_REBUILD: "1"
          NUM_FRAMES: "45000"
        run: exec ./scripts/playwright/browser-smoke/run.sh

      - name: Upload RPI browser smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rpi-browser-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/test-results/playwright
            ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/playwright-report
          if-no-files-found: ignore
          retention-days: 10

      - name: Clean quick-start workspace
        if: always()
        env:
          PEK_QUICK_START_CI_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          checkout_path="${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}"
          cleanup_status=0
          if [ -x "$checkout_path/scripts/playwright/browser-smoke/run.sh" ]; then
            "$checkout_path/scripts/playwright/browser-smoke/run.sh" --cleanup-stale || cleanup_status=$?
          fi
          if [ -x "$checkout_path/scripts/quick-start/cleanup-container.sh" ]; then
            "$checkout_path/scripts/quick-start/cleanup-container.sh" || cleanup_status=$?
          fi
          rm -rf -- "$checkout_path"
          exit "$cleanup_status"

  macos-nightly-test:
    name: Quick-start and Playwright on macOS
    runs-on: self-hosted-macos-arm64-latest
    timeout-minutes: 240
    permissions:
      contents: read
      pull-requests: read
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.checks == 'all' && inputs.pr_label == '') ||
      (github.event_name == 'workflow_dispatch' && inputs.checks == 'label' && inputs.pr_label == 'run-macos-ci') ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (github.event.action == 'labeled' && github.event.label.name == 'run-macos-ci') ||
          ((github.event.action == 'synchronize' || github.event.action == 'reopened') &&
            contains(github.event.pull_request.labels.*.name, 'run-macos-ci'))
        )
      )
    env:
      PEK_QUICK_START_CI_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      CI_CHECKOUT_PATH: repo-pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - name: Checkout manual-run helper
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}
          path: ${{ env.CI_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Resolve manual PR
        id: manual_pr
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '' }}
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/private/github_pr_context.py \
            --pr-number "${{ github.event.inputs.pr_number }}" \
            --repo "${{ github.repository }}" \
            --base-ref-override "${{ github.event.inputs.pr_base_ref }}" \
            --head-ref-override "${{ github.event.inputs.pr_head_ref }}" \
            --head-sha-override "${{ github.event.inputs.pr_head_sha }}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ steps.manual_pr.outputs.head_sha || steps.manual_pr.outputs.head_ref || github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.CI_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Prepare private submodules
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          DEPLOY_KEY_FLOWDATA_SDK: ${{ secrets.DEPLOY_KEY_FLOWDATA_SDK }}
        run: |
          source .github/scripts/configure_workspace_ssh.sh
          git submodule update --init --recursive

      - name: Start Colima and check macOS Docker integration
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: |
          brew install docker colima docker-compose docker-buildx qemu
          mkdir -p ~/.docker/cli-plugins
          ln -sf "$(brew --prefix)/opt/docker-compose/bin/docker-compose" ~/.docker/cli-plugins/docker-compose
          ln -sf "$(brew --prefix)/opt/docker-buildx/bin/docker-buildx" ~/.docker/cli-plugins/docker-buildx
          colima start --vm-type=qemu --cpu 4 --memory 8 --mount-type=sshfs
          docker context use colima
          ./scripts/quick-start/detect-environment.sh
          docker info
          docker compose version

      - name: Build and start quick-start container
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./scripts/quick-start/start-container.sh --recreate

      - name: Build PEK in quick-start container
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./scripts/build.sh

      - name: Browser smoke test with local data
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          BROWSER_SMOKE_BROWSERS: chromium,firefox,webkit
          BROWSER_SMOKE_REBUILD: "1"
          NUM_FRAMES: "12000"
        run: ./scripts/playwright/browser-smoke/run.sh --sink-only

      - name: Upload macOS browser smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-browser-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/test-results/playwright
            ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/playwright-report
          if-no-files-found: ignore
          retention-days: 10

      - name: Clean quick-start workspace
        if: always()
        run: |
          checkout_path="${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}"
          cleanup_status=0
          if [ -x "$checkout_path/scripts/quick-start/cleanup-container.sh" ]; then
            "$checkout_path/scripts/quick-start/cleanup-container.sh" || cleanup_status=$?
          fi
          rm -rf -- "$checkout_path"
          if command -v colima >/dev/null; then
            colima delete --force || cleanup_status=$?
          fi
          exit "$cleanup_status"

  quality-checks:
    name: Run quality checks in Docker
    needs: build-ci-image
    runs-on: ubuntu-latest
    if: |
      !cancelled() &&
      (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","quality"]'), inputs.checks)) ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (github.event.action != 'labeled' || contains(github.event.label.name, 'run-pek-ci')) &&
          (
            github.event.pull_request.draft == false ||
            (github.event.action == 'labeled' && contains(github.event.label.name, 'run-pek-ci'))
          )
        )
      )
    permissions:
      actions: read
      contents: read
    env:
      python_ver: "3.12.1"
      DOCKER_COMPOSE_FILE: .github/compose.ci.yaml
      CI_CHECKOUT_PATH: repo-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      CCACHE_PATH: ${{ github.workspace }}/.cache/ccache-quality
    steps:
      - name: Restore PEK CI image
        uses: actions/cache/restore@v6
        with:
          path: .cache/pek-ci-image
          key: ${{ env.CI_IMAGE_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Load PEK CI image
        env:
          CI_IMAGE_SHA: ${{ needs.build-ci-image.outputs.head_sha }}
          IMAGE_JOB_RESULT: ${{ needs.build-ci-image.result }}
        run: |
          test "$IMAGE_JOB_RESULT" = success
          tools_dir="${GITHUB_WORKSPACE}/.cache/pek-ci-image"
          python3 "$tools_dir/ci_image.py" prepare "$CI_IMAGE_SHA" \
            --archive "$tools_dir/pek-ci-image.tar" \
            pek-quality-check-full \
            pek-quality-check-pull-request \
            pek-release-with-ut \
            pek-clang-tidy-baseline-check

      - name: Prepare compiler cache
        run: install -d -m 0777 "$CCACHE_PATH"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.build-ci-image.outputs.head_sha }}
          path: ${{ env.CI_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Generate Hugging Face download cache key
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          cache_key="$(scripts/private/generate-hf-download-cachebust.sh)"
          echo "HF_DOWNLOAD_CACHEBUST=${cache_key}" >> "$GITHUB_ENV"

      - name: Attach validated PR head branch
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '') }}
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          PR_HEAD_REF: ${{ needs.build-ci-image.outputs.head_ref }}
          PR_HEAD_SHA: ${{ needs.build-ci-image.outputs.head_sha }}
        run: |
          set -euo pipefail
          test -n "$PR_HEAD_REF"
          checked_out_sha="$(git rev-parse HEAD)"
          if [ -n "$PR_HEAD_SHA" ]; then
            test "$checked_out_sha" = "$PR_HEAD_SHA"
          else
            PR_HEAD_SHA="$checked_out_sha"
          fi
          git check-ref-format --branch "$PR_HEAD_REF" >/dev/null
          git switch --force-create "$PR_HEAD_REF" "$PR_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$(git branch --show-current)" = "$PR_HEAD_REF"

      - name: Prepare private submodules
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          DEPLOY_KEY_FLOWDATA_SDK: ${{ secrets.DEPLOY_KEY_FLOWDATA_SDK }}
        run: |
          source .github/scripts/configure_workspace_ssh.sh
          git submodule update --init --recursive

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_PATH }}
          key: pek-ccache-${{ env.CCACHE_SCHEMA_VERSION }}-${{ runner.os }}-${{ runner.arch }}-quality-${{ needs.build-ci-image.outputs.head_sha }}
          restore-keys: |
            pek-ccache-${{ env.CCACHE_SCHEMA_VERSION }}-${{ runner.os }}-${{ runner.arch }}-quality-

      - name: Check Repo Quality gate (nightly)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number == '') }}
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: |
          docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm pek-quality-check-full

      - name: Upload quality report artifact (nightly)
        if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number == '')) }}
        uses: actions/upload-artifact@v7
        with:
          name: expkits-ci-quality-report-full
          path: "${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/.github/artifacts/expkits-ci-full-report.txt"
          if-no-files-found: warn
          retention-days: 10

      - name: Upload documentation artifact
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number == '') }}
        uses: actions/upload-artifact@v7
        with:
          name: pek-doc
          path: "${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/development/build/doc"
          if-no-files-found: warn
          retention-days: 10

      - name: Check Repo Quality gate (PR)
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '') }}
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export PULL_REQUEST_TARGET_BRANCH="${{ needs.build-ci-image.outputs.base_ref }}"
          source scripts/private/ci_git_auth_env.sh
          configure_github_git_auth_env "$GITHUB_TOKEN"
          docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm \
            -e PULL_REQUEST_TARGET_BRANCH \
            -e GIT_CONFIG_COUNT \
            -e GIT_CONFIG_KEY_0 \
            -e GIT_CONFIG_VALUE_0 \
            pek-quality-check-pull-request

      - name: Upload quality report artifact (PR)
        if: ${{ always() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '')) }}
        uses: actions/upload-artifact@v7
        with:
          name: expkits-ci-quality-report-pr
          path: "${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/.github/artifacts/expkits-ci-pr-report.txt"
          if-no-files-found: warn
          retention-days: 10

      - name: Perception Experience Kit release build and unit test run
        id: release_build
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch') }}
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm
          pek-release-with-ut

      - name: Run clang-tidy baseline check
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch') }}
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_CONTEXT_RUN: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '') }}
        run: |
          if [ "${PR_CONTEXT_RUN}" = "true" ]; then
            export PULL_REQUEST_TARGET_BRANCH="${{ needs.build-ci-image.outputs.base_ref }}"
            source scripts/private/ci_git_auth_env.sh
            configure_github_git_auth_env "$GITHUB_TOKEN"
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm \
              -e PULL_REQUEST_TARGET_BRANCH \
              -e GIT_CONFIG_COUNT \
              -e GIT_CONFIG_KEY_0 \
              -e GIT_CONFIG_VALUE_0 \
              pek-clang-tidy-baseline-check
          else
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm pek-clang-tidy-baseline-check
          fi

      - name: Upload clang-tidy logs
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-baseline
          path: |
            ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/clang-tidy.log
            ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/clang-tidy-stats.log
            ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/clang-tidy-stats.json
          if-no-files-found: warn
          retention-days: 10

      - name: Save compiler cache
        if: ${{ !cancelled() && steps.release_build.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_PATH }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

  sonar:
    name: Run Sonar analysis in Docker
    needs: build-ci-image
    runs-on: self-hosted-ubuntu-latest-x64
    if: |
      !cancelled() &&
      (
        (github.event_name == 'push' && github.ref_type == 'branch') ||
        (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","sonar"]'), inputs.checks)) ||
        (
          github.event_name == 'pull_request' &&
