name: PEK CI

on:
  workflow_dispatch:
    inputs:
      checks:
        description: Checks to run after preparing the shared CI image.
        required: true
        default: all
        type: choice
        options:
          - all
          - quality
          - sonar
          - valgrind
      pr_number:
        description: Optional PR number to run the PR validation path manually.
        required: false
        default: ""
        type: string
      pr_base_ref:
        description: Optional PR base branch override for manual PR-context runs.
        required: false
        default: ""
        type: string
      pr_head_ref:
        description: Optional PR head branch for manual PR-context runs.
        required: false
        default: ""
        type: string
      pr_head_sha:
        description: Optional PR head SHA for manual PR-context runs.
        required: false
        default: ""
        type: string
  pull_request:
    branches: [main, develop, "feature/**", "sandbox/**" ]
    types: [ opened, synchronize, reopened, ready_for_review, labeled ]
  schedule:
    - cron: "0 2 * * *" # Every day at 2 AM UTC'
  push:
    branches: [main, develop]
    tags: ["release/*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.ref || github.run_id }}-${{ github.event.action == 'labeled' && (!contains(github.event.label.name, 'run-pek-ci') || contains(github.event.pull_request.labels.*.name, 'run-macos-ci')) && github.run_id || 'validation' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-ci-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          github.event.action != 'labeled' ||
          contains(fromJSON('["run-pek-ci","run-docker-scout"]'), github.event.label.name)
        ) &&
        (
          github.event.pull_request.draft == false ||
          github.event.action == 'labeled'
        )
      )
    permissions:
      contents: read
      packages: write
    outputs:
      base_ref: ${{ steps.context.outputs.base_ref }}
      head_ref: ${{ steps.context.outputs.head_ref }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      image_tag: ${{ steps.context.outputs.image_tag }}
      pr_context: ${{ steps.context.outputs.pr_context }}
      pr_number: ${{ steps.context.outputs.pr_number }}
    steps:
      - name: Checkout manual-run helper
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}
          path: workflow-helpers
          persist-credentials: false

      - name: Resolve manual PR
        id: manual_pr
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '' }}
        working-directory: ${{ github.workspace }}/workflow-helpers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/private/github_pr_context.py \
            --pr-number "${{ github.event.inputs.pr_number }}" \
            --repo "${{ github.repository }}" \
            --base-ref-override "${{ github.event.inputs.pr_base_ref }}" \
            --head-ref-override "${{ github.event.inputs.pr_head_ref }}" \
            --head-sha-override "${{ github.event.inputs.pr_head_sha }}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ steps.manual_pr.outputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set image metadata
        id: context
        env:
          BASE_REF: ${{ steps.manual_pr.outputs.base_ref || github.base_ref }}
          HEAD_REF: ${{ steps.manual_pr.outputs.head_ref || github.head_ref || github.ref_name }}
          PR_CONTEXT: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '') }}
          PR_NUMBER: ${{ steps.manual_pr.outputs.pr_number || github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          image_tag="$head_sha"
          if [ "$PR_CONTEXT" != "true" ]; then
            image_tag="${head_sha}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          {
            printf 'base_ref=%s\n' "$BASE_REF"
            printf 'head_ref=%s\n' "$HEAD_REF"
            printf 'head_sha=%s\n' "$head_sha"
            printf 'image_tag=%s\n' "$image_tag"
            printf 'pr_context=%s\n' "$PR_CONTEXT"
            printf 'pr_number=%s\n' "$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v4

      - name: Push retention anchor
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/Dockerfile.ci-anchor
          labels: |
            org.opencontainers.image.ref.name=retention-anchor
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: false
          push: true
          tags: ghcr.io/arm-debug/amp-dev-forge-ci:retention-anchor

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          cache-from: type=registry,ref=ghcr.io/arm-debug/amp-dev-forge-ci:buildcache
          cache-to: type=registry,ref=ghcr.io/arm-debug/amp-dev-forge-ci:buildcache,mode=max
          context: .
          file: Dockerfile
          labels: |
            org.opencontainers.image.revision=${{ steps.context.outputs.head_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: false
          pull: true
          push: true
          tags: ghcr.io/arm-debug/amp-dev-forge-ci:${{ steps.context.outputs.image_tag }}
          target: pek-ci

  python-dependency-audit:
    name: Python Dependency Audit
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'run-python-audit') ||
        (
          contains(fromJSON('["synchronize","reopened"]'), github.event.action) &&
          contains(github.event.pull_request.labels.*.name, 'run-python-audit')
        )
      )
    permissions:
      contents: read
    uses: ./.github/workflows/python-dependency-audit.yml

  workflow-dependency-freshness:
    name: Workflow Dependency Freshness
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'run-workflow-audit') ||
        (
          contains(fromJSON('["synchronize","reopened"]'), github.event.action) &&
          contains(github.event.pull_request.labels.*.name, 'run-workflow-audit')
        )
      )
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/workflow-audit.yml

  docker-scout:
    name: Docker Scout Image Audit
    needs: build-ci-image
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'run-docker-scout') ||
        (
          contains(fromJSON('["synchronize","reopened"]'), github.event.action) &&
          contains(github.event.pull_request.labels.*.name, 'run-docker-scout')
        )
      )
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/docker-scout-image-audit.yml
    with:
      ci_image_sha: ${{ needs.build-ci-image.outputs.head_sha }}
      ci_image_tag: ${{ needs.build-ci-image.outputs.image_tag }}
    secrets: inherit # pragma: allowlist secret

  linux-quick-start-build-test:
    name: Quick-start on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 240
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.checks == 'all') ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.action != 'labeled' || contains(github.event.label.name, 'run-pek-ci')) &&
        (
          github.event.pull_request.draft == false ||
          (github.event.action == 'labeled' && contains(github.event.label.name, 'run-pek-ci'))
        )
      )
    env:
      PEK_QUICK_START_CI_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      CI_CHECKOUT_PATH: repo-pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.event.inputs.pr_head_sha || (github.event.inputs.pr_number != '' && format('refs/pull/{0}/head', github.event.inputs.pr_number)) || github.sha }}
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Show detected quick-start platform
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./scripts/quick-start/detect-environment.sh

      - name: Build and start quick-start container
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./scripts/quick-start/start-container.sh --recreate

      - name: Reconcile running quick-start container
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./scripts/quick-start/start-container.sh

      - name: Build PEK in quick-start container
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./scripts/build.sh

      - name: Clean quick-start workspace
        if: always()
        env:
          PEK_QUICK_START_CI_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          checkout_path="${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}"
          cleanup_status=0
          if [ -x "$checkout_path/scripts/quick-start/cleanup-container.sh" ]; then
            "$checkout_path/scripts/quick-start/cleanup-container.sh" || cleanup_status=$?
          fi
          rm -rf -- "$checkout_path"
          exit "$cleanup_status"

  rpi5-quick-start-build-test:
    name: Quick-start and Playwright on Raspberry Pi 5
    runs-on: [self-hosted, Linux, ARM64, amp-dev-forge-runner-rpi5]
    timeout-minutes: 240
    # Fork PR code must not run on the self-hosted RPI runner. Same-repo PRs intentionally
    # follow the normal CI gate so RPI runs whenever the Linux quick-start build runs.
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.checks == 'all') ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (github.event.action != 'labeled' || contains(github.event.label.name, 'run-pek-ci')) &&
          (
            github.event.pull_request.draft == false ||
            (github.event.action == 'labeled' && contains(github.event.label.name, 'run-pek-ci'))
          )
        )
      )
    env:
      PEK_QUICK_START_CI_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      CI_CHECKOUT_PATH: repo-pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.event.inputs.pr_head_sha || (github.event.inputs.pr_number != '' && format('refs/pull/{0}/head', github.event.inputs.pr_number)) || github.sha }}
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Clean stale browser smoke containers
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./scripts/playwright/browser-smoke/run.sh --cleanup-stale

      - name: Show detected quick-start platform
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./scripts/quick-start/detect-environment.sh

      - name: Build and start quick-start container
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./scripts/quick-start/start-container.sh --recreate

      - name: Build PEK in quick-start container
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./scripts/build.sh

      - name: Browser smoke test with local data
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          BROWSER_SMOKE_BROWSERS: chromium,firefox,webkit
          BROWSER_SMOKE_REBUILD: "1"
          NUM_FRAMES: "45000"
        run: exec ./scripts/playwright/browser-smoke/run.sh

      - name: Upload RPI browser smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rpi-browser-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/test-results/playwright
            ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/playwright-report
          if-no-files-found: ignore
          retention-days: 10

      - name: Clean quick-start workspace
        if: always()
        env:
          PEK_QUICK_START_CI_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          checkout_path="${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}"
          cleanup_status=0
          if [ -x "$checkout_path/scripts/playwright/browser-smoke/run.sh" ]; then
            "$checkout_path/scripts/playwright/browser-smoke/run.sh" --cleanup-stale || cleanup_status=$?
          fi
          if [ -x "$checkout_path/scripts/quick-start/cleanup-container.sh" ]; then
            "$checkout_path/scripts/quick-start/cleanup-container.sh" || cleanup_status=$?
          fi
          rm -rf -- "$checkout_path"
          exit "$cleanup_status"

  macos-nightly-test:
    name: Quick-start and Playwright on macOS
    runs-on: self-hosted-macos-arm64-latest
    timeout-minutes: 240
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.checks == 'all') ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (github.event.action == 'labeled' && github.event.label.name == 'run-macos-ci') ||
          ((github.event.action == 'synchronize' || github.event.action == 'reopened') &&
            contains(github.event.pull_request.labels.*.name, 'run-macos-ci'))
        )
      )
    env:
      PEK_QUICK_START_CI_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      CI_CHECKOUT_PATH: repo-pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.event.inputs.pr_head_sha || (github.event.inputs.pr_number != '' && format('refs/pull/{0}/head', github.event.inputs.pr_number)) || github.sha }}
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Start Colima and check macOS Docker integration
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: |
          brew install docker colima docker-compose docker-buildx qemu
          mkdir -p ~/.docker/cli-plugins
          ln -sf "$(brew --prefix)/opt/docker-compose/bin/docker-compose" ~/.docker/cli-plugins/docker-compose
          ln -sf "$(brew --prefix)/opt/docker-buildx/bin/docker-buildx" ~/.docker/cli-plugins/docker-buildx
          colima start --vm-type=qemu --cpu 4 --memory 8 --mount-type=sshfs
          docker context use colima
          ./scripts/quick-start/detect-environment.sh
          docker info
          docker compose version

      - name: Build and start quick-start container
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./scripts/quick-start/start-container.sh --recreate

      - name: Build PEK in quick-start container
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./scripts/build.sh

      - name: Browser smoke test with local data
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          BROWSER_SMOKE_BROWSERS: chromium,firefox,webkit
          BROWSER_SMOKE_REBUILD: "1"
          NUM_FRAMES: "12000"
        run: ./scripts/playwright/browser-smoke/run.sh --sink-only

      - name: Upload macOS browser smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-browser-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/test-results/playwright
            ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/playwright-report
          if-no-files-found: ignore
          retention-days: 10

      - name: Clean quick-start workspace
        if: always()
        run: |
          checkout_path="${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}"
          cleanup_status=0
          if [ -x "$checkout_path/scripts/quick-start/cleanup-container.sh" ]; then
            "$checkout_path/scripts/quick-start/cleanup-container.sh" || cleanup_status=$?
          fi
          rm -rf -- "$checkout_path"
          if command -v colima >/dev/null; then
            colima delete --force || cleanup_status=$?
          fi
          exit "$cleanup_status"

  quality-checks:
    name: Run quality checks in Docker
    needs: build-ci-image
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","quality"]'), inputs.checks)) ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.action != 'labeled' || contains(github.event.label.name, 'run-pek-ci')) &&
        (
          github.event.pull_request.draft == false ||
          (github.event.action == 'labeled' && contains(github.event.label.name, 'run-pek-ci'))
        )
      )
    permissions:
      contents: read
      packages: read
    env:
      python_ver: "3.12.1"
      DOCKER_COMPOSE_FILE: .github/compose.ci.yaml
      CI_CHECKOUT_PATH: repo-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.build-ci-image.outputs.head_sha }}
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Attach validated PR head branch
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '') }}
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          PR_HEAD_REF: ${{ needs.build-ci-image.outputs.head_ref }}
          PR_HEAD_SHA: ${{ needs.build-ci-image.outputs.head_sha }}
        run: |
          set -euo pipefail
          test -n "$PR_HEAD_REF"
          checked_out_sha="$(git rev-parse HEAD)"
          if [ -n "$PR_HEAD_SHA" ]; then
            test "$checked_out_sha" = "$PR_HEAD_SHA"
          else
            PR_HEAD_SHA="$checked_out_sha"
          fi
          git check-ref-format --branch "$PR_HEAD_REF" >/dev/null
          git switch --force-create "$PR_HEAD_REF" "$PR_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$(git branch --show-current)" = "$PR_HEAD_REF"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare shared CI image
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          CI_IMAGE_SHA: ${{ needs.build-ci-image.outputs.head_sha }}
          CI_IMAGE_TAG: ${{ needs.build-ci-image.outputs.image_tag }}
        run: |
          python3 scripts/private/ci_image.py prepare "$CI_IMAGE_SHA" --tag "$CI_IMAGE_TAG" \
            pek-quality-check-full \
            pek-quality-check-pull-request \
            pek-release-with-ut \
            pek-clang-tidy-baseline-check

      - name: Check Repo Quality gate (nightly)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number == '') }}
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: |
          docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm pek-quality-check-full

      - name: Upload quality report artifact (nightly)
        if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number == '')) }}
        uses: actions/upload-artifact@v7
        with:
          name: expkits-ci-quality-report-full
          path: "${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/.github/artifacts/expkits-ci-full-report.txt"
          if-no-files-found: warn
          retention-days: 10

      - name: Upload documentation artifact
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number == '') }}
        uses: actions/upload-artifact@v7
        with:
          name: pek-doc
          path: "${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/development/build/doc"
          if-no-files-found: warn
          retention-days: 10

      - name: Check Repo Quality gate (PR)
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '') }}
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export PULL_REQUEST_TARGET_BRANCH="${{ needs.build-ci-image.outputs.base_ref }}"
          source scripts/private/ci_git_auth_env.sh
          configure_github_git_auth_env "$GITHUB_TOKEN"
          docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm \
            -e PULL_REQUEST_TARGET_BRANCH \
            -e GIT_CONFIG_COUNT \
            -e GIT_CONFIG_KEY_0 \
            -e GIT_CONFIG_VALUE_0 \
            pek-quality-check-pull-request

      - name: Upload quality report artifact (PR)
        if: ${{ always() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '')) }}
        uses: actions/upload-artifact@v7
        with:
          name: expkits-ci-quality-report-pr
          path: "${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/.github/artifacts/expkits-ci-pr-report.txt"
          if-no-files-found: warn
          retention-days: 10

      - name: Perception Experience Kit release build and unit test run
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch') }}
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm
          pek-release-with-ut

      - name: Run clang-tidy baseline check
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch') }}
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_CONTEXT_RUN: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '') }}
        run: |
          if [ "${PR_CONTEXT_RUN}" = "true" ]; then
            export PULL_REQUEST_TARGET_BRANCH="${{ needs.build-ci-image.outputs.base_ref }}"
            source scripts/private/ci_git_auth_env.sh
            configure_github_git_auth_env "$GITHUB_TOKEN"
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm \
              -e PULL_REQUEST_TARGET_BRANCH \
              -e GIT_CONFIG_COUNT \
              -e GIT_CONFIG_KEY_0 \
              -e GIT_CONFIG_VALUE_0 \
              pek-clang-tidy-baseline-check
          else
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm pek-clang-tidy-baseline-check
          fi

      - name: Upload clang-tidy logs
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-baseline
          path: |
            ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/clang-tidy.log
            ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/clang-tidy-stats.log
            ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/clang-tidy-stats.json
          if-no-files-found: warn
          retention-days: 10

  sonar:
    name: Run Sonar analysis in Docker
    needs: build-ci-image
    runs-on: self-hosted-ubuntu-latest-x64
    if: |
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","sonar"]'), inputs.checks)) ||
      (
        github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' || contains(github.event.label.name, 'run-pek-ci')) &&
        (
          github.event.pull_request.draft == false ||
          (github.event.action == 'labeled' && contains(github.event.label.name, 'run-pek-ci'))
        )
      )
    permissions:
      contents: read
      packages: read
    env:
      DOCKER_COMPOSE_FILE: .github/compose.ci.yaml
      CI_CHECKOUT_PATH: repo-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }} # pragma: allowlist secret

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.build-ci-image.outputs.head_sha }}
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Export isolated workspace root
        shell: bash
        run: echo "WORKSPACE_ROOT=${GITHUB_WORKSPACE}/${CI_CHECKOUT_PATH}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare shared CI image
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          CI_IMAGE_SHA: ${{ needs.build-ci-image.outputs.head_sha }}
          CI_IMAGE_TAG: ${{ needs.build-ci-image.outputs.image_tag }}
        run: python3 scripts/private/ci_image.py prepare "$CI_IMAGE_SHA" --tag "$CI_IMAGE_TAG" pek-sonar-check

      - name: SonarQube analysis
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm pek-sonar-check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_BRANCH: ${{ needs.build-ci-image.outputs.head_ref }}
          SONAR_QUALITYGATE_WAIT: "false"
          PR_KEY: ${{ needs.build-ci-image.outputs.pr_number }}
          PR_BRANCH: ${{ needs.build-ci-image.outputs.pr_context == 'true' && needs.build-ci-image.outputs.head_ref || '' }}
          PR_BASE: ${{ needs.build-ci-image.outputs.base_ref }}

      - name: Probe Sonar API access
        if: always()
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_BRANCH: ${{ needs.build-ci-image.outputs.head_ref }}
          PR_KEY: ${{ needs.build-ci-image.outputs.pr_number }}
          PR_BRANCH: ${{ needs.build-ci-image.outputs.pr_context == 'true' && needs.build-ci-image.outputs.head_ref || '' }}
          PR_BASE: ${{ needs.build-ci-image.outputs.base_ref }}
        run: |
          set -euo pipefail
          python3 scripts/private/sonar_quality_gate_workflow.py probe-api-access || \
            echo "Sonar API access probe exited with status $?" >&2

      - name: Report Sonar quality gate details
        if: always()
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_BRANCH: ${{ needs.build-ci-image.outputs.head_ref }}
          PR_KEY: ${{ needs.build-ci-image.outputs.pr_number }}
          PR_BRANCH: ${{ needs.build-ci-image.outputs.pr_context == 'true' && needs.build-ci-image.outputs.head_ref || '' }}
          PR_BASE: ${{ needs.build-ci-image.outputs.base_ref }}
        run: |
          set -euo pipefail
          python3 scripts/private/sonar_quality_gate_workflow.py report-quality-gate

      - name: Upload Sonar quality gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sonar-quality-gate-report
          path: |
            ${{ runner.temp }}/sonar-quality-gate-report.txt
            ${{ runner.temp }}/sonar-api-access-probe.txt
          if-no-files-found: warn
          retention-days: 10

      - name: Cleanup isolated workspace
        if: always()
        shell: bash
        run: |
          workspace_root="${WORKSPACE_ROOT:-}"
          expected_workspace_prefix="${GITHUB_WORKSPACE:-}/repo-"

          case "${workspace_root}" in
            "${expected_workspace_prefix}"*) ;;
            *)
              echo "Skipping cleanup for unexpected WORKSPACE_ROOT='${workspace_root}'" >&2
              exit 0
              ;;
          esac

          if [ -d "${workspace_root}" ]; then
            if [ -f "${workspace_root}/${DOCKER_COMPOSE_FILE}" ]; then
              (
                cd "${workspace_root}"
                docker compose -f "${DOCKER_COMPOSE_FILE}" down --remove-orphans --rmi local || true
              )
            fi

            sudo chown -R "$(id -u):$(id -g)" "${workspace_root}" || true
            chmod -R u+rwX "${workspace_root}" || true
            rm -rf "${workspace_root}" || sudo rm -rf "${workspace_root}" || true
          fi

          if [ -n "${PEK_CI_IMAGE:-}" ]; then
            docker image rm "${PEK_CI_IMAGE}" || true
          fi

  sonar-release:
    name: Run Sonar analysis when Release tag is pushed
    needs: build-ci-image
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release/') }}
    runs-on: self-hosted-ubuntu-latest-x64
    permissions:
      contents: read
      packages: read
    env:
      DOCKER_COMPOSE_FILE: .github/compose.ci.yaml
      CI_CHECKOUT_PATH: repo-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.build-ci-image.outputs.head_sha }}
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Export isolated workspace root
        run: echo "WORKSPACE_ROOT=${GITHUB_WORKSPACE}/${CI_CHECKOUT_PATH}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare shared CI image
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          CI_IMAGE_SHA: ${{ needs.build-ci-image.outputs.head_sha }}
          CI_IMAGE_TAG: ${{ needs.build-ci-image.outputs.image_tag }}
        run: |
          python3 scripts/private/ci_image.py prepare "$CI_IMAGE_SHA" --tag "$CI_IMAGE_TAG" \
            pek-sonar-check-release

      - name: Run SonarQube release analysis
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_BRANCH: tags/${{ github.ref_name }}
          SONAR_PROJECT_VERSION: ${{ github.ref_name }}
          SONAR_QUALITYGATE_WAIT: "true"
          BUILD_STRING: ${{ needs.build-ci-image.outputs.head_sha }}
        run: |
          SONAR_PROJECT_VERSION="${SONAR_PROJECT_VERSION#release/}"
          export SONAR_PROJECT_VERSION
          docker compose -f "$DOCKER_COMPOSE_FILE" run --rm pek-sonar-check-release

      - name: Cleanup isolated workspace
        if: always()
        run: |
          workspace_root="${WORKSPACE_ROOT:-}"
          expected_workspace_prefix="${GITHUB_WORKSPACE:-}/repo-"

          case "$workspace_root" in
            "${expected_workspace_prefix}"*) ;;
            *)
              echo "Skipping cleanup for unexpected WORKSPACE_ROOT='$workspace_root'" >&2
              exit 0
              ;;
          esac

          if [ -d "$workspace_root" ]; then
            if [ -f "$workspace_root/$DOCKER_COMPOSE_FILE" ]; then
              (
                cd "$workspace_root"
                docker compose -f "$DOCKER_COMPOSE_FILE" down --remove-orphans --rmi local || true
              )
            fi
            sudo chown -R "$(id -u):$(id -g)" "$workspace_root" || true
            chmod -R u+rwX "$workspace_root" || true
            rm -rf "$workspace_root" || sudo rm -rf "$workspace_root" || true
          fi
          if [ -n "${PEK_CI_IMAGE:-}" ]; then
            docker image rm "$PEK_CI_IMAGE" || true
          fi

  valgrind:
    name: Run Valgrind checks in Docker
    needs: build-ci-image
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref_type == 'branch') ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","valgrind"]'), inputs.checks)) ||
      (
        github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' || contains(github.event.label.name, 'run-pek-ci')) &&
        (
          github.event.pull_request.draft == false ||
          (github.event.action == 'labeled' && contains(github.event.label.name, 'run-pek-ci'))
        )
      )
    permissions:
      actions: read
      contents: read
      artifact-metadata: write
      packages: read
    env:
      DOCKER_COMPOSE_FILE: .github/compose.ci.yaml
      VALGRIND_BASELINE_WORKFLOW: pek-ci.yml
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.build-ci-image.outputs.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Run Valgrind Python unit tests
        run: |
          python3 -m unittest \
            scripts/testing/valgrind/test_valgrind_baseline_artifact.py \
            scripts/testing/valgrind/test_compare_valgrind_results.py \
            scripts/testing/valgrind/test_summarize_valgrind_output.py

      - name: Locate latest Valgrind baseline artifact
        if: needs.build-ci-image.outputs.pr_context == 'true'
        id: valgrind_baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VALGRIND_BASELINE_BRANCH: ${{ needs.build-ci-image.outputs.base_ref }}
        run: python3 scripts/testing/valgrind/valgrind-baseline-artifact.py locate

      - name: Wait for missing Valgrind baseline artifact
        if: >-
          needs.build-ci-image.outputs.pr_context == 'true' &&
          steps.valgrind_baseline.outcome != 'success' &&
          github.event_name == 'pull_request'
        id: waited_valgrind_baseline
        env:
          GH_TOKEN: ${{ github.token }}
          VALGRIND_BASELINE_BRANCH: ${{ needs.build-ci-image.outputs.base_ref }}
        run: python3 scripts/testing/valgrind/valgrind-baseline-artifact.py wait

      - name: Require existing Valgrind baseline artifact
        if: >-
          needs.build-ci-image.outputs.pr_context == 'true' &&
          steps.valgrind_baseline.outcome != 'success' &&
          steps.waited_valgrind_baseline.outcome == 'skipped'
        run: |
          echo "Missing Valgrind baseline artifact and no automatic publisher is available." >&2
          exit 1

      - name: Download Valgrind baseline artifact
        if: needs.build-ci-image.outputs.pr_context == 'true' && (steps.valgrind_baseline.outcome == 'success' || steps.waited_valgrind_baseline.outcome == 'success')
        uses: actions/download-artifact@v8
        with:
          name: valgrind-baseline
          path: scripts/testing/valgrind/baseline
          github-token: ${{ github.token }}
          run-id: ${{ steps.valgrind_baseline.outputs.run-id || steps.waited_valgrind_baseline.outputs.run-id }}

      - name: Prepare shared CI image
        env:
          CI_IMAGE_SHA: ${{ needs.build-ci-image.outputs.head_sha }}
          CI_IMAGE_TAG: ${{ needs.build-ci-image.outputs.image_tag }}
        run: |
          python3 scripts/private/ci_image.py prepare "$CI_IMAGE_SHA" --tag "$CI_IMAGE_TAG" \
            pek-valgrind-check \
            pek-generate-valgrind-summary

      - name: Clear stale Valgrind logs
        run: find scripts/testing/valgrind/logs -name "*.valgrind.*.xml" -delete 2>/dev/null || true

      - name: Run Valgrind checks
        id: valgrind_checks
        run: docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm pek-valgrind-check

      - name: Generate Valgrind error summary
        id: valgrind_summary
        if: always() && steps.valgrind_checks.outcome != 'skipped'
        run: docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm pek-generate-valgrind-summary

      - name: Compare Valgrind results to baseline
        if: ${{ needs.build-ci-image.outputs.pr_context == 'true' && steps.valgrind_checks.outcome == 'success' && steps.valgrind_summary.outcome == 'success' }}
        id: valgrind_compare
        run: |
          python3 scripts/testing/valgrind/compare-valgrind-results.py \
            --baseline scripts/testing/valgrind/baseline/valgrind-error-summary.xml \
            --current scripts/testing/valgrind/valgrind-error-summary.xml

      - name: Upload Valgrind raw logs
        if: ${{ always() && !cancelled() && (steps.valgrind_checks.outcome == 'failure' || steps.valgrind_summary.outcome == 'failure' || steps.valgrind_compare.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: valgrind-baseline-logs
          path: scripts/testing/valgrind/logs
          if-no-files-found: warn
          retention-days: 5

      - name: Upload Valgrind baseline
        if: ${{ needs.build-ci-image.outputs.pr_context != 'true' && startsWith(github.ref, 'refs/heads/') && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && steps.valgrind_checks.outcome == 'success' && steps.valgrind_summary.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: valgrind-baseline
          path: scripts/testing/valgrind/valgrind-error-summary.xml
          if-no-files-found: warn
          retention-days: 60

  cleanup-ci-image:
    name: Clean shared PEK CI image
    needs:
      - build-ci-image
      - linux-quick-start-build-test
      - rpi5-quick-start-build-test
      - macos-nightly-test
      - quality-checks
      - sonar
      - sonar-release
      - valgrind
    if: ${{ always() && needs.build-ci-image.result == 'success' && needs.build-ci-image.outputs.pr_context != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout trusted cleanup helper
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Delete CI image
        env:
          GH_TOKEN: ${{ github.token }}
          CI_IMAGE_TAG: ${{ needs.build-ci-image.outputs.image_tag }}
        run: python3 scripts/private/ci_image.py cleanup "$CI_IMAGE_TAG"
