name: Perception Experience Kit CI Pipeline

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number to run the PR validation path manually.
        required: false
        default: ""
        type: string
      pr_base_ref:
        description: Optional PR base branch override for manual PR-context runs.
        required: false
        default: ""
        type: string
      pr_head_ref:
        description: Optional PR head branch for manual PR-context runs.
        required: false
        default: ""
        type: string
      pr_head_sha:
        description: Optional PR head SHA for manual PR-context runs.
        required: false
        default: ""
        type: string
  pull_request:
    branches: [ main, "feature/**", "sandbox/**" ]
    types: [ opened, synchronize, reopened, ready_for_review, labeled ]
  schedule:
    - cron: "0 2 * * *" # Every day at 2 AM UTC'

jobs:
  linux-quick-start-build-test:
    name: Linux x86_64 quick-start build test
    runs-on: ubuntu-latest
    timeout-minutes: 240
    if: |
      github.event_name != 'pull_request' ||
      (
        (github.event.action != 'labeled' || github.event.label.name == 'run-pek-ci') &&
        (
          github.event.pull_request.draft == false ||
          (github.event.action == 'labeled' && github.event.label.name == 'run-pek-ci')
        )
      )
    env:
      PEK_QUICK_START_CI_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      CI_CHECKOUT_PATH: repo-pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.head_ref || github.ref }}
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Show detected quick-start platform
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./scripts/quick-start/detect-environment.sh

      - name: Recreate quick-start container
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./scripts/quick-start/start-container.sh --recreate

      - name: Build quick-start container
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./scripts/build.sh

      - name: Clean quick-start workspace
        if: always()
        env:
          PEK_QUICK_START_CI_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          checkout_path="${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}"
          cleanup_status=0
          if [ -x "$checkout_path/scripts/quick-start/cleanup-container.sh" ]; then
            "$checkout_path/scripts/quick-start/cleanup-container.sh" || cleanup_status=$?
          fi
          rm -rf -- "$checkout_path"
          exit "$cleanup_status"

  rpi5-quick-start-build-test:
    name: Raspberry Pi 5 quick-start build test
    runs-on: [self-hosted, Linux, ARM64, amp-dev-forge-runner-rpi5]
    timeout-minutes: 240
    # Fork PR code must not run on the self-hosted RPI runner. Same-repo PRs intentionally
    # follow the normal CI gate so RPI runs whenever the Linux quick-start build runs.
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (
        github.event_name != 'pull_request' ||
        (
          (github.event.action != 'labeled' || github.event.label.name == 'run-pek-ci') &&
          (
            github.event.pull_request.draft == false ||
            (github.event.action == 'labeled' && github.event.label.name == 'run-pek-ci')
          )
        )
      )
    env:
      PEK_QUICK_START_CI_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      CI_CHECKOUT_PATH: repo-pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      # ponytail: RPI runner drops checkout@v6 temp includeIf credentials during fetch; retry v6 after runner image update.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.head_ref || github.ref }}
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Show detected quick-start platform
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./scripts/quick-start/detect-environment.sh

      - name: Recreate quick-start container
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./scripts/quick-start/start-container.sh --recreate

      - name: Build quick-start container
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./scripts/build.sh

      - name: Clean quick-start workspace
        if: always()
        env:
          PEK_QUICK_START_CI_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          checkout_path="${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}"
          cleanup_status=0
          if [ -x "$checkout_path/scripts/quick-start/cleanup-container.sh" ]; then
            "$checkout_path/scripts/quick-start/cleanup-container.sh" || cleanup_status=$?
          fi
          rm -rf -- "$checkout_path"
          exit "$cleanup_status"

  quality-checks:
    name: Run quality checks in Docker
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      (
        (github.event.action != 'labeled' || github.event.label.name == 'run-pek-ci') &&
        (
          github.event.pull_request.draft == false ||
          (github.event.action == 'labeled' && github.event.label.name == 'run-pek-ci')
        )
      )
    env:
      python_ver: "3.12.1"
      DOCKER_COMPOSE_FILE: .github/compose.ci.yaml
      CI_CHECKOUT_PATH: repo-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - name: Resolve manual PR context
        id: manual_pr
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number="${{ inputs.pr_number }}"
          repo="${{ github.repository }}"
          {
            echo "base_ref=$(gh pr view "${pr_number}" --repo "${repo}" --json baseRefName --jq .baseRefName)"
            echo "head_ref=$(gh pr view "${pr_number}" --repo "${repo}" --json headRefName --jq .headRefName)"
            echo "head_sha=$(gh pr view "${pr_number}" --repo "${repo}" --json headRefOid --jq .headRefOid)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.pr_head_sha || steps.manual_pr.outputs.head_sha || inputs.pr_head_ref || steps.manual_pr.outputs.head_ref || github.head_ref || github.ref }}
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Build docker image
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: |
          docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} build pek-docs-base pek-dev-base

      - name: Check Repo Quality gate (nightly)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr_number == '') }}
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: |
          docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm pek-quality-check-full

      - name: Upload quality report artifact (nightly)
        if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr_number == '')) }}
        uses: actions/upload-artifact@v6
        with:
          name: expkits-ci-quality-report-full
          path: "${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/.github/artifacts/expkits-ci-full-report.txt"
          if-no-files-found: warn
          retention-days: 10

      - name: Upload documentation artifact
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr_number == '') }}
        uses: actions/upload-artifact@v6
        with:
          name: pek-doc
          path: "${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/development/build/doc"
          if-no-files-found: warn
          retention-days: 10

      - name: Check Repo Quality gate (PR)
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '') }}
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export PULL_REQUEST_TARGET_BRANCH="${{ inputs.pr_base_ref || steps.manual_pr.outputs.base_ref || github.base_ref }}"
          # The checkout auth includeIf rules do not apply inside our /work-mounted compose container.
          git_basic_auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${git_basic_auth}"
          echo "::add-mask::${git_basic_auth}"
          echo "::add-mask::${GIT_CONFIG_VALUE_0}"
          docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm \
            -e GIT_CONFIG_COUNT \
            -e GIT_CONFIG_KEY_0 \
            -e GIT_CONFIG_VALUE_0 \
            pek-quality-check-pull-request

      - name: Upload quality report artifact (PR)
        if: ${{ always() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')) }}
        uses: actions/upload-artifact@v6
        with:
          name: expkits-ci-quality-report-pr
          path: "${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/.github/artifacts/expkits-ci-pr-report.txt"
          if-no-files-found: warn
          retention-days: 10

      - name: Perception Experience Kit release build and unit test run
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch') }}
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm
          pek-release-with-ut

      - name: Run clang-tidy baseline check
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch') }}
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ -n "${{ inputs.pr_number }}" ]; then
            export PULL_REQUEST_TARGET_BRANCH="${{ inputs.pr_base_ref || steps.manual_pr.outputs.base_ref || github.base_ref }}"
            # The checkout auth includeIf rules do not apply inside our /work-mounted compose container.
            git_basic_auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${git_basic_auth}"
            echo "::add-mask::${git_basic_auth}"
            echo "::add-mask::${GIT_CONFIG_VALUE_0}"
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm \
              -e PULL_REQUEST_TARGET_BRANCH \
              -e GIT_CONFIG_COUNT \
              -e GIT_CONFIG_KEY_0 \
              -e GIT_CONFIG_VALUE_0 \
              pek-clang-tidy-baseline-check
          else
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm pek-clang-tidy-baseline-check
          fi

      - name: Upload clang-tidy logs
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-baseline
          path: |
            ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/clang-tidy.log
            ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/clang-tidy-stats.log
            ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/clang-tidy-stats.json
          if-no-files-found: warn
          retention-days: 10

      - name: Run Valgrind checks
        id: valgrind_checks
        if: ${{ !cancelled() }}
        continue-on-error: true # Do not block PR until the initial ones are fixed
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm pek-valgrind-check

      - name: Upload Valgrind logs on failure
        if: ${{ !cancelled() && steps.valgrind_checks.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: valgrind-logs
          path: |
            ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/scripts/testing/valgrind/logs
          if-no-files-found: warn
          retention-days: 10
