name: Perception crate

on:
  workflow_call:
    inputs:
      version:
        description: Perception SDK version being released
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Check Perception Cargo version is available
    runs-on: amp-dev-forge-runner-ubuntu-x64
    timeout-minutes: 5
    env:
      NO_PROXY: artifactory.eu02.arm.com,artifactory.arm.com
    steps:
      - name: Check Cargo registry
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          registry="https://artifactory.eu02.arm.com/artifactory/api/cargo/edge-ai-tooling.cargo"
          url="https://artifactory.eu02.arm.com/artifactory/edge-ai-tooling.cargo/crates/perception/perception-$VERSION.crate"
          storage_url="https://artifactory.eu02.arm.com/artifactory/api/storage/edge-ai-tooling.cargo/crates/perception/perception-$VERSION.crate"
          index_url="$registry/index/pe/rc/perception"
          config="$RUNNER_TEMP/perception-cargo-config.json"
          curl_direct=(curl --noproxy "$NO_PROXY" --connect-timeout 10 --max-time 30)

          "${curl_direct[@]}" --fail --silent --show-error \
            --output "$config" "$registry/index/config.json"
          api="$(jq --exit-status --raw-output '.api' "$config")"
          test "$(jq --exit-status --raw-output '.dl' "$config")" = "$api/v1/crates"
          case "$api" in
            https://artifactory.arm.com/artifactory/api/cargo/edge-ai-tooling.cargo | \
              https://artifactory.arm.com:443/artifactory/api/cargo/edge-ai-tooling.cargo | \
              https://artifactory.eu02.arm.com/artifactory/api/cargo/edge-ai-tooling.cargo | \
              https://artifactory.eu02.arm.com:443/artifactory/api/cargo/edge-ai-tooling.cargo) ;;
            *) echo "Unexpected Cargo API route: $api" >&2; exit 1 ;;
          esac
          for unpublished_url in "$url" "$storage_url"; do
            test "$("${curl_direct[@]}" --silent --show-error --output /dev/null \
              --write-out '%{http_code}' "$unpublished_url")" = 404
          done
          index="$RUNNER_TEMP/perception-cargo-index"
          index_status="$("${curl_direct[@]}" --silent --show-error \
            --output "$index" --write-out '%{http_code}' "$index_url")"
          case "$index_status" in
            200)
              jq --exit-status --slurp --arg version "$VERSION" \
                'all(.[]; .vers != $version)' "$index" > /dev/null ;;
            404) ;;
            *) echo "Unexpected Cargo index response: $index_status" >&2; exit 1 ;;
          esac

  publish:
    name: Publish and verify Perception crate
    needs: preflight
    runs-on: amp-dev-forge-runner-ubuntu-x64
    timeout-minutes: 10
    env:
      NO_PROXY: artifactory.eu02.arm.com,artifactory.arm.com
    steps:
      - name: Download Perception SDK input
        uses: actions/download-artifact@v8
        with:
          name: pek-perception-sdk-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pek-perception-sdk-input

      - name: Set up pinned Rust for Perception publication
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.85.0
          cache: false

      - name: Publish and verify Perception crate
        env:
          CARGO_HOME: ${{ runner.temp }}/perception-cargo-home
          RUSTUP_TOOLCHAIN: 1.85.0
          SDK_DIR: ${{ runner.temp }}/pek-perception-sdk-input
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          export no_proxy="$NO_PROXY"
          crate="$SDK_DIR/perception-$VERSION.crate"
          publish_source="$SDK_DIR/perception-cargo-source-$VERSION"
          registry="https://artifactory.eu02.arm.com/artifactory/api/cargo/edge-ai-tooling.cargo"
          url="https://artifactory.eu02.arm.com/artifactory/edge-ai-tooling.cargo/crates/perception/perception-$VERSION.crate"
          storage_url="https://artifactory.eu02.arm.com/artifactory/api/storage/edge-ai-tooling.cargo/crates/perception/perception-$VERSION.crate"
          index_url="$registry/index/pe/rc/perception"
          curl_direct=(curl --noproxy "$NO_PROXY" --connect-timeout 10 --max-time 30)

          rm -rf -- "$CARGO_HOME"
          mkdir -p "$CARGO_HOME"
          cat > "$CARGO_HOME/config.toml" <<'EOF'
          [registries.artifactory]
          index = "sparse+https://artifactory.eu02.arm.com/artifactory/api/cargo/edge-ai-tooling.cargo/index/"
          credential-provider = "cargo:token"

          [registries.crates-io]
          index = "sparse+https://index.crates.io/"
          EOF
          anonymous_token="$(printf 'anonymous:' | base64 -w0)"
          export CARGO_REGISTRIES_ARTIFACTORY_TOKEN="Basic $anonymous_token"
          (cd "$publish_source" && cargo package --locked --no-verify)
          cmp "$crate" "$publish_source/target/package/perception-$VERSION.crate"
          (cd "$publish_source" && cargo publish --locked --no-verify --registry artifactory)

          published="$RUNNER_TEMP/perception-$VERSION.published.crate"
          for attempt in {1..12}; do
            if "${curl_direct[@]}" --fail-with-body --silent --show-error \
              --output "$published" "$url" && \
              "${curl_direct[@]}" --fail --silent --show-error "$storage_url" | \
                jq --exit-status \
                  '.createdBy == "anonymous" and .modifiedBy == "anonymous"' \
                  > /dev/null; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "Published Perception crate or ownership did not become visible." >&2
              exit 1
            fi
            sleep 5
          done
          cmp "$crate" "$published"

          checksum="$(sha256sum "$published" | cut -d' ' -f1)"
          for attempt in {1..12}; do
            if "${curl_direct[@]}" --fail --silent --show-error "$index_url" | \
              jq --exit-status --slurp \
                --arg version "$VERSION" --arg checksum "$checksum" \
                'any(.[]; .name == "perception" and .vers == $version and .cksum == $checksum and .yanked == false)' \
                > /dev/null; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "Cargo index did not expose the expected Perception crate." >&2
              exit 1
            fi
            sleep 5
          done
          printf "### Perception Cargo\n\n- URL: %s\n- SHA-256: \`%s\`\n- Sparse index: %s\n" \
            "$url" "$checksum" "$index_url" >> "$GITHUB_STEP_SUMMARY"

  consumer:
    name: Consume Perception crate (${{ matrix.architecture }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: self-hosted-ubuntu-latest-x64
          - architecture: aarch64
            runner: self-hosted-ubuntu-latest-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Set up pinned Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.85.0
          cache: false

      - name: Build a clean exact-pinned consumer
        env:
          CARGO_HOME: ${{ runner.temp }}/perception-cargo-consumer-home
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/perception-cargo-consumer"
          rm -rf -- "$CARGO_HOME" "$consumer"
          mkdir -p "$CARGO_HOME" "$consumer/bin" "$consumer/src"
          printf '#!/bin/sh\nexit 99\n' > "$consumer/bin/flatc"
          chmod +x "$consumer/bin/flatc"
          export PATH="$consumer/bin:$PATH"
          cat > "$CARGO_HOME/config.toml" <<'EOF'
          [registries.artifactory]
          index = "sparse+https://artifactory.arm.com/artifactory/api/cargo/edge-ai-tooling.cargo/index/"
          EOF
          cat > "$consumer/Cargo.toml" <<EOF
          [package]
          name = "perception-release-consumer"
          version = "0.0.0"
          edition = "2021"

          [dependencies]
          perception = { version = "=$VERSION", registry = "artifactory" }
          EOF
          cat > "$consumer/src/main.rs" <<EOF
          fn main() {
              assert_eq!(perception::PERCEPTION_VERSION, "$VERSION");
          }
          EOF
          (cd "$consumer" && cargo generate-lockfile)
          (cd "$consumer" && cargo run --locked)
          test -z "$(find "$CARGO_HOME/registry/src" \
            -path "*/perception-$VERSION/build.rs" -print -quit)"
