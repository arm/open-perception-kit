name: Publish Playwright Reports

on:
  workflow_run:
    workflows: ["PEK CI"]
    types: [completed]
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write
  pages: write
  pull-requests: read

concurrency:
  group: ${{ github.event_name == 'workflow_run' && 'report-pages' || 'report-pages-maintenance' }}
  cancel-in-progress: false

jobs:
  publish-report:
    name: Publish latest Playwright report
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v7

      - name: Run publisher unit tests
        run: python3 -m unittest scripts/playwright/pages/test_publish_playwright_pages.py

      - name: Update General Pages content
        id: pages_general
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: scripts/playwright/pages/run.sh publish

      - name: Update macOS Pages content
        id: pages_macos
        if: ${{ github.event.workflow_run.event == 'schedule' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAYWRIGHT_PAGES_ARTIFACT_PREFIX: macos-browser-smoke
          PLAYWRIGHT_PAGES_NIGHTLY_DIRECTORY: nightly-macos
          PLAYWRIGHT_PAGES_REPORT_TITLE: Arm Perception kit - macOS
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: scripts/playwright/pages/run.sh publish

      - name: Cache YOLO performance dataset
        if: steps.pages_general.outputs.deploy == 'true' || steps.pages_macos.outputs.deploy == 'true'
        uses: actions/cache@v6
        with:
          path: _yolo_performance_dataset_cache
          key: yolo-performance-datasets-coco-val2017-4f7e2ccb2866ec5041993c9cf2a952bbed69647b115d0f74da7ce8f4bef82f05

      - name: Restore YOLO dataset overlay
        if: steps.pages_general.outputs.deploy == 'true' || steps.pages_macos.outputs.deploy == 'true'
        run: |
          python3 examples/yolo-benchmark/pages/restore_dataset_overlay.py \
            --site-dir _playwright_pages_site \
            --cache-dir _yolo_performance_dataset_cache

      - name: Restore deploy-only report videos
        if: steps.pages_general.outputs.deploy == 'true' || steps.pages_macos.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 examples/yolo-benchmark/pages/publish_yolo_benchmark_pages.py \
            restore-latest _playwright_pages_site
          python3 scripts/playwright/pages/publish_playwright_pages.py \
            restore-videos _playwright_pages_site

      - name: Configure Pages
        if: steps.pages_general.outputs.deploy == 'true' || steps.pages_macos.outputs.deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.pages_general.outputs.deploy == 'true' || steps.pages_macos.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _playwright_pages_site

      - name: Deploy Pages
        if: steps.pages_general.outputs.deploy == 'true' || steps.pages_macos.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

  cleanup-closed-pr-reports:
    name: Reconcile nightly and clean closed PR reports
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v7

      - name: Run publisher unit tests
        run: python3 -m unittest scripts/playwright/pages/test_publish_playwright_pages.py

      - name: Resolve latest scheduled PEK CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pek-ci.yml/runs?event=schedule&branch=develop&status=completed&per_page=1" \
            --jq '.workflow_runs[0] | [
              "UPSTREAM_CONCLUSION=" + (.conclusion // ""),
              "UPSTREAM_EVENT=" + (.event // ""),
              "UPSTREAM_HEAD_BRANCH=" + (.head_branch // ""),
              "UPSTREAM_HEAD_REPOSITORY=" + (.head_repository.full_name // ""),
              "UPSTREAM_HEAD_SHA=" + (.head_sha // ""),
              "UPSTREAM_PR_NUMBER=",
              "UPSTREAM_RUN_ATTEMPT=" + (.run_attempt | tostring),
              "UPSTREAM_RUN_ID=" + (.id | tostring)
            ] | .[]' >> "${GITHUB_ENV}"

      - name: Reconcile General nightly Pages content
        id: nightly_general
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/playwright/pages/run.sh publish

      - name: Reconcile macOS nightly Pages content
        id: nightly_macos
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAYWRIGHT_PAGES_ARTIFACT_PREFIX: macos-browser-smoke
          PLAYWRIGHT_PAGES_NIGHTLY_DIRECTORY: nightly-macos
          PLAYWRIGHT_PAGES_REPORT_TITLE: Arm Perception kit - macOS
        run: scripts/playwright/pages/run.sh publish

      - name: Remove old closed PR reports
        id: cleanup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/playwright/pages/run.sh cleanup

      - name: Select Pages deployment
        id: pages
        env:
          CLEANUP_CHANGED: ${{ steps.cleanup.outputs.deploy }}
          GENERAL_CHANGED: ${{ steps.nightly_general.outputs.deploy }}
          MACOS_CHANGED: ${{ steps.nightly_macos.outputs.deploy }}
        run: |
          if [[ "${CLEANUP_CHANGED}" == "true" || "${GENERAL_CHANGED}" == "true" || "${MACOS_CHANGED}" == "true" ]]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          else
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Queue serialized Pages deployment
        if: steps.pages.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER_REF: ${{ github.event.repository.default_branch }}
        run: >-
          gh workflow run report-status-pages.yml --ref "${PUBLISHER_REF}"
          -f "upstream_run_id=${UPSTREAM_RUN_ID}" -f force_deploy=true
