name: PR Bookkeeping

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  bookkeeping:
    name: Generate PR description
    runs-on: self-hosted-ubuntu-latest-x64
    container:
      image: ${{ format('{0}/pek-pr-automation:latest', vars.ARTIFACTORY_DOCKER_REGISTRY) }}
      credentials:
        username: ${{ secrets.PEK_ARTIFACTORY_USERNAME }}
        password: ${{ secrets.PEK_ARTIFACTORY_API_KEY }}

    steps:
      - name: Checkout base repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0

      - name: Generate PR description with Copilot
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          PR_TARGET_BRANCH: ${{ github.base_ref }}
          PR_SOURCE_BRANCH: ${{ github.head_ref }}
          PR_HEAD_REPO_URL: https://github.com/${{ github.event.pull_request.head.repo.full_name }}.git
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./scripts/ci/generate-pr-description.sh | \
            GITHUB_TOKEN="${{ github.token }}" \
            ./scripts/ci/update-pr-body.sh \
              "${{ github.repository }}" \
              "${{ github.event.pull_request.number }}"
