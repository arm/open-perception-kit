name: PR39 supplemental tests

on:
  push:
    branches: [bugfix/PR-39-python-deps-ci-01a0d7ba]

permissions:
  contents: read

jobs:
  tools:
    name: Python tooling (${{ matrix.variant }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: pr39-fixed
            ref: 46edafd777ff173699de11f3494d1974afaadabe
    env:
      PYTHONPATH: tools/opk-ci:tools/plumber:scripts/private
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate SDKs
        uses: ./.github/actions/setup-sdk

      - name: Install Python tooling
        run: python3 -m pip install -c requirements/sdk.txt ./generated/perception/python ./tools/opk-ci ./tools/plumber

      - name: Install shellcheck
        run: sudo apt-get install -y --no-install-recommends shellcheck

      - name: Install repository-pinned lint tools
        env:
          GOBIN: ${{ runner.temp }}/opk-ci-tools
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.8.0
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Verify test tools
        id: dependencies
        run: command -v actionlint shfmt shellcheck clang-format cmake-format pyflakes

      - name: Complete opk-ci suite
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: coverage run --parallel-mode -m unittest discover -s tools/opk-ci/tests -v

      - name: Complete Plumber suite
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: coverage run --parallel-mode -m unittest discover -s tools/plumber/tests -v

      - name: Complete Valgrind helper suite
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: coverage run --parallel-mode -m unittest discover -s scripts/testing/valgrind -v

      - name: Complete private helper suite
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: coverage run --parallel-mode -m unittest discover -s scripts/private/tests -v

      - name: Diagnose repository secret check
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python3 -m opk_ci --check-secrets

      - name: Collect Python coverage
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          coverage combine
          coverage xml -o supplemental-coverage.xml

      - name: Upload Python coverage
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: pr39-supplemental-coverage-${{ matrix.variant }}
          path: supplemental-coverage.xml
          if-no-files-found: warn
          retention-days: 7
