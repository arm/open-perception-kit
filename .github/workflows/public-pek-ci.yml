name: Public PEK CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-pek-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-ci-image:
    name: Build PEK CI image locally
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PEK_CI_IMAGE: pek-ci:local
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Prepare pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git check-ref-format --branch "$BASE_REF"
          if ! git cat-file -e "$BASE_SHA^{commit}"; then
            BASE_SHA="$(git rev-parse HEAD^1)"
          fi
          git update-ref "refs/remotes/origin/$BASE_REF" "$BASE_SHA"

      - name: Build PEK CI image
        run: |
          docker build --pull --target pek-ci --tag pek-ci:local . ||
            { sleep 10; docker build --pull --target pek-ci --tag pek-ci:local .; } ||
            { sleep 30; docker build --pull --target pek-ci --tag pek-ci:local .; }

      - name: Verify local image
        run: docker image inspect pek-ci:local

      - name: Build PEK for clang-tidy
        run: |
          install -d -m 0777 .cache/ccache
          docker compose -f .github/compose.ci.yaml run --rm pek-ci bash -c '
            .devcontainer/setup.sh &&
            .devcontainer/platform_init.sh pek-dev disabled &&
            ./scripts/build.sh release true
          '

      - name: Run clang-tidy baseline check
        env:
          PULL_REQUEST_TARGET_BRANCH: ${{ github.base_ref }}
        run: |
          docker compose -f .github/compose.ci.yaml run --rm \
            -e PULL_REQUEST_TARGET_BRANCH \
            pek-clang-tidy-baseline-check
