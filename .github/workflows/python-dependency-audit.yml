name: Python Dependency Audit

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (${{ matrix.package.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: expkits-ci
            path: tools/expkits-ci
          - name: plumber
            path: tools/plumber

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ${{ matrix.package.path }}/pyproject.toml

      - name: Run pip-audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: ${{ matrix.package.path }}/
          summary: true
