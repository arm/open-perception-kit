name: Python Dependency Audit

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Optional exact source ref for a caller-managed PR run.
        required: false
        default: ""
        type: string
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (${{ matrix.package.name }})
    runs-on: self-hosted-ubuntu-latest-x64
    if: |
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (github.event.action == 'labeled' && github.event.label.name == 'run-python-audit') ||
          ((github.event.action == 'synchronize' || github.event.action == 'reopened') &&
            contains(github.event.pull_request.labels.*.name, 'run-python-audit'))
        )
      )
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: expkits-ci
            path: tools/expkits-ci
          - name: plumber
            path: tools/plumber

    steps:
      - name: Checkout current ref
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Checkout pull request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ${{ matrix.package.path }}/pyproject.toml

      - name: Run pip-audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: ${{ matrix.package.path }}/
          summary: true
