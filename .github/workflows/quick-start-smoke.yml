name: quick-start-smoke

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag, or branch to check out (defaults to the triggering ref)
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: Commit, tag, or branch to check out (defaults to the triggering ref)
        required: false
        type: string

concurrency:
  group: quick-start-smoke-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-start-smoke:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main' || inputs.ref != ''
    name: quick-start-smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    env:
      OPK_BUILD_BASE_CACHE_FROM: ghcr.io/arm/open-perception-kit-quick-start-cache:base-${{ matrix.arch }}
      OPK_DEV_CACHE_FROM: ghcr.io/arm/open-perception-kit-quick-start-cache:dev-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Run quick-start smoke
        uses: ./.github/actions/quick-start-smoke
        with:
          arch: ${{ matrix.arch }}

  publish-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.ref == ''
    name: quick-start-smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      OPK_BUILD_BASE_CACHE_FROM: ghcr.io/arm/open-perception-kit-quick-start-cache:base-${{ matrix.arch }}
      OPK_DEV_CACHE_FROM: ghcr.io/arm/open-perception-kit-quick-start-cache:dev-${{ matrix.arch }}
      OPK_BUILD_BASE_CACHE_TO: type=registry,ref=ghcr.io/arm/open-perception-kit-quick-start-cache:base-${{ matrix.arch }},mode=max
      OPK_DEV_CACHE_TO: type=registry,ref=ghcr.io/arm/open-perception-kit-quick-start-cache:dev-${{ matrix.arch }},mode=max
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Run quick-start smoke
        uses: ./.github/actions/quick-start-smoke
        with:
          arch: ${{ matrix.arch }}
