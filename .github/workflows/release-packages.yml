name: PEK release packages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit, tag, or branch to package
        required: true
        type: string

permissions:
  contents: read

env:
  CCACHE_SCHEMA_VERSION: v2

jobs:
  prepare:
    name: Resolve release source
    runs-on: self-hosted-ubuntu-latest-x64
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      cargo_package_version: ${{ steps.release.outputs.cargo_package_version }}
      python_package_version: ${{ steps.release.outputs.python_package_version }}
      commit: ${{ steps.release.outputs.commit }}
      flowdata_commit: ${{ steps.release.outputs.flowdata_commit }}
      build_id: ${{ steps.release.outputs.build_id }}
      kind: ${{ steps.mode.outputs.kind }}
      source_branch: ${{ steps.prerelease.outputs.source_branch }}
      image_tag: ${{ steps.image.outputs.tag }}
      x86_archive: ${{ steps.release.outputs.x86_archive }}
      arm_archive: ${{ steps.release.outputs.arm_archive }}
      docs_archive: ${{ steps.release.outputs.docs_archive }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout selected source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.event.inputs.source_ref || github.sha }}
          path: source

      - name: Resolve publication mode
        id: mode
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "kind=prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "kind=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare private submodules for prerelease generation
        if: steps.mode.outputs.kind == 'prerelease'
        env:
          DEPLOY_KEY_FLOWDATA_SDK: ${{ secrets.DEPLOY_KEY_FLOWDATA_SDK }}
        run: |
          source .github/scripts/configure_workspace_ssh.sh
          git -C source submodule update --init --recursive

      - name: Resolve generated prerelease identity
        if: steps.mode.outputs.kind == 'prerelease'
        id: prerelease
        run: |
          python3 scripts/release/ReleaseTool.py prepare-prerelease \
            --commit "$(git -C source rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Set up prerelease generator builder
        if: steps.mode.outputs.kind == 'prerelease'
        uses: docker/setup-buildx-action@v4

      - name: Build prerelease generator image
        if: steps.mode.outputs.kind == 'prerelease'
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha,scope=pek-ci
          context: source
          load: true
          pull: true
          tags: pek-prerelease-generator:${{ github.run_id }}
          target: pek-ci

      - name: Generate and commit the prerelease version
        if: steps.mode.outputs.kind == 'prerelease'
        id: materialize
        working-directory: source
        env:
          PRERELEASE_BRANCH: ${{ steps.prerelease.outputs.source_branch }}
          PRERELEASE_VERSION: ${{ steps.prerelease.outputs.version }}
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint bash \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env PEK_PERCEPTION_IN_CONTAINER=1 \
            --env PRERELEASE_VERSION \
            --mount "type=bind,source=$PWD,target=$PWD" \
            --workdir "$PWD" \
            "pek-prerelease-generator:$GITHUB_RUN_ID" -euxc \
            './scripts/perception-sdk.sh generate --version "$PRERELEASE_VERSION" --package-prerelease &&
             detect-secrets scan --baseline .secrets.baseline'
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add --all
          if git diff --cached --quiet; then
            echo "prerelease generation produced no changes" >&2
            exit 1
          fi
          git -c core.hooksPath=/dev/null commit -m "Generate prerelease $PRERELEASE_VERSION"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push generated prerelease branch
        if: steps.mode.outputs.kind == 'prerelease'
        env:
          GENERATED_COMMIT: ${{ steps.materialize.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE_BRANCH: ${{ steps.prerelease.outputs.source_branch }}
        run: |
          set -euo pipefail
          test "$PRERELEASE_BRANCH" = "sandbox/prerelease-source/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git fetch --no-tags ./source "$GENERATED_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$GENERATED_COMMIT"
          git -c credential.https://github.com.helper= \
            -c 'credential.https://github.com.helper=!gh auth git-credential' \
            -c core.hooksPath=/dev/null push --no-verify \
            origin "FETCH_HEAD:refs/heads/$PRERELEASE_BRANCH"

      - name: Prepare release identity
        id: release
        env:
          BUILD_LABEL: ${{ steps.prerelease.outputs.build_label }}
          PRERELEASE_COMMIT: ${{ steps.materialize.outputs.commit }}
        run: |
          set -euo pipefail
          commit="${PRERELEASE_COMMIT:-$(git -C source rev-parse HEAD)}"
          python3 scripts/release/ReleaseTool.py prepare \
            --repo-root source \
            --commit "$commit" \
            --build-label "${BUILD_LABEL:-}"
          echo "flowdata_commit=$(git -C source rev-parse HEAD:tools/flowdata-sdk)" \
            >> "$GITHUB_OUTPUT"

      - name: Reject an existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists." >&2
            exit 1
          fi

      - name: Resolve image tag
        id: image
        env:
          BUILD_ID: ${{ steps.release.outputs.build_id }}
        run: |
          tag="$BUILD_ID"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$tag-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Remove prerelease generator image
        if: always() && steps.mode.outputs.kind == 'prerelease'
        run: docker image rm "pek-prerelease-generator:$GITHUB_RUN_ID" 2>/dev/null || true

  build:
    name: Build ${{ matrix.architecture }} package
    needs: prepare
    strategy:
      matrix:
        include:
          - architecture: x86_64
            artifact_label: x86
            cache_tag: amd64
            platform: linux/amd64
            runner: self-hosted-ubuntu-latest-x64
          - architecture: aarch64
            artifact_label: arm
            cache_tag: arm64
            platform: linux/arm64
            runner: self-hosted-ubuntu-latest-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_IMAGE: ghcr.io/arm-debug/amp-dev-forge-deployment
      SOURCE_DIR: source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.artifact_label }}
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          path: ${{ env.SOURCE_DIR }}
          persist-credentials: false

      - name: Set up Docker builder
        id: builder
        uses: docker/setup-buildx-action@v4

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache@v6
        with:
          path: .cache/ccache-release
          key: pek-ccache-${{ env.CCACHE_SCHEMA_VERSION }}-${{ runner.os }}-${{ runner.arch }}-release-${{ needs.prepare.outputs.commit }}
          restore-keys: |
            pek-ccache-${{ env.CCACHE_SCHEMA_VERSION }}-${{ runner.os }}-${{ runner.arch }}-release-
            pek-ccache-${{ env.CCACHE_SCHEMA_VERSION }}-${{ runner.os }}-${{ runner.arch }}-deployment-

      - name: Attach compiler cache to Docker builder
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.builder.outputs.name }}
          cache-map: |
            {
              ".cache/ccache-release": {
                "target": "/work/.cache/ccache",
                "id": "pek-deployment-ccache",
                "sharing": "locked"
              }
            }
          skip-extraction: ${{ steps.compiler-cache.outputs.cache-hit }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }} # pragma: allowlist secret

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build release image
        id: build
        uses: docker/build-push-action@v7
        with:
          build-args: |
            HF_DOWNLOAD_CACHEBUST=github-${{ github.run_id }}-${{ github.run_attempt }}
            PEK_RELEASE_BUILD=true
            PEK_RELEASE_BUILD_ID=${{ needs.prepare.outputs.build_id }}
            PEK_RELEASE_SOURCE_COMMIT=${{ needs.prepare.outputs.commit }}
            PEK_FLOWDATA_SDK_COMMIT=${{ needs.prepare.outputs.flowdata_commit }}
          cache-from: type=registry,ref=${{ env.RELEASE_IMAGE }}:buildcache-${{ matrix.cache_tag }}
          context: ${{ env.SOURCE_DIR }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.image_tag }}
          outputs: type=image,name=${{ env.RELEASE_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          platforms: ${{ matrix.platform }}
          provenance: false
          pull: true
          secrets: |
            "huggingface_token=${{ secrets.HF_TOKEN }}"
            "executorch_artifactory_username=${{ secrets.PEK_ARTIFACTORY_USERNAME }}"
            "executorch_artifactory_password=${{ secrets.PEK_ARTIFACTORY_API_KEY }}"
          target: pek-deployment-base

      - name: Extract package from release image
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          ARCHIVE: ${{ matrix.architecture == 'x86_64' && needs.prepare.outputs.x86_archive || needs.prepare.outputs.arm_archive }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p dist
          docker pull "$RELEASE_IMAGE@$IMAGE_DIGEST"
          container_id="$(docker create "$RELEASE_IMAGE@$IMAGE_DIGEST")"
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          docker cp \
            "$container_id:/opt/pek-release-artifacts/$ARCHIVE" "dist/$ARCHIVE"
          if [[ "${{ matrix.architecture }}" == aarch64 ]]; then
            mkdir -p dist/perception-sdk-input
            package="${ARCHIVE%.tar.gz}"
            tar -C dist/perception-sdk-input --strip-components=4 -xzf "dist/$ARCHIVE" \
              "$package/share/pek/perception-sdk"
          fi

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: pek-release-${{ matrix.artifact_label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SOURCE_DIR }}/dist/${{ matrix.architecture == 'x86_64' && needs.prepare.outputs.x86_archive || needs.prepare.outputs.arm_archive }}
          if-no-files-found: error
          retention-days: 7

      - name: Set up pinned Rust for Perception packaging
        if: matrix.architecture == 'aarch64'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.85.0

      - name: Package Perception Rust crate
        if: matrix.architecture == 'aarch64'
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          CARGO_PACKAGE_VERSION: ${{ needs.prepare.outputs.cargo_package_version }}
          PYTHON_PACKAGE_VERSION: ${{ needs.prepare.outputs.python_package_version }}
          RUSTUP_TOOLCHAIN: 1.85.0
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          export_root="$RUNNER_TEMP/perception-sdk-$VERSION"
          rm -rf -- "$export_root"
          python3 -m zipfile -e \
            "dist/perception-sdk-input/perception-sdk-$VERSION.zip" "$RUNNER_TEMP"
          rust="$export_root/rust"
          sed -i \
            -e '/^\[package\]$/a exclude = ["vendor/**", ".cargo/**", "crates/**"]' \
            -e 's/^flatbuffers = "\(=[^"]*\)"$/flatbuffers = { version = "\1", registry = "crates-io" }/' \
            "$rust/Cargo.toml"
          python3 - "$rust/Cargo.toml" <<'PY'
          import sys
          import tomllib

          with open(sys.argv[1], "rb") as manifest_file:
              manifest = tomllib.load(manifest_file)
          assert manifest["package"]["exclude"] == ["vendor/**", ".cargo/**", "crates/**"]
          assert manifest["dependencies"]["flatbuffers"]["registry"] == "crates-io"
          assert manifest["dependencies"]["flatbuffers"]["version"].startswith("=")
          PY
          printf '\n[registries.crates-io]\nindex = "sparse+https://index.crates.io/"\n' \
            >> "$rust/.cargo/config.toml"
          (cd "$rust" && cargo package --offline --locked)
          publish_source="$RUNNER_TEMP/perception-cargo-source-$VERSION"
          rm -rf -- "$publish_source"
          python3 - "$rust" "$publish_source" <<'PY'
          import shutil
          import sys

          shutil.copytree(
              sys.argv[1],
              sys.argv[2],
              ignore=shutil.ignore_patterns(".cargo", "crates", "target", "vendor"),
          )
          PY
          publish_cargo_home="$RUNNER_TEMP/perception-publish-cargo-home"
          rm -rf -- "$publish_cargo_home"
          mkdir -p "$publish_cargo_home"
          cat > "$publish_cargo_home/config.toml" <<'EOF'
          [registries.crates-io]
          index = "sparse+https://index.crates.io/"
          EOF
          (
            cd "$publish_source"
            CARGO_HOME="$publish_cargo_home" \
              cargo package --locked
          )
          cp "$publish_source/target/package/perception-$CARGO_PACKAGE_VERSION.crate" \
            dist/perception-sdk-input/
          rm -rf -- "$publish_source/target"
          mv "$publish_source" dist/perception-sdk-input/
          cp "$export_root/python/opk_perception_sdk-$PYTHON_PACKAGE_VERSION-py3-none-any.whl" \
            dist/perception-sdk-input/

      - name: Upload Perception SDK input
        if: matrix.architecture == 'aarch64'
        uses: actions/upload-artifact@v7
        with:
          name: pek-perception-sdk-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SOURCE_DIR }}/dist/perception-sdk-input/
          if-no-files-found: error
          retention-days: 7

      - name: Record image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/image-digest-${{ matrix.artifact_label }}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: pek-image-digest-${{ matrix.artifact_label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-digest-${{ matrix.artifact_label }}
          if-no-files-found: error
          retention-days: 7

      - name: Clean isolated build workspace
        if: always()
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker image rm "$RELEASE_IMAGE@$IMAGE_DIGEST" 2>/dev/null || true
          rm -rf -- "$SOURCE_DIR"

  release-image:
    name: Publish multi-architecture release image
    needs: [prepare, build, perception-cargo-preflight]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.build.result == 'success' &&
      needs.perception-cargo-preflight.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      reference: ${{ steps.publish.outputs.reference }}
    env:
      RELEASE_IMAGE: ghcr.io/arm-debug/amp-dev-forge-deployment
    steps:
      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          pattern: pek-image-digest-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: digests
          merge-multiple: true

      - name: Publish image index
        id: publish
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          set -euo pipefail
          X86_DIGEST="$(<digests/image-digest-x86)"
          ARM_DIGEST="$(<digests/image-digest-arm)"
          reference="$RELEASE_IMAGE:$IMAGE_TAG"
          if docker buildx imagetools inspect "$reference" >/dev/null 2>&1; then
            echo "Image $reference already exists." >&2
            exit 1
          fi
          docker buildx imagetools create \
            --tag "$reference" \
            --metadata-file image-metadata.json \
            "$RELEASE_IMAGE@$X86_DIGEST" \
            "$RELEASE_IMAGE@$ARM_DIGEST"
          digest="$(jq -er '."containerimage.descriptor".digest' image-metadata.json)"
          docker buildx imagetools inspect "$reference"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016
          printf '### PEK deployment image\n\n- `%s@%s`\n' \
            "$reference" "$digest" >> "$GITHUB_STEP_SUMMARY"

  build-docs:
    name: Build documentation package
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      DOCS_IMAGE: pek-docs:${{ needs.prepare.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Build existing documentation image
        run: docker build --pull --target pek-docs --tag "$DOCS_IMAGE" .

      - name: Generate and package documentation
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env BUILD_ID \
            --env HOME=/tmp \
            --env PEK_PROJECT_ROOT="$PWD" \
            --volume "$PWD:$PWD" \
            --workdir "$PWD" \
            "$DOCS_IMAGE" \
            bash -euxc '
              scripts/gen-doc.sh
              package="pek-docs-$BUILD_ID"
              stage="$(mktemp -d)/$package"
              test -f docs/html/index.html
              test -f development/build/doc/doxygen/html/index.html
              mkdir -p "$stage/html" "$stage/doxygen" dist
              cp -a docs/html/. "$stage/html/"
              cp -a development/build/doc/doxygen/html/. "$stage/doxygen/"
              tar -C "$(dirname "$stage")" -czf "dist/$package.tar.gz" "$package"
              sha256sum "dist/$package.tar.gz"
            '

      - name: Upload documentation package
        uses: actions/upload-artifact@v7
        with:
          name: pek-release-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/${{ needs.prepare.outputs.docs_archive }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove documentation image
        if: always()
        run: docker image rm "$DOCS_IMAGE" 2>/dev/null || true

  release-docs-staging:
    name: Publish release docs to staging
    if: needs.prepare.outputs.kind == 'stable'
    needs: prepare
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/docs-publish.yml
    with:
      publish_ref: ${{ needs.prepare.outputs.commit }}

  perception-cargo-preflight:
    name: Check Perception Cargo version is available
    needs: prepare
    runs-on: amp-dev-forge-runner-ubuntu-x64
    timeout-minutes: 5
    env:
      NO_PROXY: artifactory.eu02.arm.com,artifactory.arm.com
    steps:
      - name: Check Cargo registry
        env:
          VERSION: ${{ needs.prepare.outputs.cargo_package_version }}
        run: |
          set -euo pipefail
          registry="https://artifactory.eu02.arm.com/artifactory/api/cargo/edge-ai-tooling.cargo"
          url="https://artifactory.eu02.arm.com/artifactory/edge-ai-tooling.cargo/crates/perception/perception-$VERSION.crate"
          storage_url="https://artifactory.eu02.arm.com/artifactory/api/storage/edge-ai-tooling.cargo/crates/perception/perception-$VERSION.crate"
          index_url="$registry/index/pe/rc/perception"
          config="$RUNNER_TEMP/perception-cargo-config.json"
          curl_direct=(curl --noproxy "$NO_PROXY" --connect-timeout 10 --max-time 30)

          "${curl_direct[@]}" --fail --silent --show-error \
            --output "$config" "$registry/index/config.json"
          api="$(jq --exit-status --raw-output '.api' "$config")"
          test "$(jq --exit-status --raw-output '.dl' "$config")" = "$api/v1/crates"
          case "$api" in
            https://artifactory.arm.com/artifactory/api/cargo/edge-ai-tooling.cargo | \
              https://artifactory.arm.com:443/artifactory/api/cargo/edge-ai-tooling.cargo | \
              https://artifactory.eu02.arm.com/artifactory/api/cargo/edge-ai-tooling.cargo | \
              https://artifactory.eu02.arm.com:443/artifactory/api/cargo/edge-ai-tooling.cargo) ;;
            *) echo "Unexpected Cargo API route: $api" >&2; exit 1 ;;
          esac
          for unpublished_url in "$url" "$storage_url"; do
            test "$("${curl_direct[@]}" --silent --show-error --output /dev/null \
              --write-out '%{http_code}' "$unpublished_url")" = 404
          done
          index="$RUNNER_TEMP/perception-cargo-index"
          index_status="$("${curl_direct[@]}" --silent --show-error \
            --output "$index" --write-out '%{http_code}' "$index_url")"
          case "$index_status" in
            200)
              jq --exit-status --slurp --arg version "$VERSION" \
                'all(.[]; .vers != $version)' "$index" > /dev/null ;;
            404) ;;
            *) echo "Unexpected Cargo index response: $index_status" >&2; exit 1 ;;
          esac


  github-release:
    name: Publish one GitHub release
    needs: [prepare, build, build-docs, release-image, perception-cargo-preflight]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout released source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: pek-release-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
          merge-multiple: true

      - name: Publish release after all uploads succeed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          IMAGE_REFERENCE: ${{ needs.release-image.outputs.reference }}
          IMAGE_DIGEST: ${{ needs.release-image.outputs.digest }}
          KIND: ${{ needs.prepare.outputs.kind }}
        run: |
          set -euo pipefail
          mapfile -t archives < <(find release -maxdepth 1 -type f -name "*.tar.gz" | sort)
          test "${#archives[@]}" -eq 3
          hashes="$(sha256sum "${archives[@]}")"
          if [[ "$KIND" == stable ]]; then
            sed -n "/^## \\[$VERSION\\]/,/^## \\[/p" CHANGELOG.md |
              sed "\$d" > release-body.md
          else
            # shellcheck disable=SC2016
            printf 'Automated prerelease `%s` from `%s`.\n' \
              "$VERSION" "$COMMIT" > release-body.md
          fi
          {
            # shellcheck disable=SC2016
            printf '\nSource commit: `%s`\n\n### Archives\n\n' "$COMMIT"
            while read -r hash file; do
              # shellcheck disable=SC2016
              printf -- '- `%s` — `%s`\n' "$(basename "$file")" "$hash"
            done <<< "$hashes"
          } >> release-body.md
          # shellcheck disable=SC2016
          printf '\n### Container image\n\n`%s@%s`\n' \
            "$IMAGE_REFERENCE" "$IMAGE_DIGEST" >> release-body.md
          release_args=(--draft --target "$COMMIT" --title "PEK $VERSION" \
            --notes-file release-body.md)
          if [[ "$KIND" == prerelease ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "v$VERSION" "${release_args[@]}"
          gh release upload "v$VERSION" "${archives[@]}"
          gh release edit "v$VERSION" --draft=false

  artifactory:
    name: Publish one Artifactory release
    needs: [prepare, build, build-docs, release-image, github-release]
    if: >-
      ${{ always() &&
          needs.prepare.result == 'success' &&
          needs.build.result == 'success' &&
          needs.build-docs.result == 'success' &&
          needs.release-image.result == 'success' &&
          needs.github-release.result == 'success' }}
    runs-on: self-hosted-ubuntu-latest-x64
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: pek-release-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pek-release-artifacts
          merge-multiple: true

      - name: Download Perception SDK input
        uses: actions/download-artifact@v8
        with:
          name: pek-perception-sdk-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pek-perception-sdk-input

      - name: Stage Perception language packages
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/pek-release-artifacts
          CARGO_PACKAGE_VERSION: ${{ needs.prepare.outputs.cargo_package_version }}
          PYTHON_PACKAGE_VERSION: ${{ needs.prepare.outputs.python_package_version }}
          SDK_DIR: ${{ runner.temp }}/pek-perception-sdk-input
        run: |
          set -euo pipefail
          cp "$SDK_DIR/opk_perception_sdk-$PYTHON_PACKAGE_VERSION-py3-none-any.whl" \
            "$ARTIFACTS_DIR/"
          cp "$SDK_DIR/perception-$CARGO_PACKAGE_VERSION.crate" "$ARTIFACTS_DIR/"

      - name: Accept exactly three archives and two language packages
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/pek-release-artifacts
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          CARGO_PACKAGE_VERSION: ${{ needs.prepare.outputs.cargo_package_version }}
          PYTHON_PACKAGE_VERSION: ${{ needs.prepare.outputs.python_package_version }}
        run: |
          set -euo pipefail
          expected=(
            "pek-$BUILD_ID-linux-x86_64.tar.gz"
            "pek-$BUILD_ID-linux-aarch64.tar.gz"
            "pek-docs-$BUILD_ID.tar.gz"
            "opk_perception_sdk-$PYTHON_PACKAGE_VERSION-py3-none-any.whl"
            "perception-$CARGO_PACKAGE_VERSION.crate"
          )
          test -z "$(find "$ARTIFACTS_DIR" -type l -print -quit)"
          mapfile -d '' -t files < <(
            find "$ARTIFACTS_DIR" -mindepth 1 -maxdepth 1 -type f -print0 | sort -z
          )
          test "${#files[@]}" -eq "${#expected[@]}"
          for artifact in "${expected[@]}"; do
            test -f "$ARTIFACTS_DIR/$artifact"
          done

      - name: Set up locked uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.8.15'
          python-version: '3.14'

      - name: Create read-only publisher token
        id: publisher-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: Iv23li0DqDMHoMs0TXT9
          private-key: ${{ secrets.EDGEAI_EXPKITS_APP_PK }}
          owner: Arm-Debug
          repositories: publisher
          permission-contents: read

      - name: Checkout publisher
        uses: actions/checkout@v7
        with:
          repository: Arm-Debug/publisher
          ref: cd16aa5aa6771b32d62466c974f0f2526d000013 # pragma: allowlist secret
          token: ${{ steps.publisher-token.outputs.token }}
          path: publisher
          persist-credentials: false

      - name: Install locked publisher
        working-directory: publisher
        run: uv sync --frozen --no-dev

      - name: Publish to Artifactory
        id: publish
        working-directory: ${{ runner.temp }}
        env:
          ARTIFACTORY_HOST: https://artifactory.arm.com
          ARTIFACTORY_USER: ${{ secrets.PEK_ARTIFACTORY_USERNAME }}
          ARTIFACTORY_TOKEN: ${{ secrets.PEK_ARTIFACTORY_API_KEY }}
          ARTIFACTORY_ARTIFACTS_NAME: ai-expkits-internal.opk-ci
          # The publisher joins RELEASE_VERSION directly below DOWNLOAD_BASE.
          RELEASE_VERSION: ${{ needs.prepare.outputs.kind == 'prerelease' && format('prereleases/{0}', needs.prepare.outputs.version) || format('releases/{0}', needs.prepare.outputs.version) }}
          DOWNLOAD_BASE: https://artifactory.arm.com/artifactory/ai-expkits-internal.opk-ci
          SUBDIR_PATH: ''
          TIMEOUT_SECONDS: 300
          ARTIFACT_PATTERN: ${{ needs.prepare.outputs.kind == 'prerelease' && 'pek-release-artifacts/*' || 'pek-release-artifacts/*.tar.gz' }}
        run: >-
          "$GITHUB_WORKSPACE/publisher/.venv/bin/python"
          -m publisher.actions.publish_to_artifactory_action
          "$ARTIFACT_PATTERN"

      - name: Publish Perception Python package to Artifactory PyPI
        env:
          UV_PUBLISH_CHECK_URL: https://artifactory.arm.com/artifactory/api/pypi/edge-ai-tooling.pypi/simple
          UV_PUBLISH_URL: https://artifactory.arm.com/artifactory/api/pypi/edge-ai-tooling.pypi
          UV_PUBLISH_USERNAME: ${{ secrets.PEK_ARTIFACTORY_USERNAME }}
          UV_PUBLISH_PASSWORD: ${{ secrets.PEK_ARTIFACTORY_API_KEY }}
        run: >-
          uv publish
          "${{ runner.temp }}"/pek-release-artifacts/opk_perception_sdk-*-py3-none-any.whl

      # This step is only here to make the created package easier to access
      - name: Print links and hashes
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/pek-release-artifacts
          KIND: ${{ needs.prepare.outputs.kind }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE_REFERENCE: ${{ needs.release-image.outputs.reference }}
          IMAGE_DIGEST: ${{ needs.release-image.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "$KIND" == prerelease ]]; then
            folder="prereleases/$VERSION"
            title="PEK Artifactory prerelease"
            artifacts=("$ARTIFACTS_DIR"/*)
          else
            folder="releases/$VERSION"
            title="PEK Artifactory release"
            artifacts=("$ARTIFACTS_DIR"/*.tar.gz)
          fi
          base="https://artifactory.arm.com/artifactory/ai-expkits-internal.opk-ci/$folder"
          echo "Artifactory folder: $folder"
          {
            echo "### $title"
            echo
            echo "Folder: \`$folder\`"
            echo
            echo "Container image: \`$IMAGE_REFERENCE@$IMAGE_DIGEST\`"
            echo
            for artifact in "${artifacts[@]}"; do
              name="$(basename "$artifact")"
              hash="$(sha256sum "$artifact" | cut -d' ' -f1)"
              url="$base/$name"
              echo "$url"
              # shellcheck disable=SC2016
              printf -- '- [%s](%s) — `%s`\n' "$name" "$url" "$hash"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

  perception-cargo-publish:
    name: Publish and verify Perception crate
    needs: [prepare, artifactory]
    if: >-
      ${{ needs.prepare.result == 'success' &&
          needs.artifactory.result == 'success' }}
    runs-on: amp-dev-forge-runner-ubuntu-x64
    timeout-minutes: 10
    env:
      NO_PROXY: artifactory.eu02.arm.com,artifactory.arm.com
    steps:
      - name: Download Perception SDK input
        uses: actions/download-artifact@v8
        with:
          name: pek-perception-sdk-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pek-perception-sdk-input

      - name: Set up pinned Rust for Perception publication
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.85.0
          cache: false

      - name: Publish and verify Perception crate
        env:
          CARGO_HOME: ${{ runner.temp }}/perception-cargo-home
          CARGO_PACKAGE_VERSION: ${{ needs.prepare.outputs.cargo_package_version }}
          RUSTUP_TOOLCHAIN: 1.85.0
          SDK_DIR: ${{ runner.temp }}/pek-perception-sdk-input
        run: |
          set -euo pipefail
          export no_proxy="$NO_PROXY"
          crate="$SDK_DIR/perception-$CARGO_PACKAGE_VERSION.crate"
          publish_source="$SDK_DIR/perception-cargo-source-${{ needs.prepare.outputs.version }}"
          registry="https://artifactory.eu02.arm.com/artifactory/api/cargo/edge-ai-tooling.cargo"
          url="https://artifactory.eu02.arm.com/artifactory/edge-ai-tooling.cargo/crates/perception/perception-$CARGO_PACKAGE_VERSION.crate"
          storage_url="https://artifactory.eu02.arm.com/artifactory/api/storage/edge-ai-tooling.cargo/crates/perception/perception-$CARGO_PACKAGE_VERSION.crate"
          index_url="$registry/index/pe/rc/perception"
          curl_direct=(curl --noproxy "$NO_PROXY" --connect-timeout 10 --max-time 30)

          rm -rf -- "$CARGO_HOME"
          mkdir -p "$CARGO_HOME"
          cat > "$CARGO_HOME/config.toml" <<'EOF'
          [registries.artifactory]
          index = "sparse+https://artifactory.eu02.arm.com/artifactory/api/cargo/edge-ai-tooling.cargo/index/"
          credential-provider = "cargo:token"

          [registries.crates-io]
          index = "sparse+https://index.crates.io/"
          EOF
          anonymous_token="$(printf 'anonymous:' | base64 -w0)"
          export CARGO_REGISTRIES_ARTIFACTORY_TOKEN="Basic $anonymous_token"
          (cd "$publish_source" && cargo package --locked --no-verify)
          cmp "$crate" "$publish_source/target/package/perception-$CARGO_PACKAGE_VERSION.crate"
          (cd "$publish_source" && cargo publish --locked --no-verify --registry artifactory)

          published="$RUNNER_TEMP/perception-$CARGO_PACKAGE_VERSION.published.crate"
          for attempt in {1..12}; do
            if "${curl_direct[@]}" --fail-with-body --silent --show-error \
              --output "$published" "$url" && \
              "${curl_direct[@]}" --fail --silent --show-error "$storage_url" | \
                jq --exit-status \
                  '.createdBy == "anonymous" and .modifiedBy == "anonymous"' \
                  > /dev/null; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "Published Perception crate or ownership did not become visible." >&2
              exit 1
            fi
            sleep 5
          done
          cmp "$crate" "$published"

          checksum="$(sha256sum "$published" | cut -d' ' -f1)"
          for attempt in {1..12}; do
            if "${curl_direct[@]}" --fail --silent --show-error "$index_url" | \
              jq --exit-status --slurp \
                --arg version "$CARGO_PACKAGE_VERSION" --arg checksum "$checksum" \
                'any(.[]; .name == "perception" and .vers == $version and .cksum == $checksum and .yanked == false)' \
                > /dev/null; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "Cargo index did not expose the expected Perception crate." >&2
              exit 1
            fi
            sleep 5
          done
          printf "### Perception Cargo\n\n- URL: %s\n- SHA-256: \`%s\`\n- Sparse index: %s\n" \
            "$url" "$checksum" "$index_url" >> "$GITHUB_STEP_SUMMARY"

  publication-complete:
    name: Record completed publication
    needs: [prepare, release-image, github-release, artifactory, perception-cargo-publish]
    if: >-
      ${{ always() &&
          needs.prepare.result == 'success' &&
          needs.release-image.result == 'success' &&
          needs.artifactory.result == 'success' &&
          needs.github-release.result == 'success' &&
          needs.perception-cargo-publish.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download published build outputs
        uses: actions/download-artifact@v8
        with:
          pattern: pek-release-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-input
          merge-multiple: true

      - name: Download Perception language packages
        uses: actions/download-artifact@v8
        with:
          name: pek-perception-sdk-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/perception-input

      - name: Create publication receipt
        env:
          ARM_ARCHIVE: ${{ needs.prepare.outputs.arm_archive }}
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          DOCS_ARCHIVE: ${{ needs.prepare.outputs.docs_archive }}
          EVENT_NAME: ${{ github.event_name }}
          IMAGE_DIGEST: ${{ needs.release-image.outputs.digest }}
          IMAGE_REFERENCE: ${{ needs.release-image.outputs.reference }}
          KIND: ${{ needs.prepare.outputs.kind }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CARGO_PACKAGE_VERSION: ${{ needs.prepare.outputs.cargo_package_version }}
          PYTHON_PACKAGE_VERSION: ${{ needs.prepare.outputs.python_package_version }}
          X86_ARCHIVE: ${{ needs.prepare.outputs.x86_archive }}
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/publication-input"
          receipt="$RUNNER_TEMP/publication-receipt"
          wheel="opk_perception_sdk-$PYTHON_PACKAGE_VERSION-py3-none-any.whl"
          crate="perception-$CARGO_PACKAGE_VERSION.crate"
          cp "$RUNNER_TEMP/perception-input/$wheel" "$input/"
          cp "$RUNNER_TEMP/perception-input/$crate" "$input/"
          expected=("$X86_ARCHIVE" "$ARM_ARCHIVE" "$DOCS_ARCHIVE" "$wheel" "$crate")
          for artifact in "${expected[@]}"; do
            test -f "$input/$artifact"
          done

          if [[ "$KIND" == prerelease ]]; then
            folder="prereleases/$VERSION"
            blackduck_version="prerelease-$VERSION"
            sonar_branch="release-prereleases/$VERSION"
          else
            folder="releases/$VERSION"
            blackduck_version="v$VERSION"
            sonar_branch="tags/v$VERSION"
          fi

          mkdir -p "$receipt"
          (
            cd "$input"
            sha256sum "${expected[@]}" > "$receipt/SHA256SUMS"
          )
          jq -n \
            --arg arm_archive "$ARM_ARCHIVE" \
            --arg blackduck_version "$blackduck_version" \
            --arg build_id "$BUILD_ID" \
            --arg commit "$COMMIT" \
            --arg crate "$crate" \
            --arg docs_archive "$DOCS_ARCHIVE" \
            --arg event "$EVENT_NAME" \
            --arg folder "$folder" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg image_reference "$IMAGE_REFERENCE" \
            --arg kind "$KIND" \
            --arg cargo_package_version "$CARGO_PACKAGE_VERSION" \
            --arg python_package_version "$PYTHON_PACKAGE_VERSION" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg sonar_branch "$sonar_branch" \
            --arg version "$VERSION" \
            --arg wheel "$wheel" \
            --arg x86_archive "$X86_ARCHIVE" \
            '{schema: 1, source_run_id: $run_id, source_run_attempt: $run_attempt,
              source_event: $event, kind: $kind, commit: $commit, version: $version,
              cargo_package_version: $cargo_package_version,
              python_package_version: $python_package_version,
              build_id: $build_id, artifactory_folder: $folder,
              image_reference: $image_reference, image_digest: $image_digest,
              sonar_branch: $sonar_branch, blackduck_version: $blackduck_version,
              artifacts: {x86_archive: $x86_archive, arm_archive: $arm_archive,
                docs_archive: $docs_archive, wheel: $wheel, crate: $crate}}' \
            > "$receipt/publication.json"

      - name: Upload publication receipt
        uses: actions/upload-artifact@v7
        with:
          name: pek-release-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-receipt/
          if-no-files-found: error
          retention-days: 30

      - name: Remove generated prerelease source branch
        if: needs.prepare.outputs.kind == 'prerelease'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ needs.prepare.outputs.source_branch }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$SOURCE_BRANCH"
