name: PEK release packages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit, tag, or branch to package
        required: true
        type: string
      build_label:
        description: Lower-case Artifactory snapshot folder label
        required: true
        type: string

permissions:
  contents: read

env:
  CCACHE_SCHEMA_VERSION: v2

jobs:
  prepare:
    name: Resolve release source
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      flowdata_commit: ${{ steps.release.outputs.flowdata_commit }}
      build_id: ${{ steps.release.outputs.build_id }}
      image_tag: ${{ steps.image.outputs.tag }}
      x86_archive: ${{ steps.release.outputs.x86_archive }}
      arm_archive: ${{ steps.release.outputs.arm_archive }}
      docs_archive: ${{ steps.release.outputs.docs_archive }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout selected source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.event.inputs.source_ref || github.sha }}
          path: source

      - name: Prepare release identity
        id: release
        env:
          BUILD_LABEL: ${{ github.event.inputs.build_label }}
        run: |
          set -euo pipefail
          commit="$(git -C source rev-parse HEAD)"
          python3 scripts/release/ReleaseTool.py prepare \
            --repo-root source \
            --commit "$commit" \
            --build-label "${BUILD_LABEL:-}"
          echo "flowdata_commit=$(git -C source rev-parse HEAD:tools/flowdata-sdk)" \
            >> "$GITHUB_OUTPUT"

      - name: Resolve image tag
        id: image
        env:
          BUILD_ID: ${{ steps.release.outputs.build_id }}
        run: |
          tag="$BUILD_ID"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$tag-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.architecture }} package
    needs: prepare
    strategy:
      matrix:
        include:
          - architecture: x86_64
            artifact_label: x86
            cache_tag: amd64
            platform: linux/amd64
            runner: self-hosted-ubuntu-latest-x64
          - architecture: aarch64
            artifact_label: arm
            cache_tag: arm64
            platform: linux/arm64
            runner: self-hosted-ubuntu-latest-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_IMAGE: ghcr.io/arm-debug/amp-dev-forge-deployment
      SOURCE_DIR: source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.artifact_label }}
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          path: ${{ env.SOURCE_DIR }}
          persist-credentials: false

      - name: Set up Docker builder
        id: builder
        uses: docker/setup-buildx-action@v4

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache@v6
        with:
          path: .cache/ccache-release
          key: pek-ccache-${{ env.CCACHE_SCHEMA_VERSION }}-${{ runner.os }}-${{ runner.arch }}-release-${{ needs.prepare.outputs.commit }}
          restore-keys: |
            pek-ccache-${{ env.CCACHE_SCHEMA_VERSION }}-${{ runner.os }}-${{ runner.arch }}-release-
            pek-ccache-${{ env.CCACHE_SCHEMA_VERSION }}-${{ runner.os }}-${{ runner.arch }}-deployment-

      - name: Attach compiler cache to Docker builder
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.builder.outputs.name }}
          cache-map: |
            {
              ".cache/ccache-release": {
                "target": "/work/.cache/ccache",
                "id": "pek-deployment-ccache",
                "sharing": "locked"
              }
            }
          skip-extraction: ${{ steps.compiler-cache.outputs.cache-hit }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build release snapshot image
        id: build
        uses: docker/build-push-action@v7
        with:
          build-args: |
            HF_DOWNLOAD_CACHEBUST=github-${{ github.run_id }}-${{ github.run_attempt }}
            PEK_RELEASE_BUILD=true
            PEK_RELEASE_BUILD_ID=${{ needs.prepare.outputs.build_id }}
            PEK_RELEASE_SOURCE_COMMIT=${{ needs.prepare.outputs.commit }}
            PEK_FLOWDATA_SDK_COMMIT=${{ needs.prepare.outputs.flowdata_commit }}
          cache-from: type=registry,ref=${{ env.RELEASE_IMAGE }}:buildcache-${{ matrix.cache_tag }}
          context: ${{ env.SOURCE_DIR }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.image_tag }}
          outputs: type=image,name=${{ env.RELEASE_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          platforms: ${{ matrix.platform }}
          provenance: false
          pull: true
          secrets: |
            "huggingface_token=${{ secrets.HF_TOKEN }}"
            "executorch_artifactory_username=${{ secrets.PEK_ARTIFACTORY_USERNAME }}"
            "executorch_artifactory_password=${{ secrets.PEK_ARTIFACTORY_API_KEY }}"
          target: pek-deployment-base

      - name: Extract package from release snapshot
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          ARCHIVE: ${{ matrix.architecture == 'x86_64' && needs.prepare.outputs.x86_archive || needs.prepare.outputs.arm_archive }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p dist
          docker pull "$RELEASE_IMAGE@$IMAGE_DIGEST"
          container_id="$(docker create "$RELEASE_IMAGE@$IMAGE_DIGEST")"
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          docker cp \
            "$container_id:/opt/pek-release-artifacts/$ARCHIVE" "dist/$ARCHIVE"
          if [[ "${{ matrix.architecture }}" == aarch64 ]]; then
            mkdir -p dist/perception-sdk-input
            package="${ARCHIVE%.tar.gz}"
            tar -C dist/perception-sdk-input --strip-components=4 -xzf "dist/$ARCHIVE" \
              "$package/share/pek/perception-sdk"
          fi

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: pek-release-${{ matrix.artifact_label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SOURCE_DIR }}/dist/${{ matrix.architecture == 'x86_64' && needs.prepare.outputs.x86_archive || needs.prepare.outputs.arm_archive }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload Perception SDK input
        if: matrix.architecture == 'aarch64'
        uses: actions/upload-artifact@v7
        with:
          name: pek-perception-sdk-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SOURCE_DIR }}/dist/perception-sdk-input/perception-sdk-*
          if-no-files-found: error
          retention-days: 7

      - name: Record image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/image-digest-${{ matrix.artifact_label }}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: pek-image-digest-${{ matrix.artifact_label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-digest-${{ matrix.artifact_label }}
          if-no-files-found: error
          retention-days: 7

      - name: Clean isolated build workspace
        if: always()
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker image rm "$RELEASE_IMAGE@$IMAGE_DIGEST" 2>/dev/null || true
          rm -rf -- "$SOURCE_DIR"

  release-image:
    name: Publish multi-architecture snapshot image
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      reference: ${{ steps.publish.outputs.reference }}
    env:
      RELEASE_IMAGE: ghcr.io/arm-debug/amp-dev-forge-deployment
    steps:
      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          pattern: pek-image-digest-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: digests
          merge-multiple: true

      - name: Publish image index
        id: publish
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          set -euo pipefail
          X86_DIGEST="$(<digests/image-digest-x86)"
          ARM_DIGEST="$(<digests/image-digest-arm)"
          reference="$RELEASE_IMAGE:$IMAGE_TAG"
          if docker buildx imagetools inspect "$reference" >/dev/null 2>&1; then
            echo "Image $reference already exists." >&2
            exit 1
          fi
          docker buildx imagetools create \
            --tag "$reference" \
            --metadata-file image-metadata.json \
            "$RELEASE_IMAGE@$X86_DIGEST" \
            "$RELEASE_IMAGE@$ARM_DIGEST"
          digest="$(jq -er '."containerimage.descriptor".digest' image-metadata.json)"
          docker buildx imagetools inspect "$reference"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016
          printf '### PEK deployment image\n\n- `%s@%s`\n' \
            "$reference" "$digest" >> "$GITHUB_STEP_SUMMARY"

  build-docs:
    name: Build documentation package
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      DOCS_IMAGE: pek-docs:${{ needs.prepare.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Build existing documentation image
        run: docker build --pull --target pek-docs --tag "$DOCS_IMAGE" .

      - name: Generate and package documentation
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env BUILD_ID \
            --env HOME=/tmp \
            --volume "$PWD:/work" \
            --workdir /work \
            "$DOCS_IMAGE" \
            bash -euxc '
              scripts/gen-doc.sh
              package="pek-docs-$BUILD_ID"
              stage="$(mktemp -d)/$package"
              test -f docs/html/index.html
              test -f development/build/doc/doxygen/html/index.html
              mkdir -p "$stage/html" "$stage/doxygen" dist
              cp -a docs/html/. "$stage/html/"
              cp -a development/build/doc/doxygen/html/. "$stage/doxygen/"
              tar -C "$(dirname "$stage")" -czf "dist/$package.tar.gz" "$package"
              sha256sum "dist/$package.tar.gz"
            '

      - name: Upload documentation package
        uses: actions/upload-artifact@v7
        with:
          name: pek-release-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/${{ needs.prepare.outputs.docs_archive }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove documentation image
        if: always()
        run: docker image rm "$DOCS_IMAGE" 2>/dev/null || true

  github-release:
    name: Publish one GitHub release
    if: github.event_name == 'push'
    needs: [prepare, build, build-docs, release-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout released source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: pek-release-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
          merge-multiple: true

      - name: Publish release after all uploads succeed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          IMAGE_REFERENCE: ${{ needs.release-image.outputs.reference }}
          IMAGE_DIGEST: ${{ needs.release-image.outputs.digest }}
        run: |
          set -euo pipefail
          mapfile -t archives < <(find release -maxdepth 1 -type f -name "*.tar.gz" | sort)
          test "${#archives[@]}" -eq 3
          hashes="$(sha256sum "${archives[@]}")"
          sed -n "/^## \\[$VERSION\\]/,/^## \\[/p" CHANGELOG.md |
            sed "\$d" > release-body.md
          {
            # shellcheck disable=SC2016
            printf '\nSource commit: `%s`\n\n### Archives\n\n' "$COMMIT"
            while read -r hash file; do
              # shellcheck disable=SC2016
              printf -- '- `%s` — `%s`\n' "$(basename "$file")" "$hash"
            done <<< "$hashes"
          } >> release-body.md
          # shellcheck disable=SC2016
          printf '\n### Container image\n\n`%s@%s`\n' \
            "$IMAGE_REFERENCE" "$IMAGE_DIGEST" >> release-body.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists." >&2
            exit 1
          fi
          gh release create "v$VERSION" --draft --target "$COMMIT" \
            --title "PEK $VERSION" --notes-file release-body.md
          gh release upload "v$VERSION" "${archives[@]}"
          gh release edit "v$VERSION" --draft=false

  artifactory:
    name: Publish one Artifactory release
    needs: [prepare, build, build-docs, release-image, github-release]
    if: >-
      ${{ always() &&
          needs.prepare.result == 'success' &&
          needs.build.result == 'success' &&
          needs.build-docs.result == 'success' &&
          needs.release-image.result == 'success' &&
          (github.event_name == 'workflow_dispatch' ||
           needs.github-release.result == 'success') }}
    runs-on: self-hosted-ubuntu-latest-x64
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: pek-release-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pek-release-artifacts
          merge-multiple: true

      - name: Download Perception SDK input
        uses: actions/download-artifact@v8
        with:
          name: pek-perception-sdk-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pek-perception-sdk-input

      - name: Export Perception Python wheel
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/pek-release-artifacts
          SDK_DIR: ${{ runner.temp }}/pek-perception-sdk-input
        run: |
          set -euo pipefail
          sdk=("$SDK_DIR"/perception-sdk-*.zip)
          test "${#sdk[@]}" -eq 1
          test -f "${sdk[0]}"
          mkdir -p "$RUNNER_TEMP/perception-sdk-export"
          python3 -m zipfile -e "${sdk[0]}" "$RUNNER_TEMP/perception-sdk-export"
          wheel=("$RUNNER_TEMP"/perception-sdk-export/perception-sdk-*/python/opk_perception_sdk-*-py3-none-any.whl)
          test "${#wheel[@]}" -eq 1
          test -f "${wheel[0]}"
          cp "${wheel[0]}" "$ARTIFACTS_DIR/"

      - name: Accept exactly three archives and one wheel
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/pek-release-artifacts
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
        run: |
          set -euo pipefail
          expected=(
            "pek-$BUILD_ID-linux-x86_64.tar.gz"
            "pek-$BUILD_ID-linux-aarch64.tar.gz"
            "pek-docs-$BUILD_ID.tar.gz"
          )
          test -z "$(find "$ARTIFACTS_DIR" -type l -print -quit)"
          mapfile -d '' -t files < <(
            find "$ARTIFACTS_DIR" -mindepth 1 -maxdepth 1 -type f -print0 | sort -z
          )
          test "${#files[@]}" -eq 4
          for archive in "${expected[@]}"; do
            test -f "$ARTIFACTS_DIR/$archive"
          done
          wheel=("$ARTIFACTS_DIR"/opk_perception_sdk-*-py3-none-any.whl)
          test "${#wheel[@]}" -eq 1
          test -f "${wheel[0]}"

      - name: Set up locked uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.8.13'
          python-version: '3.14'

      - name: Create read-only publisher token
        id: publisher-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: Iv23li0DqDMHoMs0TXT9
          private-key: ${{ secrets.EDGEAI_EXPKITS_APP_PK }}
          owner: Arm-Debug
          repositories: publisher
          permission-contents: read

      - name: Checkout publisher
        uses: actions/checkout@v7
        with:
          repository: Arm-Debug/publisher
          ref: cd16aa5aa6771b32d62466c974f0f2526d000013 # pragma: allowlist secret
          token: ${{ steps.publisher-token.outputs.token }}
          path: publisher
          persist-credentials: false

      - name: Install locked publisher
        working-directory: publisher
        run: uv sync --frozen --no-dev

      - name: Publish to Artifactory
        id: publish
        working-directory: ${{ runner.temp }}
        env:
          ARTIFACTORY_HOST: https://artifactory.arm.com
          ARTIFACTORY_USER: ${{ secrets.PEK_ARTIFACTORY_USERNAME }}
          ARTIFACTORY_TOKEN: ${{ secrets.PEK_ARTIFACTORY_API_KEY }}
          ARTIFACTORY_ARTIFACTS_NAME: ai-expkits-internal.opk-ci
          # The publisher joins RELEASE_VERSION directly below DOWNLOAD_BASE.
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && 'snapshots' || format('releases/{0}', needs.prepare.outputs.version) }}
          DOWNLOAD_BASE: https://artifactory.arm.com/artifactory/ai-expkits-internal.opk-ci
          SUBDIR_PATH: ${{ github.event_name == 'workflow_dispatch' && format('{0}/{1}-{2}-{3}', github.event.inputs.build_label, needs.prepare.outputs.commit, github.run_id, github.run_attempt) || '' }}
          TIMEOUT_SECONDS: 300
        run: >-
          "$GITHUB_WORKSPACE/publisher/.venv/bin/python"
          -m publisher.actions.publish_to_artifactory_action
          "pek-release-artifacts/*"

      - name: Publish Perception Python package to Artifactory PyPI
        if: github.event_name == 'push'
        env:
          TWINE_REPOSITORY_URL: ${{ vars.ARTIFACTORY_PYPI_URL }}
          TWINE_USERNAME: ${{ secrets.PEK_ARTIFACTORY_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PEK_ARTIFACTORY_API_KEY }}
        run: >-
          uvx --from 'twine==6.2.0' twine upload
          "${{ runner.temp }}"/pek-release-artifacts/opk_perception_sdk-*-py3-none-any.whl

      # This step is only here to make the created package easier to access
      - name: Print links and hashes
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/pek-release-artifacts
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          LABEL: ${{ github.event.inputs.build_label }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          IMAGE_REFERENCE: ${{ needs.release-image.outputs.reference }}
          IMAGE_DIGEST: ${{ needs.release-image.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            folder="snapshots/$LABEL/$COMMIT-${{ github.run_id }}-${{ github.run_attempt }}"
            title="PEK Artifactory snapshot"
          else
            folder="releases/$VERSION"
            title="PEK Artifactory release"
          fi
          base="https://artifactory.arm.com/artifactory/ai-expkits-internal.opk-ci/$folder"
          echo "Artifactory folder: $folder"
          {
            echo "### $title"
            echo
            echo "Folder: \`$folder\`"
            echo
            echo "Container image: \`$IMAGE_REFERENCE@$IMAGE_DIGEST\`"
            echo
            for artifact in "$ARTIFACTS_DIR"/*; do
              name="$(basename "$artifact")"
              hash="$(sha256sum "$artifact" | cut -d' ' -f1)"
              url="$base/$name"
              echo "$url"
              # shellcheck disable=SC2016
              printf -- '- [%s](%s) — `%s`\n' "$name" "$url" "$hash"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
