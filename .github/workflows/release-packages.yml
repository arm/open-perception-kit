name: PEK release packages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit, tag, or branch to package
        required: true
        type: string
      build_label:
        description: Lower-case Artifactory snapshot folder label
        required: true
        type: string

permissions:
  contents: read

env:
  CCACHE_SCHEMA_VERSION: v2

jobs:
  prepare:
    name: Resolve release source
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      flowdata_commit: ${{ steps.release.outputs.flowdata_commit }}
      build_id: ${{ steps.release.outputs.build_id }}
      image_tag: ${{ steps.image.outputs.tag }}
      x86_archive: ${{ steps.release.outputs.x86_archive }}
      arm_archive: ${{ steps.release.outputs.arm_archive }}
      docs_archive: ${{ steps.release.outputs.docs_archive }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout selected source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.event.inputs.source_ref || github.sha }}
          path: source

      - name: Prepare release identity
        id: release
        env:
          BUILD_LABEL: ${{ github.event.inputs.build_label }}
        run: |
          set -euo pipefail
          commit="$(git -C source rev-parse HEAD)"
          python3 scripts/release/ReleaseTool.py prepare \
            --repo-root source \
            --commit "$commit" \
            --build-label "${BUILD_LABEL:-}"
          echo "flowdata_commit=$(git -C source rev-parse HEAD:tools/flowdata-sdk)" \
            >> "$GITHUB_OUTPUT"

      - name: Resolve image tag
        id: image
        env:
          BUILD_ID: ${{ steps.release.outputs.build_id }}
        run: |
          tag="$BUILD_ID"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$tag-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.architecture }} package
    needs: prepare
    strategy:
      matrix:
        include:
          - architecture: x86_64
            artifact_label: x86
            cache_tag: amd64
            platform: linux/amd64
            runner: self-hosted-ubuntu-latest-x64
          - architecture: aarch64
            artifact_label: arm
            cache_tag: arm64
            platform: linux/arm64
            runner: self-hosted-ubuntu-latest-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_IMAGE: ghcr.io/arm-debug/amp-dev-forge-deployment
      SOURCE_DIR: source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.artifact_label }}
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          path: ${{ env.SOURCE_DIR }}
          persist-credentials: false

      - name: Set up Docker builder
        id: builder
        uses: docker/setup-buildx-action@v4

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache@v6
        with:
          path: .cache/ccache-release
          key: pek-ccache-${{ env.CCACHE_SCHEMA_VERSION }}-${{ runner.os }}-${{ runner.arch }}-release-${{ needs.prepare.outputs.commit }}
          restore-keys: |
            pek-ccache-${{ env.CCACHE_SCHEMA_VERSION }}-${{ runner.os }}-${{ runner.arch }}-release-
            pek-ccache-${{ env.CCACHE_SCHEMA_VERSION }}-${{ runner.os }}-${{ runner.arch }}-deployment-

      - name: Attach compiler cache to Docker builder
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.builder.outputs.name }}
          cache-map: |
            {
              ".cache/ccache-release": {
                "target": "/work/.cache/ccache",
                "id": "pek-deployment-ccache",
                "sharing": "locked"
              }
            }
          skip-extraction: ${{ steps.compiler-cache.outputs.cache-hit }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build release snapshot image
        id: build
        uses: docker/build-push-action@v7
        with:
          build-args: |
            HF_DOWNLOAD_CACHEBUST=github-${{ github.run_id }}-${{ github.run_attempt }}
            PEK_RELEASE_BUILD=true
            PEK_RELEASE_BUILD_ID=${{ needs.prepare.outputs.build_id }}
            PEK_RELEASE_SOURCE_COMMIT=${{ needs.prepare.outputs.commit }}
            PEK_FLOWDATA_SDK_COMMIT=${{ needs.prepare.outputs.flowdata_commit }}
          cache-from: type=registry,ref=${{ env.RELEASE_IMAGE }}:buildcache-${{ matrix.cache_tag }}
          context: ${{ env.SOURCE_DIR }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.image_tag }}
          outputs: type=image,name=${{ env.RELEASE_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          platforms: ${{ matrix.platform }}
          provenance: false
          pull: true
          secrets: |
            "huggingface_token=${{ secrets.HF_TOKEN }}"
            "executorch_artifactory_username=${{ secrets.PEK_ARTIFACTORY_USERNAME }}"
            "executorch_artifactory_password=${{ secrets.PEK_ARTIFACTORY_API_KEY }}"
          target: pek-deployment-base

      - name: Extract package from release snapshot
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          ARCHIVE: ${{ matrix.architecture == 'x86_64' && needs.prepare.outputs.x86_archive || needs.prepare.outputs.arm_archive }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p dist
          docker pull "$RELEASE_IMAGE@$IMAGE_DIGEST"
          container_id="$(docker create "$RELEASE_IMAGE@$IMAGE_DIGEST")"
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          docker cp \
            "$container_id:/opt/pek-release-artifacts/$ARCHIVE" "dist/$ARCHIVE"
          if [[ "${{ matrix.architecture }}" == aarch64 ]]; then
            mkdir -p dist/perception-sdk-input
            package="${ARCHIVE%.tar.gz}"
            tar -C dist/perception-sdk-input --strip-components=4 -xzf "dist/$ARCHIVE" \
              "$package/share/pek/perception-sdk"
          fi

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: pek-release-${{ matrix.artifact_label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SOURCE_DIR }}/dist/${{ matrix.architecture == 'x86_64' && needs.prepare.outputs.x86_archive || needs.prepare.outputs.arm_archive }}
          if-no-files-found: error
          retention-days: 7

      - name: Set up pinned Rust for Perception packaging
        if: matrix.architecture == 'aarch64'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.85.0

      - name: Package Perception Rust crate
        if: matrix.architecture == 'aarch64'
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          sdk="$PWD/dist/perception-sdk-input/perception-sdk-$VERSION.zip"
          export_dir="$RUNNER_TEMP/perception-sdk-export"
          export_root="$export_dir/perception-sdk-$VERSION"
          rm -rf -- "$export_dir"
          mkdir -p "$export_dir"
          python3 -m zipfile -e "$sdk" "$export_dir"
          rust="$export_root/rust"
          # Alternate-registry dependencies default to that registry unless named explicitly.
          python3 - "$rust/Cargo.toml" "$rust/.cargo/config.toml" <<'PY'
          import re
          import sys
          from pathlib import Path

          manifest_path = Path(sys.argv[1])
          manifest = manifest_path.read_text(encoding="utf-8")
          manifest, replacements = re.subn(
              r'(?m)^flatbuffers = "(=[^"]+)"$',
              r'flatbuffers = { version = "\1", registry = "crates-io" }',
              manifest,
          )
          if replacements != 1:
              raise SystemExit("expected one pinned FlatBuffers dependency")
          manifest_path.write_text(manifest, encoding="utf-8")

          config_path = Path(sys.argv[2])
          config = config_path.read_text(encoding="utf-8")
          if "[registries.crates-io]" in config:
              raise SystemExit("crates.io registry alias already exists")
          config_path.write_text(
              config
              + '\n[registries.crates-io]\n'
              + 'index = "sparse+https://index.crates.io/"\n',
              encoding="utf-8",
          )
          PY
          # Dependency archives seed vendor/ but are not part of the published crate.
          rm -rf -- "$rust/crates"
          (
            cd "$rust"
            cargo package --offline --locked
          )
          crate="$rust/target/package/perception-$VERSION.crate"
          python3 - "$crate" "$VERSION" <<'PY'
          import sys
          import tarfile
          from pathlib import PurePosixPath

          crate, version = sys.argv[1:]
          root = f"perception-{version}"
          with tarfile.open(crate, "r:gz") as archive:
              members = archive.getmembers()
              forbidden = {".cargo", "crates", "vendor"}
              for member in members:
                  relative = PurePosixPath(member.name).relative_to(root)
                  if relative.parts and relative.parts[0] in forbidden:
                      raise SystemExit(f"published crate contains {relative.parts[0]}")
              manifest = archive.extractfile(f"{root}/Cargo.toml")
              if manifest is None:
                  raise SystemExit("published crate has no Cargo.toml")
              cargo_toml = manifest.read().decode("utf-8")
          if 'registry-index = "sparse+https://index.crates.io/"' not in cargo_toml:
              raise SystemExit("published FlatBuffers dependency is not pinned to crates.io")
          PY
          cp "$export_root/python/opk_perception_sdk-$VERSION-py3-none-any.whl" \
            dist/perception-sdk-input/
          cp "$crate" dist/perception-sdk-input/

      - name: Upload Perception SDK input
        if: matrix.architecture == 'aarch64'
        uses: actions/upload-artifact@v7
        with:
          name: pek-perception-sdk-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SOURCE_DIR }}/dist/perception-sdk-input/
          if-no-files-found: error
          retention-days: 7

      - name: Record image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/image-digest-${{ matrix.artifact_label }}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: pek-image-digest-${{ matrix.artifact_label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-digest-${{ matrix.artifact_label }}
          if-no-files-found: error
          retention-days: 7

      - name: Clean isolated build workspace
        if: always()
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker image rm "$RELEASE_IMAGE@$IMAGE_DIGEST" 2>/dev/null || true
          rm -rf -- "$SOURCE_DIR"

  blackduck-detect:
    name: Detect wrapper
    uses: ./.github/workflows/blackduck-detect.yml

  blackduck-release-retention:
    name: Reserve Black Duck release slot
    needs: prepare
    runs-on: self-hosted-ubuntu-latest-x64
    permissions:
      contents: read
    concurrency:
      group: blackduck-release-retention
      cancel-in-progress: false
    steps:
      - name: Checkout cleanup helper
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Keep three Black Duck releases
        if: github.event_name == 'push'
        env:
          BLACKDUCK_TOKEN: ${{ secrets.BLACKDUCK_TOKEN }} # pragma: allowlist secret
          BLACKDUCK_URL: ${{ secrets.BLACKDUCK_URL }}
          VERSION_NAME: v${{ needs.prepare.outputs.version }}
        run: .github/scripts/blackduck_version_cleanup.sh rotate-release "$VERSION_NAME"

  blackduck-release-packages:
    name: Scan ${{ matrix.architecture }} release package
    needs: [prepare, build, blackduck-detect, blackduck-release-retention]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            artifact_label: x86
          - architecture: aarch64
            artifact_label: arm
    runs-on: self-hosted-ubuntu-latest-x64
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download release package
        uses: actions/download-artifact@v8
        with:
          name: pek-release-${{ matrix.artifact_label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/blackduck-release-${{ matrix.artifact_label }}/artifact

      - name: Download verified Detect wrapper
        uses: actions/download-artifact@v8
        with:
          name: detect-arm.sh
          path: ${{ runner.temp }}/blackduck-release-${{ matrix.artifact_label }}
          skip-decompress: true

      - name: Scan release package and enforce policy
        env:
          ARCHIVE: ${{ matrix.architecture == 'x86_64' && needs.prepare.outputs.x86_archive || needs.prepare.outputs.arm_archive }}
          BLACKDUCK_TOKEN: ${{ secrets.BLACKDUCK_TOKEN }}
          BLACKDUCK_URL: ${{ secrets.BLACKDUCK_URL }}
          BLACKDUCK_VERSION: ${{ github.event_name == 'push' && format('v{0}', needs.prepare.outputs.version) || needs.prepare.outputs.image_tag }}
        run: |
          set -euo pipefail
          test -n "${BLACKDUCK_TOKEN:-}"
          test -n "${BLACKDUCK_URL:-}"
          scanner_dir="${RUNNER_TEMP}/blackduck-release-${{ matrix.artifact_label }}"
          package_dir="$scanner_dir/package"
          install -d -m 0777 "$package_dir" "$scanner_dir/output"
          test -f "$scanner_dir/artifact/$ARCHIVE"
          tar -xzf "$scanner_dir/artifact/$ARCHIVE" -C "$package_dir"
          chmod +x "$scanner_dir/detect-arm.sh"

          project_name="${GITHUB_REPOSITORY//\//:}"
          version_name="${BLACKDUCK_VERSION//\//-}"
          "$scanner_dir/detect-arm.sh" \
            "--blackduck.url=${BLACKDUCK_URL}" \
            "--blackduck.api.token=${BLACKDUCK_TOKEN}" \
            "--detect.project.name=${project_name}" \
            "--detect.project.version.name=${version_name}" \
            "--detect.code.location.name=${project_name}/${version_name}/release-package-${{ matrix.architecture }}" \
            --detect.cleanup=false \
            --detect.output.path="$scanner_dir/output" \
            --detect.policy.check.fail.on.severities=ALL \
            --detect.source.path="$package_dir" \
            --detect.timeout=1800 \
            --detect.tools=SIGNATURE_SCAN \
            --logging.level.detect=INFO 2>&1 | tee "$scanner_dir/scan.log"

      - name: Report release package scan
        if: always()
        env:
          BLACKDUCK_URL: ${{ secrets.BLACKDUCK_URL }}
          BLACKDUCK_VERSION: ${{ github.event_name == 'push' && format('v{0}', needs.prepare.outputs.version) || needs.prepare.outputs.image_tag }}
        run: |
          scan_log="${RUNNER_TEMP}/blackduck-release-${{ matrix.artifact_label }}/scan.log"
          scan_link="$(grep -Eo 'https://[^[:space:]]+/api/(projects/[0-9a-f-]+/versions/[0-9a-f-]+/(components|source-trees)|developer-scans/[0-9a-f-]+)' "$scan_log" 2>/dev/null | tail -n 1 || true)"
          {
            echo '### Black Duck release package scan'
            echo
            echo "- Architecture: \`${{ matrix.architecture }}\`"
            echo "- Version: \`${BLACKDUCK_VERSION//\//-}\`"
            if [[ -n "$scan_link" ]]; then
              echo "- [Open scan]($scan_link)"
            else
              echo "- [Open Black Duck](${BLACKDUCK_URL})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release package scan details
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blackduck-release-package-${{ matrix.artifact_label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/blackduck-release-${{ matrix.artifact_label }}/output
            ${{ runner.temp }}/blackduck-release-${{ matrix.artifact_label }}/scan.log
          if-no-files-found: warn
          retention-days: 10

      - name: Cleanup release package scan
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/blackduck-release-${{ matrix.artifact_label }}"

  release-image:
    name: Publish multi-architecture snapshot image
    needs: [prepare, build, blackduck-release-packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      reference: ${{ steps.publish.outputs.reference }}
    env:
      RELEASE_IMAGE: ghcr.io/arm-debug/amp-dev-forge-deployment
    steps:
      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          pattern: pek-image-digest-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: digests
          merge-multiple: true

      - name: Publish image index
        id: publish
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          set -euo pipefail
          X86_DIGEST="$(<digests/image-digest-x86)"
          ARM_DIGEST="$(<digests/image-digest-arm)"
          reference="$RELEASE_IMAGE:$IMAGE_TAG"
          if docker buildx imagetools inspect "$reference" >/dev/null 2>&1; then
            echo "Image $reference already exists." >&2
            exit 1
          fi
          docker buildx imagetools create \
            --tag "$reference" \
            --metadata-file image-metadata.json \
            "$RELEASE_IMAGE@$X86_DIGEST" \
            "$RELEASE_IMAGE@$ARM_DIGEST"
          digest="$(jq -er '."containerimage.descriptor".digest' image-metadata.json)"
          docker buildx imagetools inspect "$reference"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016
          printf '### PEK deployment image\n\n- `%s@%s`\n' \
            "$reference" "$digest" >> "$GITHUB_STEP_SUMMARY"

  build-docs:
    name: Build documentation package
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      DOCS_IMAGE: pek-docs:${{ needs.prepare.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Build existing documentation image
        run: docker build --pull --target pek-docs --tag "$DOCS_IMAGE" .

      - name: Generate and package documentation
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env BUILD_ID \
            --env HOME=/tmp \
            --env PEK_PROJECT_ROOT="$PWD" \
            --volume "$PWD:$PWD" \
            --workdir "$PWD" \
            "$DOCS_IMAGE" \
            bash -euxc '
              scripts/gen-doc.sh
              package="pek-docs-$BUILD_ID"
              stage="$(mktemp -d)/$package"
              test -f docs/html/index.html
              test -f development/build/doc/doxygen/html/index.html
              mkdir -p "$stage/html" "$stage/doxygen" dist
              cp -a docs/html/. "$stage/html/"
              cp -a development/build/doc/doxygen/html/. "$stage/doxygen/"
              tar -C "$(dirname "$stage")" -czf "dist/$package.tar.gz" "$package"
              sha256sum "dist/$package.tar.gz"
            '

      - name: Upload documentation package
        uses: actions/upload-artifact@v7
        with:
          name: pek-release-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/${{ needs.prepare.outputs.docs_archive }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove documentation image
        if: always()
        run: docker image rm "$DOCS_IMAGE" 2>/dev/null || true

  release-docs-staging:
    name: Publish release docs to staging
    if: github.event_name == 'push'
    needs: prepare
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/docs-publish.yml
    with:
      publish_ref: ${{ needs.prepare.outputs.commit }}

  release-sonar:
    name: Run release Sonar analysis
    if: github.event_name == 'push'
    needs: prepare
    runs-on: self-hosted-ubuntu-latest-x64
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_COMPOSE_FILE: .github/compose.ci.yaml
      CI_IMAGE: ghcr.io/arm-debug/amp-dev-forge-ci
      CI_CHECKOUT_PATH: repo-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      CCACHE_PATH: ${{ github.workspace }}/.cache/ccache-sonar
      PEK_CI_IMAGE: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-pek-sonar-check-release
    steps:
      - name: Prepare workspace
        run: |
          echo "WORKSPACE_ROOT=${GITHUB_WORKSPACE}/${CI_CHECKOUT_PATH}" >> "$GITHUB_ENV"
          test -d "$CCACHE_PATH" || install -d -m 0777 "$CCACHE_PATH"

      - name: Checkout released source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.prepare.outputs.commit }}
          path: ${{ env.CI_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Prepare private submodules
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          DEPLOY_KEY_FLOWDATA_SDK: ${{ secrets.DEPLOY_KEY_FLOWDATA_SDK }}
        run: |
          source .github/scripts/configure_workspace_ssh.sh
          git submodule update --init --recursive

      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }} # pragma: allowlist secret

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build release Sonar image
        uses: docker/build-push-action@v7
        with:
          cache-from: type=registry,ref=${{ env.CI_IMAGE }}:buildcache-release-sonar-amd64
          cache-to: type=registry,ref=${{ env.CI_IMAGE }}:buildcache-release-sonar-amd64,mode=max
          context: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          outputs: type=docker
          provenance: false
          pull: true
          push: false
          tags: ${{ env.PEK_CI_IMAGE }}
          target: pek-ci

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_PATH }}
          key: pek-ccache-${{ env.CCACHE_SCHEMA_VERSION }}-${{ runner.os }}-${{ runner.arch }}-sonar-${{ needs.prepare.outputs.commit }}
          restore-keys: |
            pek-ccache-${{ env.CCACHE_SCHEMA_VERSION }}-${{ runner.os }}-${{ runner.arch }}-sonar-

      - name: Run SonarQube release analysis
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_BRANCH: tags/v${{ needs.prepare.outputs.version }}
          SONAR_PROJECT_VERSION: ${{ needs.prepare.outputs.version }}
          SONAR_QUALITYGATE_WAIT: "true"
          BUILD_STRING: ${{ needs.prepare.outputs.commit }}
        run: docker compose -f "$DOCKER_COMPOSE_FILE" run --rm pek-sonar-check-release

      - name: Save compiler cache
        if: ${{ success() && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_PATH }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Cleanup isolated workspace
        if: always()
        run: |
          workspace_root="${WORKSPACE_ROOT:-}"
          expected_workspace_prefix="${GITHUB_WORKSPACE:-}/repo-"

          case "$workspace_root" in
            "${expected_workspace_prefix}"*) ;;
            *)
              echo "Skipping cleanup for unexpected WORKSPACE_ROOT='$workspace_root'" >&2
              exit 0
              ;;
          esac

          if [ -d "$workspace_root" ]; then
            if [ -f "$workspace_root/$DOCKER_COMPOSE_FILE" ]; then
              (
                cd "$workspace_root"
                docker compose -f "$DOCKER_COMPOSE_FILE" down --remove-orphans --rmi local || true
              )
            fi
            sudo chown -R "$(id -u):$(id -g)" "$workspace_root" || true
            chmod -R u+rwX "$workspace_root" || true
            rm -rf "$workspace_root" || sudo rm -rf "$workspace_root" || true
          fi
          docker image rm "$PEK_CI_IMAGE" 2>/dev/null || true

  github-release:
    name: Publish one GitHub release
    if: github.event_name == 'push'
    needs: [prepare, build, build-docs, release-image]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout released source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: pek-release-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
          merge-multiple: true

      - name: Publish release after all uploads succeed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          IMAGE_REFERENCE: ${{ needs.release-image.outputs.reference }}
          IMAGE_DIGEST: ${{ needs.release-image.outputs.digest }}
        run: |
          set -euo pipefail
          mapfile -t archives < <(find release -maxdepth 1 -type f -name "*.tar.gz" | sort)
          test "${#archives[@]}" -eq 3
          hashes="$(sha256sum "${archives[@]}")"
          sed -n "/^## \\[$VERSION\\]/,/^## \\[/p" CHANGELOG.md |
            sed "\$d" > release-body.md
          {
            # shellcheck disable=SC2016
            printf '\nSource commit: `%s`\n\n### Archives\n\n' "$COMMIT"
            while read -r hash file; do
              # shellcheck disable=SC2016
              printf -- '- `%s` — `%s`\n' "$(basename "$file")" "$hash"
            done <<< "$hashes"
          } >> release-body.md
          # shellcheck disable=SC2016
          printf '\n### Container image\n\n`%s@%s`\n' \
            "$IMAGE_REFERENCE" "$IMAGE_DIGEST" >> release-body.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists." >&2
            exit 1
          fi
          gh release create "v$VERSION" --draft --target "$COMMIT" \
            --title "PEK $VERSION" --notes-file release-body.md
          gh release upload "v$VERSION" "${archives[@]}"
          gh release edit "v$VERSION" --draft=false

      - name: Queue full Black Duck release scan
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh workflow run pek-ci.yml --ref "v$VERSION" -f checks=blackduck

  artifactory:
    name: Publish one Artifactory release
    needs: [prepare, build, build-docs, release-image, github-release]
    if: >-
      ${{ always() &&
          needs.prepare.result == 'success' &&
          needs.build.result == 'success' &&
          needs.build-docs.result == 'success' &&
          needs.release-image.result == 'success' &&
          (github.event_name == 'workflow_dispatch' ||
           needs.github-release.result == 'success') }}
    runs-on: self-hosted-ubuntu-latest-x64
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: pek-release-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pek-release-artifacts
          merge-multiple: true

      - name: Download Perception SDK input
        uses: actions/download-artifact@v8
        with:
          name: pek-perception-sdk-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pek-perception-sdk-input

      - name: Stage Perception language packages
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/pek-release-artifacts
          SDK_DIR: ${{ runner.temp }}/pek-perception-sdk-input
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cp "$SDK_DIR/opk_perception_sdk-$VERSION-py3-none-any.whl" \
            "$ARTIFACTS_DIR/"
          cp "$SDK_DIR/perception-$VERSION.crate" "$ARTIFACTS_DIR/"

      - name: Accept exactly three archives and two language packages
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/pek-release-artifacts
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            "pek-$BUILD_ID-linux-x86_64.tar.gz"
            "pek-$BUILD_ID-linux-aarch64.tar.gz"
            "pek-docs-$BUILD_ID.tar.gz"
            "opk_perception_sdk-$VERSION-py3-none-any.whl"
            "perception-$VERSION.crate"
          )
          test -z "$(find "$ARTIFACTS_DIR" -type l -print -quit)"
          mapfile -d '' -t files < <(
            find "$ARTIFACTS_DIR" -mindepth 1 -maxdepth 1 -type f -print0 | sort -z
          )
          test "${#files[@]}" -eq "${#expected[@]}"
          for artifact in "${expected[@]}"; do
            test -f "$ARTIFACTS_DIR/$artifact"
          done

      - name: Check Perception Cargo version is available
        if: github.event_name == 'push'
        env:
          ARTIFACTORY_USERNAME: ${{ secrets.PEK_ARTIFACTORY_USERNAME }}
          ARTIFACTORY_TOKEN: ${{ secrets.PEK_ARTIFACTORY_API_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          url="https://artifactory.arm.com/artifactory/edge-ai-tooling.cargo/crates/perception/perception-$VERSION.crate"
          status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' \
            --user "$ARTIFACTORY_USERNAME:$ARTIFACTORY_TOKEN" "$url")"
          case "$status" in
            404) ;;
            200) echo "Perception crate $VERSION already exists." >&2; exit 1 ;;
            *) echo "Cargo publication preflight failed with HTTP $status." >&2; exit 1 ;;
          esac

      - name: Set up locked uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.8.15'
          python-version: '3.14'

      - name: Create read-only publisher token
        id: publisher-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: Iv23li0DqDMHoMs0TXT9
          private-key: ${{ secrets.EDGEAI_EXPKITS_APP_PK }}
          owner: Arm-Debug
          repositories: publisher
          permission-contents: read

      - name: Checkout publisher
        uses: actions/checkout@v7
        with:
          repository: Arm-Debug/publisher
          ref: cd16aa5aa6771b32d62466c974f0f2526d000013 # pragma: allowlist secret
          token: ${{ steps.publisher-token.outputs.token }}
          path: publisher
          persist-credentials: false

      - name: Install locked publisher
        working-directory: publisher
        run: uv sync --frozen --no-dev

      - name: Publish to Artifactory
        id: publish
        working-directory: ${{ runner.temp }}
        env:
          ARTIFACTORY_HOST: https://artifactory.arm.com
          ARTIFACTORY_USER: ${{ secrets.PEK_ARTIFACTORY_USERNAME }}
          ARTIFACTORY_TOKEN: ${{ secrets.PEK_ARTIFACTORY_API_KEY }}
          ARTIFACTORY_ARTIFACTS_NAME: ai-expkits-internal.opk-ci
          # The publisher joins RELEASE_VERSION directly below DOWNLOAD_BASE.
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && 'snapshots' || format('releases/{0}', needs.prepare.outputs.version) }}
          DOWNLOAD_BASE: https://artifactory.arm.com/artifactory/ai-expkits-internal.opk-ci
          SUBDIR_PATH: ${{ github.event_name == 'workflow_dispatch' && format('{0}/{1}-{2}-{3}', github.event.inputs.build_label, needs.prepare.outputs.commit, github.run_id, github.run_attempt) || '' }}
          TIMEOUT_SECONDS: 300
          ARTIFACT_PATTERN: ${{ github.event_name == 'workflow_dispatch' && 'pek-release-artifacts/*' || 'pek-release-artifacts/*.tar.gz' }}
        run: >-
          "$GITHUB_WORKSPACE/publisher/.venv/bin/python"
          -m publisher.actions.publish_to_artifactory_action
          "$ARTIFACT_PATTERN"

      - name: Publish Perception Rust crate to Artifactory Cargo
        if: github.event_name == 'push'
        env:
          ARTIFACTORY_USERNAME: ${{ secrets.PEK_ARTIFACTORY_USERNAME }}
          ARTIFACTORY_TOKEN: ${{ secrets.PEK_ARTIFACTORY_API_KEY }}
          ARTIFACTS_DIR: ${{ runner.temp }}/pek-release-artifacts
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          crate="$ARTIFACTS_DIR/perception-$VERSION.crate"
          url="https://artifactory.arm.com/artifactory/edge-ai-tooling.cargo/crates/perception/perception-$VERSION.crate"
          response="$RUNNER_TEMP/perception-cargo-upload.json"
          status="$(curl --silent --show-error --output "$response" \
            --write-out '%{http_code}' \
            --header 'If-None-Match: *' \
            --user "$ARTIFACTORY_USERNAME:$ARTIFACTORY_TOKEN" \
            --upload-file "$crate" "$url")"
          case "$status" in
            200|201) ;;
            *) cat "$response" >&2; echo "Cargo upload failed with HTTP $status." >&2; exit 1 ;;
          esac

          downloaded="$RUNNER_TEMP/perception-$VERSION.crate"
          curl --fail-with-body --silent --show-error \
            --user "$ARTIFACTORY_USERNAME:$ARTIFACTORY_TOKEN" \
            --output "$downloaded" "$url"
          cmp "$crate" "$downloaded"

          checksum="$(sha256sum "$crate" | cut -d' ' -f1)"
          index_url="https://artifactory.arm.com/artifactory/api/cargo/edge-ai-tooling.cargo/index/pe/rc/perception"
          index="$RUNNER_TEMP/perception-cargo-index"
          indexed=false
          for _ in {1..12}; do
            if curl --fail --silent --show-error \
              --user "$ARTIFACTORY_USERNAME:$ARTIFACTORY_TOKEN" \
              --output "$index" "$index_url" && \
              python3 - "$index" "$VERSION" "$checksum" <<'PY'
          import json
          import sys
          from pathlib import Path

          path, version, checksum = sys.argv[1:]
          entries = [json.loads(line) for line in Path(path).read_text().splitlines()]
          entry = next(
              (item for item in entries if item.get("name") == "perception" and item.get("vers") == version),
              None,
          )
          if entry is None or entry.get("cksum") != checksum or entry.get("yanked"):
              raise SystemExit(1)
          dependency = next(
              (item for item in entry.get("deps", []) if item.get("name") == "flatbuffers"),
              None,
          )
          crates_io = {
              "sparse+https://index.crates.io/",
              "https://github.com/rust-lang/crates.io-index",
          }
          if dependency is None or dependency.get("registry") not in crates_io:
              raise SystemExit(1)
          PY
            then
              indexed=true
              break
            fi
            sleep 5
          done
          if [[ "$indexed" != true ]]; then
            echo "Cargo index did not expose the expected Perception crate." >&2
            exit 1
          fi
          {
            echo "### Perception Cargo"
            echo
            echo "- URL: $url"
            echo "- SHA-256: \`$checksum\`"
            echo "- Sparse index: $index_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Perception Python package to Artifactory PyPI
        if: github.event_name == 'push'
        env:
          UV_PUBLISH_CHECK_URL: https://artifactory.arm.com/artifactory/api/pypi/edge-ai-tooling.pypi/simple
          UV_PUBLISH_URL: https://artifactory.arm.com/artifactory/api/pypi/edge-ai-tooling.pypi
          UV_PUBLISH_USERNAME: ${{ secrets.PEK_ARTIFACTORY_USERNAME }}
          UV_PUBLISH_PASSWORD: ${{ secrets.PEK_ARTIFACTORY_API_KEY }}
        run: >-
          uv publish
          "${{ runner.temp }}"/pek-release-artifacts/opk_perception_sdk-*-py3-none-any.whl

      # This step is only here to make the created package easier to access
      - name: Print links and hashes
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/pek-release-artifacts
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          LABEL: ${{ github.event.inputs.build_label }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          IMAGE_REFERENCE: ${{ needs.release-image.outputs.reference }}
          IMAGE_DIGEST: ${{ needs.release-image.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            folder="snapshots/$LABEL/$COMMIT-${{ github.run_id }}-${{ github.run_attempt }}"
            title="PEK Artifactory snapshot"
            artifacts=("$ARTIFACTS_DIR"/*)
          else
            folder="releases/$VERSION"
            title="PEK Artifactory release"
            artifacts=("$ARTIFACTS_DIR"/*.tar.gz)
          fi
          base="https://artifactory.arm.com/artifactory/ai-expkits-internal.opk-ci/$folder"
          echo "Artifactory folder: $folder"
          {
            echo "### $title"
            echo
            echo "Folder: \`$folder\`"
            echo
            echo "Container image: \`$IMAGE_REFERENCE@$IMAGE_DIGEST\`"
            echo
            for artifact in "${artifacts[@]}"; do
              name="$(basename "$artifact")"
              hash="$(sha256sum "$artifact" | cut -d' ' -f1)"
              url="$base/$name"
              echo "$url"
              # shellcheck disable=SC2016
              printf -- '- [%s](%s) — `%s`\n' "$name" "$url" "$hash"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
