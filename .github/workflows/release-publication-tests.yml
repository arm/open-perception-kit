name: PEK release publication validation

on:
  workflow_run:
    workflows: [PEK release validation]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  required-status-pending:
    name: Start required release publication status
    if: >-
      ${{ github.event.workflow_run.path == '.github/workflows/release-tests.yml' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (github.event.workflow_run.event == 'workflow_dispatch' ||
           (github.event.workflow_run.event == 'pull_request' &&
            contains(github.event.workflow_run.pull_requests.*.base.ref, 'main'))) }}
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Mark release publication validation pending
        if: github.event.workflow_run.event == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending \
            -f context='Release publication validation' \
            -f description='Waiting for Artifactory, Cargo, and GitHub publication probes' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  artifactory:
    name: Test Artifactory upload
    needs: required-status-pending
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.path == '.github/workflows/release-tests.yml' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (github.event.workflow_run.event == 'workflow_dispatch' ||
           (github.event.workflow_run.event == 'pull_request' &&
            contains(github.event.workflow_run.pull_requests.*.base.ref, 'main'))) }}
    runs-on: self-hosted-ubuntu-latest-x64
    steps:
      - name: Download tested publication candidates
        uses: actions/download-artifact@v8
        with:
          pattern: pek-test-release-*-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/pek-release-publication-candidates
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download disposable PyPI candidate
        uses: actions/download-artifact@v8
        with:
          name: pek-test-pypi-wheel-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/pek-pypi-publication-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Accept exactly two architecture archives and one wheel
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/pek-release-publication-candidates
        run: |
          set -euo pipefail
          test -z "$(find "$ARTIFACTS_DIR" -type l -print -quit)"
          mapfile -d '' -t files < <(
            find "$ARTIFACTS_DIR" -mindepth 1 -maxdepth 1 -type f -print0 | sort -z
          )
          test "${#files[@]}" -eq 3
          mapfile -d '' -t archives < <(
            find "$ARTIFACTS_DIR" -mindepth 1 -maxdepth 1 -type f -name '*.tar.gz' -print0 | sort -z
          )
          test "${#archives[@]}" -eq 2
          x86_count=0
          arm_count=0
          for archive in "${archives[@]}"; do
            case "${archive##*/}" in
              pek-*-linux-x86_64.tar.gz) ((x86_count += 1)) ;;
              pek-*-linux-aarch64.tar.gz) ((arm_count += 1)) ;;
            esac
          done
          test "$x86_count" -eq 1
          test "$arm_count" -eq 1
          wheel=("$ARTIFACTS_DIR"/opk_perception_sdk-*-py3-none-any.whl)
          test "${#wheel[@]}" -eq 1
          test -f "${wheel[0]}"

      - name: Accept exactly one disposable PyPI wheel
        env:
          PYPI_DIR: ${{ runner.temp }}/pek-pypi-publication-candidate
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test -z "$(find "$PYPI_DIR" -type l -print -quit)"
          mapfile -d '' -t wheels < <(
            find "$PYPI_DIR" -mindepth 1 -maxdepth 1 -type f -print0 | sort -z
          )
          test "${#wheels[@]}" -eq 1
          filename="${wheels[0]##*/}"
          [[ "$filename" =~ ^opk_perception_sdk-[0-9]+\.[0-9]+\.[0-9]+\.dev${SOURCE_RUN_ID}${SOURCE_RUN_ATTEMPT}-py3-none-any\.whl$ ]]
          version="${filename#opk_perception_sdk-}"
          version="${version%-py3-none-any.whl}"
          printf '%s\n' "$filename" > "$RUNNER_TEMP/pypi-test-wheel-name"
          printf '%s\n' "$version" > "$RUNNER_TEMP/pypi-test-version"

      - name: Set up locked uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.8.15'
          python-version: '3.14'

      - name: Create read-only publisher token
        id: publisher-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: Iv23li0DqDMHoMs0TXT9
          private-key: ${{ secrets.EDGEAI_EXPKITS_APP_PK }}
          owner: Arm-Debug
          repositories: publisher
          permission-contents: read

      - name: Checkout publisher
        uses: actions/checkout@v7
        with:
          repository: Arm-Debug/publisher
          ref: cd16aa5aa6771b32d62466c974f0f2526d000013 # pragma: allowlist secret
          token: ${{ steps.publisher-token.outputs.token }}
          path: publisher
          persist-credentials: false

      - name: Install locked publisher
        working-directory: publisher
        run: uv sync --frozen --no-dev

      - name: Upload and verify Artifactory test packages
        working-directory: ${{ runner.temp }}/pek-release-publication-candidates
        env:
          ARTIFACTORY_HOST: https://artifactory.arm.com
          ARTIFACTORY_USER: ${{ secrets.PEK_ARTIFACTORY_USERNAME }}
          ARTIFACTORY_TOKEN: ${{ secrets.PEK_ARTIFACTORY_API_KEY }}
          ARTIFACTORY_ARTIFACTS_NAME: ai-expkits-internal.opk-ci
          ARTIFACTS_DIR: ${{ runner.temp }}/pek-release-publication-candidates
          RELEASE_VERSION: ci
          SUBDIR_PATH: run-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}/${{ github.event.workflow_run.head_sha }}
          DOWNLOAD_BASE: https://artifactory.arm.com/artifactory/ai-expkits-internal.opk-ci
          TIMEOUT_SECONDS: 300
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/publisher/.venv/bin/python" \
            -m publisher.actions.publish_to_artifactory_action \
            "*"
          for artifact in "$ARTIFACTS_DIR"/*; do
            url="$DOWNLOAD_BASE/$RELEASE_VERSION/$SUBDIR_PATH/$(basename "$artifact")"
            curl --fail --silent --show-error --head \
              --user "$ARTIFACTORY_USER:$ARTIFACTORY_TOKEN" "$url" >/dev/null
          done
          wheel=("$ARTIFACTS_DIR"/opk_perception_sdk-*-py3-none-any.whl)
          downloaded="$RUNNER_TEMP/$(basename "${wheel[0]}")"
          curl --fail --silent --show-error \
            --user "$ARTIFACTORY_USER:$ARTIFACTORY_TOKEN" \
            --output "$downloaded" \
            "$DOWNLOAD_BASE/$RELEASE_VERSION/$SUBDIR_PATH/$(basename "${wheel[0]}")"
          cmp "${wheel[0]}" "$downloaded"

      - name: Publish disposable wheel through Artifactory PyPI
        env:
          PYPI_DIR: ${{ runner.temp }}/pek-pypi-publication-candidate
          UV_PUBLISH_CHECK_URL: https://artifactory.arm.com/artifactory/api/pypi/edge-ai-tooling.pypi/simple
          UV_PUBLISH_PASSWORD: ${{ secrets.PEK_ARTIFACTORY_API_KEY }}
          UV_PUBLISH_URL: https://artifactory.arm.com/artifactory/api/pypi/edge-ai-tooling.pypi
          UV_PUBLISH_USERNAME: ${{ secrets.PEK_ARTIFACTORY_USERNAME }}
        run: |
          set -euo pipefail
          uv publish "$PYPI_DIR/$(<"$RUNNER_TEMP/pypi-test-wheel-name")"
          touch "$RUNNER_TEMP/pypi-published"

      - name: Consume disposable wheel through the PyPI index
        env:
          ARTIFACTORY_TOKEN: ${{ secrets.PEK_ARTIFACTORY_API_KEY }}
          ARTIFACTORY_USERNAME: ${{ secrets.PEK_ARTIFACTORY_USERNAME }}
        run: |
          set -euo pipefail
          version="$(<"$RUNNER_TEMP/pypi-test-version")"
          uv venv "$RUNNER_TEMP/pypi-consume"
          printf '%s' "$ARTIFACTORY_TOKEN" \
            | XDG_DATA_HOME="$RUNNER_TEMP/uv-data" uv auth login artifactory.arm.com \
              --username "$ARTIFACTORY_USERNAME" --password -
          for attempt in {1..6}; do
            if XDG_DATA_HOME="$RUNNER_TEMP/uv-data" uv pip install \
              --python "$RUNNER_TEMP/pypi-consume/bin/python" \
              --index-url https://artifactory.arm.com/artifactory/api/pypi/edge-ai-tooling.pypi/simple \
              --no-deps --refresh "opk-perception-sdk==$version"; then
              break
            fi
            test "$attempt" -lt 6
            sleep 5
          done

      - name: Delete disposable PyPI version
        if: always()
        env:
          ARTIFACTORY_TOKEN: ${{ secrets.PEK_ARTIFACTORY_API_KEY }}
          ARTIFACTORY_USERNAME: ${{ secrets.PEK_ARTIFACTORY_USERNAME }}
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/pypi-test-version" || exit 0
          version="$(<"$RUNNER_TEMP/pypi-test-version")"
          artifact="https://artifactory.arm.com/artifactory/edge-ai-tooling.pypi/opk-perception-sdk/$version"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request DELETE --user "$ARTIFACTORY_USERNAME:$ARTIFACTORY_TOKEN" "$artifact")"
          case "$status" in
            200|204) ;;
            404) test ! -f "$RUNNER_TEMP/pypi-published" ;;
            *) echo "PyPI cleanup failed with HTTP $status" >&2; exit 1 ;;
          esac
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --user "$ARTIFACTORY_USERNAME:$ARTIFACTORY_TOKEN" \
            "https://artifactory.arm.com/artifactory/api/storage/edge-ai-tooling.pypi/opk-perception-sdk/$version")"
          test "$status" = 404

      - name: Delete Artifactory test packages
        if: always()
        env:
          ARTIFACTORY_HOST: https://artifactory.arm.com
          ARTIFACTORY_USER: ${{ secrets.PEK_ARTIFACTORY_USERNAME }}
          ARTIFACTORY_TOKEN: ${{ secrets.PEK_ARTIFACTORY_API_KEY }}
          ARTIFACTORY_ARTIFACTS_NAME: ai-expkits-internal.opk-ci
          TEST_PATH: ci/run-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}/${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request DELETE --user "$ARTIFACTORY_USER:$ARTIFACTORY_TOKEN" \
            "$ARTIFACTORY_HOST/artifactory/$ARTIFACTORY_ARTIFACTS_NAME/$TEST_PATH")"
          case "$status" in
            200|204|404) ;;
            *) echo "Artifactory cleanup failed with HTTP $status" >&2; exit 1 ;;
          esac

  cargo-upload:
    name: Upload disposable Cargo crate
    needs: required-status-pending
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.path == '.github/workflows/release-tests.yml' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (github.event.workflow_run.event == 'workflow_dispatch' ||
           (github.event.workflow_run.event == 'pull_request' &&
            contains(github.event.workflow_run.pull_requests.*.base.ref, 'main'))) }}
    runs-on: self-hosted-ubuntu-latest-x64
    outputs:
      filename: ${{ steps.identity.outputs.filename }}
      sha256: ${{ steps.identity.outputs.sha256 }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Download only the disposable Cargo candidate
        uses: actions/download-artifact@v8
        with:
          name: pek-test-cargo-crate-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/pek-cargo-publication-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate exact disposable Cargo identity
        id: identity
        env:
          CARGO_DIR: ${{ runner.temp }}/pek-cargo-publication-candidate
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test -z "$(find "$CARGO_DIR" -type l -print -quit)"
          mapfile -d '' -t crates < <(
            find "$CARGO_DIR" -mindepth 1 -maxdepth 1 -type f -print0
          )
          test "${#crates[@]}" -eq 1
          filename="${crates[0]##*/}"
          [[ "$filename" =~ ^perception-([0-9]+\.[0-9]+\.[0-9]+)-ci\.${SOURCE_RUN_ID}\.${SOURCE_RUN_ATTEMPT}\.crate$ ]]
          size="$(stat --format '%s' "${crates[0]}")"
          test "$size" -gt 0
          test "$size" -le 67108864
          checksum="$(sha256sum "${crates[0]}" | cut -d ' ' -f 1)"
          [[ "$checksum" =~ ^[0-9a-f]{64}$ ]]
          version="${filename#perception-}"
          version="${version%.crate}"
          {
            echo "filename=$filename"
            echo "sha256=$checksum"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Upload opaque crate bytes and compare download
        env:
          ARTIFACTORY_USERNAME: ${{ secrets.PEK_ARTIFACTORY_USERNAME }}
          ARTIFACTORY_TOKEN: ${{ secrets.PEK_ARTIFACTORY_API_KEY }}
          CARGO_DIR: ${{ runner.temp }}/pek-cargo-publication-candidate
          FILENAME: ${{ steps.identity.outputs.filename }}
        run: |
          set -euo pipefail
          base=https://artifactory.arm.com/artifactory/edge-ai-tooling.cargo/crates
          url="$base/perception/$FILENAME"
          curl --fail --silent --show-error --request PUT \
            --user "$ARTIFACTORY_USERNAME:$ARTIFACTORY_TOKEN" \
            --upload-file "$CARGO_DIR/$FILENAME" "$url"
          curl --fail --silent --show-error \
            --user "$ARTIFACTORY_USERNAME:$ARTIFACTORY_TOKEN" \
            --output "$RUNNER_TEMP/$FILENAME" "$url"
          cmp "$CARGO_DIR/$FILENAME" "$RUNNER_TEMP/$FILENAME"

      - name: Poll sparse index for exact probe version and checksum
        env:
          CHECKSUM: ${{ steps.identity.outputs.sha256 }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          index=https://artifactory.arm.com/artifactory/api/cargo/edge-ai-tooling.cargo/index/pe/rc/perception
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$index" \
                | CHECKSUM="$CHECKSUM" VERSION="$VERSION" python3 -c \
                  'import json, os, sys; version=os.environ["VERSION"]; checksum=os.environ["CHECKSUM"]; raise SystemExit(not any((entry := json.loads(line)).get("vers") == version and entry.get("cksum") == checksum for line in sys.stdin if line.strip()))'; then
              exit 0
            fi
            test "$attempt" -lt 12
            sleep 5
          done

  cargo-consume:
    name: Consume disposable Cargo crate anonymously
    needs: cargo-upload
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Set up pinned Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0

      - name: Resolve and exercise exact probe from sparse index
        env:
          PROBE_VERSION: ${{ needs.cargo-upload.outputs.version }}
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/cargo-home"
          project="$RUNNER_TEMP/cargo-consumer"
          mkdir -p "$CARGO_HOME" "$project/src" "$project/.cargo"
          cat > "$project/.cargo/config.toml" <<'EOF'
          [registries.edge-ai-tooling]
          index = "sparse+https://artifactory.arm.com/artifactory/api/cargo/edge-ai-tooling.cargo/index/"
          EOF
          cat > "$project/Cargo.toml" <<EOF
          [package]
          name = "perception-publication-probe"
          version = "0.0.0"
          edition = "2021"

          [dependencies]
          perception = { version = "=$PROBE_VERSION", registry = "edge-ai-tooling" }
          EOF
          cat > "$project/src/main.rs" <<'EOF'
          use perception::{Envelope, PERCEPTION_NAME};

          fn main() {
              assert_eq!(PERCEPTION_NAME, "perception");
              assert!(Envelope::decode(Vec::new()).is_err());
          }
          EOF
          (
            cd "$project"
            cargo generate-lockfile
            cargo run --locked
          )

  cargo-cleanup:
    name: Delete disposable Cargo crate
    needs: [required-status-pending, cargo-upload, cargo-consume]
    if: ${{ always() && needs.required-status-pending.result == 'success' }}
    runs-on: self-hosted-ubuntu-latest-x64
    steps:
      - name: Download probe to recompute trusted coordinates
        uses: actions/download-artifact@v8
        with:
          name: pek-test-cargo-crate-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/pek-cargo-cleanup-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Recompute exact probe identity
        id: identity
        env:
          CARGO_DIR: ${{ runner.temp }}/pek-cargo-cleanup-candidate
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test -z "$(find "$CARGO_DIR" -type l -print -quit)"
          mapfile -d '' -t crates < <(
            find "$CARGO_DIR" -mindepth 1 -maxdepth 1 -type f -print0
          )
          test "${#crates[@]}" -eq 1
          filename="${crates[0]##*/}"
          [[ "$filename" =~ ^perception-([0-9]+\.[0-9]+\.[0-9]+)-ci\.${SOURCE_RUN_ID}\.${SOURCE_RUN_ATTEMPT}\.crate$ ]]
          size="$(stat --format '%s' "${crates[0]}")"
          test "$size" -gt 0
          test "$size" -le 67108864
          checksum="$(sha256sum "${crates[0]}" | cut -d ' ' -f 1)"
          [[ "$checksum" =~ ^[0-9a-f]{64}$ ]]
          version="${filename#perception-}"
          version="${version%.crate}"
          {
            echo "filename=$filename"
            echo "sha256=$checksum"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Delete exact object and poll object and index absence
        env:
          ARTIFACTORY_USERNAME: ${{ secrets.PEK_ARTIFACTORY_USERNAME }}
          ARTIFACTORY_TOKEN: ${{ secrets.PEK_ARTIFACTORY_API_KEY }}
          FILENAME: ${{ steps.identity.outputs.filename }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          object=https://artifactory.arm.com/artifactory/edge-ai-tooling.cargo/crates/perception/$FILENAME
          index=https://artifactory.arm.com/artifactory/api/cargo/edge-ai-tooling.cargo/index/pe/rc/perception
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request DELETE --user "$ARTIFACTORY_USERNAME:$ARTIFACTORY_TOKEN" "$object")"
          case "$status" in
            200|204) ;;
            404) test "${{ needs.cargo-upload.result }}" != success ;;
            *) echo "Cargo cleanup failed with HTTP $status" >&2; exit 1 ;;
          esac
          for attempt in {1..12}; do
            object_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --user "$ARTIFACTORY_USERNAME:$ARTIFACTORY_TOKEN" "$object")"
            index_file="$RUNNER_TEMP/perception-index"
            index_status="$(curl --silent --show-error --output "$index_file" --write-out '%{http_code}' "$index")"
            case "$index_status" in
              404) index_present=0 ;;
              200)
                if VERSION="$VERSION" python3 -c \
                    'import json, os, sys; version=os.environ["VERSION"]; raise SystemExit(any(json.loads(line).get("vers") == version for line in sys.stdin if line.strip()))' \
                    < "$index_file"; then
                  index_present=0
                else
                  index_present=1
                fi
                ;;
              *) echo "Cargo sparse-index poll failed with HTTP $index_status" >&2; exit 1 ;;
            esac
            if [[ "$object_status" == 404 && "$index_present" == 0 ]]; then
              exit 0
            fi
            test "$attempt" -lt 12
            sleep 5
          done

  github-release:
    name: Test GitHub release upload
    needs: required-status-pending
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.path == '.github/workflows/release-tests.yml' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (github.event.workflow_run.event == 'workflow_dispatch' ||
           (github.event.workflow_run.event == 'pull_request' &&
            contains(github.event.workflow_run.pull_requests.*.base.ref, 'main'))) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      ARTIFACTS_DIR: ${{ github.workspace }}/pek-release-publication-candidates
      TEST_TAG: ci-release-upload-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download tested publication candidates
        uses: actions/download-artifact@v8
        with:
          pattern: pek-test-release-*-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ env.ARTIFACTS_DIR }}
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Accept exactly both architecture archives
        run: |
          set -euo pipefail
          test -z "$(find "$ARTIFACTS_DIR" -type l -print -quit)"
          mapfile -d '' -t archives < <(
            find "$ARTIFACTS_DIR" -mindepth 1 -maxdepth 1 -type f -name '*.tar.gz' -print0 | sort -z
          )
          test "${#archives[@]}" -eq 2
          x86_count=0
          arm_count=0
          for archive in "${archives[@]}"; do
            case "${archive##*/}" in
              pek-*-linux-x86_64.tar.gz) ((x86_count += 1)) ;;
              pek-*-linux-aarch64.tar.gz) ((arm_count += 1)) ;;
            esac
          done
          test "$x86_count" -eq 1
          test "$arm_count" -eq 1

      - name: Create, upload, and verify GitHub test release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mapfile -d '' -t archives < <(
            find "$ARTIFACTS_DIR" -mindepth 1 -maxdepth 1 -type f -name '*.tar.gz' -print0 | sort -z
          )
          gh release create "$TEST_TAG" --draft --prerelease --target "$HEAD_SHA" \
            --title "[TEST ONLY - DO NOT USE] PEK run $SOURCE_RUN_ID upload validation" \
            --notes "Temporary release upload validation. Do not use."
          gh release upload "$TEST_TAG" "${archives[@]}"
          expected="$(printf '%s\n' "${archives[@]##*/}" | sort)"
          actual="$(gh release view "$TEST_TAG" --json assets --jq '.assets[].name' | sort)"
          test "$actual" = "$expected"

      - name: Delete GitHub test release and tag
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TEST_TAG" >/dev/null 2>&1; then
            gh release delete "$TEST_TAG" --yes
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TEST_TAG" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TEST_TAG"
          fi

  required-status-complete:
    name: Complete required release publication status
    needs:
      [required-status-pending, artifactory, cargo-upload, cargo-consume,
       cargo-cleanup, github-release]
    if: ${{ always() && needs.required-status-pending.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Report pull request publication validation result
        if: github.event.workflow_run.event == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          STATUS_STATE: >-
            ${{ github.event.workflow_run.conclusion == 'success' &&
                needs.artifactory.result == 'success' &&
                needs.cargo-upload.result == 'success' &&
                needs.cargo-consume.result == 'success' &&
                needs.cargo-cleanup.result == 'success' &&
                needs.github-release.result == 'success' &&
                'success' || 'failure' }}
        run: |
          if [[ "$STATUS_STATE" == success ]]; then
            description='Artifactory, Cargo, and GitHub publication probes passed'
          else
            description='Release publication validation failed; inspect the workflow run'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$STATUS_STATE" \
            -f context='Release publication validation' \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          [[ "$STATUS_STATE" == success ]]

      - name: Complete manual publication validation
        if: github.event.workflow_run.event == 'workflow_dispatch'
        env:
          STATUS_STATE: >-
            ${{ github.event.workflow_run.conclusion == 'success' &&
                needs.artifactory.result == 'success' &&
                needs.cargo-upload.result == 'success' &&
                needs.cargo-consume.result == 'success' &&
                needs.cargo-cleanup.result == 'success' &&
                needs.github-release.result == 'success' &&
                'success' || 'failure' }}
        run: '[[ "$STATUS_STATE" == success ]]'
