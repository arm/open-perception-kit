name: PEK release validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit, tag, or branch to validate
        required: true
        type: string

permissions:
  contents: read

env:
  CCACHE_SCHEMA_VERSION: v2

jobs:
  prepare:
    name: Resolve and validate release
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      flowdata_commit: ${{ steps.release.outputs.flowdata_commit }}
      build_id: ${{ steps.release.outputs.build_id }}
      x86_archive: ${{ steps.release.outputs.x86_archive }}
      arm_archive: ${{ steps.release.outputs.arm_archive }}
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.event.pull_request.head.sha }}

      - name: Prepare release identity
        id: release
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            python3 scripts/release/ReleaseTool.py prepare \
              --commit "$commit" --build-label validation
          else
            python3 scripts/release/ReleaseTool.py prepare --commit "$commit"
          fi
          echo "flowdata_commit=$(git rev-parse HEAD:tools/flowdata-sdk)" \
            >> "$GITHUB_OUTPUT"

      - name: Require a new main release version
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          base_version="$(git show "${{ github.event.pull_request.base.sha }}:development/meson.build" |
            sed -n "s/^[[:space:]]*version: '\([^']*\)'.*/\1/p")"
          test "$VERSION" != "$base_version" || {
            echo "A PR to main must change the product version." >&2
            exit 1
          }
          if git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1 ||
              gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists." >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.architecture }} candidate package
    needs: prepare
    strategy:
      matrix:
        include:
          - architecture: x86_64
            artifact_label: x86
            cache_scope: pek-release-build-amd64
            platform: linux/amd64
            runner: self-hosted-ubuntu-latest-x64
          - architecture: aarch64
            artifact_label: arm
            cache_scope: pek-release-build-arm64
            platform: linux/arm64
            runner: self-hosted-ubuntu-latest-arm64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_BUILD_IMAGE: pek-deployment-base:${{ needs.prepare.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.artifact_label }}
      SOURCE_DIR: candidate-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.artifact_label }}
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          path: ${{ env.SOURCE_DIR }}
          persist-credentials: false

      - name: Set up Docker builder
        id: builder
        uses: docker/setup-buildx-action@v4

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache@v6
        with:
          path: .cache/ccache-release
          key: pek-ccache-${{ env.CCACHE_SCHEMA_VERSION }}-${{ runner.os }}-${{ runner.arch }}-release-${{ needs.prepare.outputs.commit }}
          restore-keys: |
            pek-ccache-${{ env.CCACHE_SCHEMA_VERSION }}-${{ runner.os }}-${{ runner.arch }}-release-

      - name: Attach compiler cache to Docker builder
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.builder.outputs.name }}
          cache-map: |
            {
              ".cache/ccache-release": {
                "target": "/work/.cache/ccache",
                "id": "pek-release-ccache",
                "sharing": "locked"
              }
            }
          skip-extraction: ${{ steps.compiler-cache.outputs.cache-hit }}

      - name: Build release snapshot image
        uses: docker/build-push-action@v7
        with:
          build-args: |
            HF_DOWNLOAD_CACHEBUST=github-${{ github.run_id }}-${{ github.run_attempt }}
            PEK_RELEASE_BUILD_ID=${{ needs.prepare.outputs.build_id }}
            PEK_RELEASE_SOURCE_COMMIT=${{ needs.prepare.outputs.commit }}
            PEK_FLOWDATA_SDK_COMMIT=${{ needs.prepare.outputs.flowdata_commit }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          context: ${{ env.SOURCE_DIR }}
          labels: org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
          load: true
          platforms: ${{ matrix.platform }}
          provenance: false
          pull: true
          push: false
          secrets: |
            "huggingface_token=${{ secrets.HF_TOKEN }}"
            "executorch_artifactory_username=${{ secrets.PEK_ARTIFACTORY_USERNAME }}"
            "executorch_artifactory_password=${{ secrets.PEK_ARTIFACTORY_API_KEY }}"
          tags: ${{ env.RELEASE_BUILD_IMAGE }}
          target: pek-deployment-base

      - name: Extract package from release snapshot
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          ARCHIVE: ${{ matrix.architecture == 'x86_64' && needs.prepare.outputs.x86_archive || needs.prepare.outputs.arm_archive }}
        run: |
          set -euo pipefail
          mkdir -p dist
          container_id="$(docker create "$RELEASE_BUILD_IMAGE")"
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          docker cp \
            "$container_id:/opt/pek-release-artifacts/$ARCHIVE" "dist/$ARCHIVE"
          if [[ "${{ matrix.architecture }}" == aarch64 ]]; then
            mkdir -p dist/perception-sdk-input
            package="${ARCHIVE%.tar.gz}"
            tar -C dist/perception-sdk-input --strip-components=4 -xzf "dist/$ARCHIVE" \
              "$package/share/pek/perception-sdk"
          fi

      - name: Upload candidate package
        uses: actions/upload-artifact@v7
        with:
          name: pek-test-release-${{ matrix.artifact_label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SOURCE_DIR }}/dist/${{ matrix.architecture == 'x86_64' && needs.prepare.outputs.x86_archive || needs.prepare.outputs.arm_archive }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload Perception SDK input
        if: matrix.architecture == 'aarch64'
        uses: actions/upload-artifact@v7
        with:
          name: pek-test-perception-sdk-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SOURCE_DIR }}/dist/perception-sdk-input/perception-sdk-*
          if-no-files-found: error
          retention-days: 2

      - name: Clean isolated build workspace
        if: always()
        run: |
          docker image rm "$RELEASE_BUILD_IMAGE" 2>/dev/null || true
          rm -rf -- "$SOURCE_DIR"
