name: Raspberry Pi power control
run-name: ${{ inputs.operation }} ${{ inputs.target }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read outlet state, reset an RPi, or set its outlet power.
        required: true
        default: status
        type: choice
        options:
          - status
          - reset
          - power-off
          - power-on
      target:
        description: Status supports all; power operations require one RPi.
        required: true
        default: all
        type: choice
        options:
          - all
          - rpi1
          - rpi2
          - rpi3
          - rpi4
      power_off_seconds:
        description: Reset power-off duration in seconds, from 5 to 60.
        required: true
        default: 10
        type: number

permissions: {}

concurrency:
  group: rpi-power-control
  cancel-in-progress: false

jobs:
  rpi-power-control:
    name: ${{ inputs.operation }} ${{ inputs.target }}
    runs-on: amp-dev-forge-runner-ubuntu-x64
    timeout-minutes: 10
    env:
      OUTLET: ${{ fromJSON('{"all":"all","rpi1":"1","rpi2":"2","rpi3":"3","rpi4":"4"}')[inputs.target] }}
    steps:
      - name: Validate request
        id: validate
        env:
          OPERATION: ${{ inputs.operation }}
          POWER_OFF_SECONDS: ${{ inputs.power_off_seconds }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [[ "${OPERATION}" != status && "${TARGET}" == all ]]; then
            echo "${OPERATION} requires one RPi target" >&2
            exit 1
          fi
          if [[ "${OPERATION}" == reset ]]; then
            if [[ ! "${POWER_OFF_SECONDS}" =~ ^[0-9]+$ ]] ||
              (( POWER_OFF_SECONDS < 5 || POWER_OFF_SECONDS > 60 )); then
              echo "power_off_seconds must be between 5 and 60" >&2
              exit 1
            fi
          fi

      - name: Read outlet state
        if: inputs.operation == 'status'
        uses: Szendvics/energenie-eg-pms2-action@v1.0.2
        with:
          operation: status
          outlet: ${{ env.OUTLET }}
          serial: ${{ vars.EG_PMS2_SERIAL }}

      - name: Power off selected RPi
        if: inputs.operation == 'reset'
        id: power-off
        uses: Szendvics/energenie-eg-pms2-action@v1.0.2
        with:
          operation: off
          outlet: ${{ env.OUTLET }}
          serial: ${{ vars.EG_PMS2_SERIAL }}

      - name: Wait before restoring power
        if: inputs.operation == 'reset' && steps.power-off.outcome == 'success'
        env:
          POWER_OFF_SECONDS: ${{ inputs.power_off_seconds }}
        run: sleep "${POWER_OFF_SECONDS}"

      - name: Restore power after reset
        if: always() && inputs.operation == 'reset' && steps.validate.outcome == 'success'
        uses: Szendvics/energenie-eg-pms2-action@v1.0.2
        with:
          operation: on
          outlet: ${{ env.OUTLET }}
          serial: ${{ vars.EG_PMS2_SERIAL }}

      - name: Ensure selected RPi power is on
        if: inputs.operation == 'power-on'
        uses: Szendvics/energenie-eg-pms2-action@v1.0.2
        with:
          operation: on
          outlet: ${{ env.OUTLET }}
          serial: ${{ vars.EG_PMS2_SERIAL }}

      - name: Ensure selected RPi power is off
        if: inputs.operation == 'power-off'
        uses: Szendvics/energenie-eg-pms2-action@v1.0.2
        with:
          operation: off
          outlet: ${{ env.OUTLET }}
          serial: ${{ vars.EG_PMS2_SERIAL }}

      - name: Verify selected outlet state
        if: always() && inputs.operation != 'status' && steps.validate.outcome == 'success'
        uses: Szendvics/energenie-eg-pms2-action@v1.0.2
        with:
          operation: status
          outlet: ${{ env.OUTLET }}
          serial: ${{ vars.EG_PMS2_SERIAL }}
