name: SDK tests

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  python-tests:
    name: SDK Python tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Generate SDKs
        uses: ./.github/actions/setup-sdk

      - name: Run Python tests
        run: python3 -m unittest discover -s tools/perception/tests -v

  rust-tests:
    name: SDK Rust tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Generate SDKs
        uses: ./.github/actions/setup-sdk

      - name: Run Rust tests
        run: cargo test --manifest-path generated/perception/rust/Cargo.toml
