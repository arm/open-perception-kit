name: Sonar

on:
    workflow_dispatch:
        inputs:
            pr_number:
                description: Optional PR number to run the PR validation path manually.
                required: false
                default: ""
                type: string
            pr_base_ref:
                description: Optional PR base branch for manual PR-context runs.
                required: false
                default: ""
                type: string
            pr_head_ref:
                description: Optional PR head branch for manual PR-context runs.
                required: false
                default: ""
                type: string
            pr_head_sha:
                description: Optional PR head SHA for manual PR-context runs.
                required: false
                default: ""
                type: string
    pull_request:
        branches: [main, "feature/**", "sandbox/**"]
        types: [opened, synchronize, reopened, ready_for_review, labeled]

jobs:
  build-and-sonar:
    name: Run Sonar analysis in Docker
    runs-on: self-hosted-ubuntu-latest-x64

    if: |
        github.event_name != 'pull_request' ||
        (
          (github.event.action != 'labeled' || github.event.label.name == 'run-pek-ci') &&
          (
            github.event.pull_request.draft == false ||
            (github.event.action == 'labeled' && github.event.label.name == 'run-pek-ci')
          )
        )

    env:
      DOCKER_COMPOSE_FILE: .github/compose.ci.yaml
      CI_CHECKOUT_PATH: repo-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }} # pragma: allowlist secret

      - name: Resolve manual PR context
        id: manual_pr
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number="${{ inputs.pr_number }}"
          repo="${{ github.repository }}"
          {
            echo "base_ref=$(gh pr view "${pr_number}" --repo "${repo}" --json baseRefName --jq .baseRefName)"
            echo "head_ref=$(gh pr view "${pr_number}" --repo "${repo}" --json headRefName --jq .headRefName)"
            echo "head_sha=$(gh pr view "${pr_number}" --repo "${repo}" --json headRefOid --jq .headRefOid)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.pr_head_sha || steps.manual_pr.outputs.head_sha || inputs.pr_head_ref || steps.manual_pr.outputs.head_ref || github.head_ref || github.ref }}
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Export isolated workspace root
        shell: bash
        run: echo "WORKSPACE_ROOT=${GITHUB_WORKSPACE}/${CI_CHECKOUT_PATH}" >> "$GITHUB_ENV"

      - name: Build docker image
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} build pek-sonar-check

      - name: SonarQube analysis
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm pek-sonar-check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_BRANCH: ${{ inputs.pr_head_ref || steps.manual_pr.outputs.head_ref || github.head_ref || github.ref_name }}
          SONAR_QUALITYGATE_WAIT: "false"
          PR_KEY: ${{ inputs.pr_number || github.event.pull_request.number || '' }}
          PR_BRANCH: ${{ inputs.pr_head_ref || steps.manual_pr.outputs.head_ref || github.head_ref || '' }}
          PR_BASE: ${{ inputs.pr_base_ref || steps.manual_pr.outputs.base_ref || github.base_ref || '' }}

      - name: Probe Sonar API access
        if: always()
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_BRANCH: ${{ inputs.pr_head_ref || steps.manual_pr.outputs.head_ref || github.head_ref || github.ref_name }}
          PR_KEY: ${{ inputs.pr_number || github.event.pull_request.number || '' }}
          PR_BRANCH: ${{ inputs.pr_head_ref || steps.manual_pr.outputs.head_ref || github.head_ref || '' }}
          PR_BASE: ${{ inputs.pr_base_ref || steps.manual_pr.outputs.base_ref || github.base_ref || '' }}
        run: |
          set -euo pipefail
          probe_file="${RUNNER_TEMP}/sonar-api-access-probe.txt"
          summary_probe_lines=80

          echo "=== Sonar API access probe ===" > "${probe_file}"

          set +e
          docker compose -f "${DOCKER_COMPOSE_FILE}" run --rm \
            -e SONAR_TOKEN \
            -e SONAR_HOST_URL \
            -e SONAR_BRANCH \
            -e PR_KEY \
            -e PR_BRANCH \
            -e PR_BASE \
            pek-sonar-check \
            python3 scripts/private/sonar_quality_gate_report.py \
              --report-task-file /work/.scannerwork/report-task.txt \
              --branch "${SONAR_BRANCH}" \
              --pull-request-key "${PR_KEY}" \
              --probe-api-access \
              >> "${probe_file}" 2>&1
          probe_rc=$?
          set -e

          echo >> "${probe_file}"

          cat "${probe_file}"
          {
            echo "### Sonar API access probe"
            echo
            echo "Full probe output is available in the \`sonar-quality-gate-report\` artifact."
            echo
            echo '```text'
            tail -n "${summary_probe_lines}" "${probe_file}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${probe_rc}" -ne 0 ]; then
            echo "Sonar API access probe exited with status ${probe_rc}" >&2
          fi

      - name: Report Sonar quality gate details
        if: always()
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_BRANCH: ${{ inputs.pr_head_ref || steps.manual_pr.outputs.head_ref || github.head_ref || github.ref_name }}
          PR_KEY: ${{ inputs.pr_number || github.event.pull_request.number || '' }}
          PR_BRANCH: ${{ inputs.pr_head_ref || steps.manual_pr.outputs.head_ref || github.head_ref || '' }}
          PR_BASE: ${{ inputs.pr_base_ref || steps.manual_pr.outputs.base_ref || github.base_ref || '' }}
        run: |
          set -euo pipefail
          # The Sonar container runs on a bind-mounted checkout and may leave parts of
          # the workspace root-owned on self-hosted runners. Write the log report to
          # RUNNER_TEMP so the host-side report step stays writable.
          report_file="${RUNNER_TEMP}/sonar-quality-gate-report.txt"
          summary_report_lines=160

          set +e
          docker compose -f "${DOCKER_COMPOSE_FILE}" run --rm \
            -e SONAR_TOKEN \
            -e SONAR_HOST_URL \
            -e SONAR_BRANCH \
            -e PR_KEY \
            -e PR_BRANCH \
            -e PR_BASE \
            pek-sonar-check \
            python3 scripts/private/sonar_quality_gate_report.py \
              --report-task-file /work/.scannerwork/report-task.txt \
              --branch "${SONAR_BRANCH}" \
              --pull-request-key "${PR_KEY}" \
              > "${report_file}" 2>&1
          report_rc=$?
          set -e

          cat "${report_file}"
          {
            echo "### Sonar quality gate report"
            echo
            echo "Full report is available in the \`sonar-quality-gate-report\` artifact."
            echo
            echo '```text'
            tail -n "${summary_report_lines}" "${report_file}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "${report_rc}"

      - name: Upload Sonar quality gate report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sonar-quality-gate-report
          path: |
            ${{ runner.temp }}/sonar-quality-gate-report.txt
            ${{ runner.temp }}/sonar-api-access-probe.txt
          if-no-files-found: warn
          retention-days: 10

      - name: Cleanup isolated workspace
        if: always()
        shell: bash
        run: |
          workspace_root="${WORKSPACE_ROOT:-}"
          expected_workspace_prefix="${GITHUB_WORKSPACE:-}/repo-"

          case "${workspace_root}" in
            "${expected_workspace_prefix}"*)
              ;;
            *)
              echo "Skipping cleanup for unexpected WORKSPACE_ROOT='${workspace_root}'" >&2
              exit 0
              ;;
          esac

          if [ -d "${workspace_root}" ]; then
            if [ -f "${workspace_root}/${DOCKER_COMPOSE_FILE}" ]; then
              (
                cd "${workspace_root}"
                docker compose -f "${DOCKER_COMPOSE_FILE}" down --remove-orphans --rmi local || true
              )
            fi

            sudo chown -R "$(id -u):$(id -g)" "${workspace_root}" || true
            chmod -R u+rwX "${workspace_root}" || true
            rm -rf "${workspace_root}" || sudo rm -rf "${workspace_root}" || true
          fi
