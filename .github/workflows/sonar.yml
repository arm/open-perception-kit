name: Sonar

on:
    workflow_dispatch:
    pull_request:
        branches: [main, "feature/**", "sandbox/**"]
        types: [opened, synchronize, reopened, ready_for_review, labeled]

jobs:
  build-and-sonar:
    name: Run Sonar analysis in Docker
    runs-on: self-hosted-ubuntu-latest-x64

    if: |
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false ||
        (github.event.action == 'labeled' && contains(github.event.label.name, 'run-pek-ci'))

    env:
      DOCKER_COMPOSE_FILE: .github/compose.ci.yaml
      CI_CHECKOUT_PATH: repo-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }} # pragma: allowlist secret

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.head_ref || github.ref }}
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Export isolated workspace root
        shell: bash
        run: echo "WORKSPACE_ROOT=${GITHUB_WORKSPACE}/${CI_CHECKOUT_PATH}" >> "$GITHUB_ENV"

      - name: Build docker image
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} build pek-sonar-check

      - name: SonarQube analysis
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm pek-sonar-check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_BRANCH: ${{ github.head_ref || github.ref_name }}
          SONAR_QUALITYGATE_WAIT: "false"
          PR_KEY: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}

      - name: Probe Sonar API access
        if: always()
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_ANALYSIS_TOKEN: ${{ secrets.SONAR_PROJECT_ANALYSIS_TOKEN }}
          SONAR_GLOBAL_ANALYSIS_TOKEN: ${{ secrets.SONAR_GLOBAL_ANALYSIS_TOKEN }}
          SONAR_USER_TOKEN: ${{ secrets.SONAR_USER_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_BRANCH: ${{ github.head_ref || github.ref_name }}
          PR_KEY: ${{ github.event.pull_request.number || '' }}
          PR_BRANCH: ${{ github.head_ref || '' }}
          PR_BASE: ${{ github.base_ref || '' }}
        run: |
          set -euo pipefail
          probe_file="${RUNNER_TEMP}/sonar-api-access-probe.txt"
          summary_probe_lines=80

          echo "=== Sonar API access probe ===" > "${probe_file}"

          probe_rc=0

          run_probe() {
            local token_name="$1"
            local token_value="$2"

            {
              echo
              echo "=== ${token_name} ==="
            } >> "${probe_file}"

            if [ -z "${token_value}" ]; then
              echo "Token is not configured." >> "${probe_file}"
              return
            fi

            set +e
            SONAR_TOKEN="${token_value}" docker compose -f "${DOCKER_COMPOSE_FILE}" run --rm \
              -e SONAR_TOKEN \
              -e SONAR_HOST_URL \
              -e SONAR_BRANCH \
              -e PR_KEY \
              -e PR_BRANCH \
              -e PR_BASE \
              pek-sonar-check \
              python3 scripts/private/sonar_quality_gate_report.py \
                --report-task-file /work/.scannerwork/report-task.txt \
                --branch "${SONAR_BRANCH}" \
                --pull-request-key "${PR_KEY}" \
                --probe-api-access \
                >> "${probe_file}" 2>&1
            run_probe_rc=$?
            set -e

            if [ "${run_probe_rc}" -ne 0 ]; then
              probe_rc="${run_probe_rc}"
            fi
          }

          run_probe "SONAR_TOKEN" "${SONAR_TOKEN}"
          run_probe "SONAR_PROJECT_ANALYSIS_TOKEN" "${SONAR_PROJECT_ANALYSIS_TOKEN}"
          run_probe "SONAR_GLOBAL_ANALYSIS_TOKEN" "${SONAR_GLOBAL_ANALYSIS_TOKEN}"
          run_probe "SONAR_USER_TOKEN" "${SONAR_USER_TOKEN}"

          echo >> "${probe_file}"

          cat "${probe_file}"
          {
            echo "### Sonar API access probe"
            echo
            echo "Full probe output is available in the \`sonar-quality-gate-report\` artifact."
            echo
            echo '```text'
            tail -n "${summary_probe_lines}" "${probe_file}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${probe_rc}" -ne 0 ]; then
            echo "Sonar API access probe exited with status ${probe_rc}" >&2
          fi

      - name: Report Sonar quality gate details
        if: always()
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_BRANCH: ${{ github.head_ref || github.ref_name }}
          PR_KEY: ${{ github.event.pull_request.number || '' }}
          PR_BRANCH: ${{ github.head_ref || '' }}
          PR_BASE: ${{ github.base_ref || '' }}
        run: |
          set -euo pipefail
          # The Sonar container runs on a bind-mounted checkout and may leave parts of
          # the workspace root-owned on self-hosted runners. Write the log report to
          # RUNNER_TEMP so the host-side report step stays writable.
          report_file="${RUNNER_TEMP}/sonar-quality-gate-report.txt"
          summary_report_lines=160

          set +e
          docker compose -f "${DOCKER_COMPOSE_FILE}" run --rm \
            -e SONAR_TOKEN \
            -e SONAR_HOST_URL \
            -e SONAR_BRANCH \
            -e PR_KEY \
            -e PR_BRANCH \
            -e PR_BASE \
            pek-sonar-check \
            python3 scripts/private/sonar_quality_gate_report.py \
              --report-task-file /work/.scannerwork/report-task.txt \
              --branch "${SONAR_BRANCH}" \
              --pull-request-key "${PR_KEY}" \
              > "${report_file}" 2>&1
          report_rc=$?
          set -e

          cat "${report_file}"
          {
            echo "### Sonar quality gate report"
            echo
            echo "Full report is available in the \`sonar-quality-gate-report\` artifact."
            echo
            echo '```text'
            tail -n "${summary_report_lines}" "${report_file}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "${report_rc}"

      - name: Upload Sonar quality gate report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sonar-quality-gate-report
          path: |
            ${{ runner.temp }}/sonar-quality-gate-report.txt
            ${{ runner.temp }}/sonar-api-access-probe.txt
          if-no-files-found: warn
          retention-days: 10

      - name: Cleanup isolated workspace
        if: always()
        shell: bash
        run: |
          workspace_root="${WORKSPACE_ROOT:-}"
          expected_workspace_prefix="${GITHUB_WORKSPACE:-}/repo-"

          case "${workspace_root}" in
            "${expected_workspace_prefix}"*)
              ;;
            *)
              echo "Skipping cleanup for unexpected WORKSPACE_ROOT='${workspace_root}'" >&2
              exit 0
              ;;
          esac

          if [ -d "${workspace_root}" ]; then
            if [ -f "${workspace_root}/${DOCKER_COMPOSE_FILE}" ]; then
              (
                cd "${workspace_root}"
                docker compose -f "${DOCKER_COMPOSE_FILE}" down --remove-orphans --rmi local || true
              )
            fi

            sudo chown -R "$(id -u):$(id -g)" "${workspace_root}" || true
            chmod -R u+rwX "${workspace_root}" || true
            rm -rf "${workspace_root}" || sudo rm -rf "${workspace_root}" || true
          fi
