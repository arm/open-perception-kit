name: Sonar on Release
on:
  push:
    tags:
      - "release/*"

jobs:
  sonar-release:
    name: Run Sonar analysis when Release tag is pushed
    runs-on: self-hosted-ubuntu-latest-x64

    env:
      DOCKER_COMPOSE_FILE: .github/compose.ci.yaml
      CI_CHECKOUT_PATH: repo-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }} # pragma: allowlist secret

      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Derive tag metadata
        shell: bash
        run: |
          echo "TAG_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "SONAR_RELEASE_BRANCH=tags/${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "SONAR_PROJECT_VERSION=${GITHUB_REF_NAME#release/}" >> "$GITHUB_ENV"

      - name: Build docker image 
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} build pek-sonar-check-release
          
      - name: Run SonarQube release analysis
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: docker compose -f "${{ env.DOCKER_COMPOSE_FILE }}" run --rm pek-sonar-check-release
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_BRANCH: ${{ env.SONAR_RELEASE_BRANCH }}
          SONAR_PROJECT_VERSION: ${{ env.SONAR_PROJECT_VERSION }}
          SONAR_QUALITYGATE_WAIT: "true"
          BUILD_STRING: ${{ github.sha }}
