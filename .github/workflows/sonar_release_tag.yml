name: Sonar on Release
on:
  push:
    tags:
      - "release/*"

jobs:
  sonar-release:
    name: Run Sonar analysis when Release tag is pushed
    runs-on: self-hosted-ubuntu-latest-x64

    env:
      DOCKER_COMPOSE_FILE: .github/compose.ci.yaml
      CI_CHECKOUT_PATH: repo-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_PROJECT_NAME: pek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }} # pragma: allowlist secret

      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Export isolated workspace root
        shell: bash
        run: echo "WORKSPACE_ROOT=${GITHUB_WORKSPACE}/${CI_CHECKOUT_PATH}" >> "$GITHUB_ENV"

      - name: Derive tag metadata
        shell: bash
        run: |
          {
            echo "TAG_NAME=${GITHUB_REF_NAME}"
            echo "SONAR_RELEASE_BRANCH=tags/${GITHUB_REF_NAME}"
            echo "SONAR_PROJECT_VERSION=${GITHUB_REF_NAME#release/}"
          } >> "$GITHUB_ENV"

      - name: Prepare pinned modelfetch release
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          GH_TOKEN: ${{ secrets.MODELFETCH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "MODELFETCH_RELEASE_TOKEN is required to read the pinned Arm-Debug/modelfetch release." >&2
            exit 1
          fi
          ./scripts/private/prepare-modelfetch-release.sh >/dev/null

      - name: Build docker image 
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} build pek-sonar-check-release
          
      - name: Run SonarQube release analysis
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: docker compose -f "${{ env.DOCKER_COMPOSE_FILE }}" run --rm pek-sonar-check-release
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_BRANCH: ${{ env.SONAR_RELEASE_BRANCH }}
          SONAR_PROJECT_VERSION: ${{ env.SONAR_PROJECT_VERSION }}
          SONAR_QUALITYGATE_WAIT: "true"
          BUILD_STRING: ${{ github.sha }}

      - name: Cleanup isolated workspace
        if: always()
        shell: bash
        run: |
          workspace_root="${WORKSPACE_ROOT:-}"
          expected_workspace_prefix="${GITHUB_WORKSPACE:-}/repo-"

          case "${workspace_root}" in
            "${expected_workspace_prefix}"*)
              ;;
            *)
              echo "Skipping cleanup for unexpected WORKSPACE_ROOT='${workspace_root}'" >&2
              exit 0
              ;;
          esac

          if [ -d "${workspace_root}" ]; then
            if [ -f "${workspace_root}/${DOCKER_COMPOSE_FILE}" ]; then
              (
                cd "${workspace_root}"
                docker compose -f "${DOCKER_COMPOSE_FILE}" down --remove-orphans --rmi local || true
              )
            fi

            sudo chown -R "$(id -u):$(id -g)" "${workspace_root}" || true
            chmod -R u+rwX "${workspace_root}" || true
            rm -rf "${workspace_root}" || sudo rm -rf "${workspace_root}" || true
          fi
