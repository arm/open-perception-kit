name: Sync Repository Rulesets

on:
  push:
    branches: ["develop"]
    paths:
      - ".github/rulesets/*.json"
      - ".github/workflows/sync-rulesets.yml"
      - "scripts/ci/sync-rulesets.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-rulesets:
    # Temporarily disabled until the repository ruleset rollout is resumed.
    if: ${{ github.repository == 'Arm-Debug/amp-dev-forge-ruleset-sync-disabled' }}
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require ruleset admin token
        shell: bash
        env:
          RULESET_ADMIN_GITHUB_TOKEN: ${{ secrets.RULESET_ADMIN_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RULESET_ADMIN_GITHUB_TOKEN}" ]; then
            echo "Missing required secret RULESET_ADMIN_GITHUB_TOKEN." >&2
            echo "Configure a GitHub App installation token or fine-grained PAT with repository administration write access." >&2
            exit 1
          fi

      - name: Validate checked-in ruleset JSON
        shell: bash
        run: |
          set -euo pipefail
          for file in .github/rulesets/*.json; do
            jq empty "${file}"
          done

      - name: Apply repository rulesets
        env:
          RULESET_ADMIN_GITHUB_TOKEN: ${{ secrets.RULESET_ADMIN_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/ci/sync-rulesets.sh "${GITHUB_REPOSITORY}" ".github/rulesets"
