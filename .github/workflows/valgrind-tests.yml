name: Valgrind

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  valgrind:
    name: Valgrind
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find relevant changes
        id: changes
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000)
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            relevant:
              - 'development/**/*.c'
              - 'development/**/*.cc'
              - 'development/**/*.cpp'
              - 'development/**/*.cxx'
              - 'development/**/*.C'
              - 'development/**/*.h'
              - 'development/**/*.hh'
              - 'development/**/*.hpp'
              - 'development/**/*.hxx'
              - 'development/**/*.H'
              - 'development/**/*.tpp'
              - 'development/**/*.inl'
              - 'development/**/*.inc'
              - 'development/**/*.ipp'
              - 'development/**/*.h.in'
              - 'development/**/*.hpp.in'
              - 'development/subprojects/**'
              - 'development/tests/**'
              - 'development/ops-python/runtime.json'
              - 'development/web/package*.json'
              - '**/meson.build'
              - '**/meson.options'
              - '**/meson_options.txt'
              - 'config/**'
              - 'schemas/perception/**'
              - 'generated/perception/**'
              - 'tools/perception/**'
              - 'tools/flowdata-sdk/**'
              - 'requirements/build.json'
              - 'requirements/meson.txt'
              - 'requirements/sdk.txt'
              - 'scripts/build.sh'
              - 'scripts/perception-sdk.sh'
              - 'scripts/private/shtools.sh'
              - 'scripts/private/run-perception-sdk.sh'
              - 'scripts/private/install-perception-flatbuffers.sh'
              - 'scripts/private/install-onnxruntime.sh'
              - 'scripts/setup-python-ops-runtime.sh'
              - 'scripts/testing/valgrind/**'
              - '.clang-format'
              - 'setup.cfg'
              - '.github/actions/setup-build/**'
              - '.github/actions/setup-sdk/**'
              - '.github/workflows/valgrind-tests.yml'

      - name: Set up build environment
        if: &run_checks steps.changes.outcome == 'skipped' || steps.changes.outputs.relevant == 'true'
        uses: ./.github/actions/setup-build

      - name: Install Valgrind
        if: *run_checks
        run: sudo apt-get install -y valgrind

      - name: Build
        if: *run_checks
        run: ./scripts/build.sh debug true

      - name: Check native tests
        if: *run_checks
        run: |
          meson introspect development/build-active --tests > "$RUNNER_TEMP/meson-tests.json"
          python3 - <<'PY' > "$RUNNER_TEMP/native-tests.txt"
          import json
          import os
          from pathlib import Path

          build = Path('development/build-active').resolve()
          tests = Path(os.environ['RUNNER_TEMP']) / 'meson-tests.json'
          for test in json.loads(tests.read_text()):
              if Path(test['cmd'][0]).resolve().is_relative_to(build):
                  print(test['name'])
          PY
          mapfile -t native_tests < "$RUNNER_TEMP/native-tests.txt"
          test "${#native_tests[@]}" -gt 0
          meson test -C development/build-active --no-rebuild \
            --print-errorlogs --num-processes 1 --timeout-multiplier 10 \
            --wrapper "valgrind --xml=yes --xml-file='$OPK_PROJECT_ROOT/development/build-active/meson-logs/native.valgrind.%p.xml' --leak-check=full --errors-for-leak-kinds=definite --suppressions='$OPK_PROJECT_ROOT/scripts/testing/valgrind/suppressed-warnings'" \
            "${native_tests[@]}"
          python3 scripts/testing/valgrind/summarize-valgrind-output.py --logs-dir development/build-active/meson-logs --output "$RUNNER_TEMP/valgrind-current.xml"
          sed -i "s|$GITHUB_WORKSPACE|/work|g" "$RUNNER_TEMP/valgrind-current.xml"
          python3 scripts/testing/valgrind/compare-valgrind-results.py --baseline .github/ci/baselines/valgrind-baseline.xml --current "$RUNNER_TEMP/valgrind-current.xml"

      - name: Upload test logs
        if: always() && (steps.changes.outcome == 'skipped' || steps.changes.outputs.relevant == 'true')
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: valgrind-test-logs
          path: development/build-active/meson-logs/
          if-no-files-found: warn
          retention-days: 7
