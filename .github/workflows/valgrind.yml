name: Publish missing Valgrind baseline

on:
  pull_request_target:
    branches: [main, develop, "feature/**", "sandbox/**"]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  publish-pr-baseline:
    name: Publish missing Valgrind baseline
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.action != 'labeled' && github.event.pull_request.draft == false) ||
        (github.event.action == 'labeled' && github.event.label.name == 'run-pek-ci')
      )
    permissions:
      actions: write
      contents: read
      packages: read
    steps:
      - name: Checkout trusted workflow helper
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Publish missing Valgrind baseline
        env:
          GH_TOKEN: ${{ github.token }}
          VALGRIND_BASELINE_BRANCH: ${{ github.event.pull_request.base.ref }}
          VALGRIND_BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
          VALGRIND_BASELINE_WORKFLOW: pek-ci.yml
          VALGRIND_BASELINE_WORKFLOW_REF: ${{ github.event.repository.default_branch }}
        run: python3 scripts/testing/valgrind/valgrind-baseline-artifact.py publish
