name: Publish missing Valgrind baseline

on:
  pull_request_target:
    branches: [main, develop, "feature/**", "sandbox/**"]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'labeled' && github.event.label.name != 'run-pek-ci' && github.run_id || 'baseline' }}
  cancel-in-progress: true

jobs:
  publish-pr-baseline:
    name: Publish missing Valgrind baseline
    runs-on: self-hosted-ubuntu-latest-x64
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.action != 'labeled' && github.event.pull_request.draft == false) ||
        (github.event.action == 'labeled' && github.event.label.name == 'run-pek-ci')
      )
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout trusted workflow helper
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Publish missing Valgrind baseline
        env:
          ARTIFACTORY_TOKEN: ${{ secrets.PEK_ARTIFACTORY_API_KEY }}
          ARTIFACTORY_USER: ${{ secrets.PEK_ARTIFACTORY_USERNAME }}
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH_NAME: ${{ github.event.pull_request.base.ref }}
          VALGRIND_BASELINE_WORKFLOW_REF: ${{ github.event.repository.default_branch }}
        run: |
          target_branch_head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH_NAME}" --jq .object.sha)"
          export TARGET_BRANCH_HEAD_SHA="$target_branch_head_sha"
          python3 scripts/testing/valgrind/valgrind-baseline-artifact.py publish
