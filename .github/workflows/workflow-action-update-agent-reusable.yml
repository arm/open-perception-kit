name: Workflow Action Update Agent Reusable

on:
  workflow_call:
    inputs:
      source_run_id:
        description: GitHub Actions run ID to repair.
        required: false
        default: ""
        type: string
      target_branch:
        description: Optional branch to open the repair PR against. Defaults to the source run head branch.
        required: false
        default: ""
        type: string
      ticket_id:
        description: JIRA ticket ID used for the repair branch and commit metadata.
        required: false
        default: EXPKITS-1234
        type: string
      profile_path:
        description: Repair profile JSON path relative to the repository root.
        required: false
        default: .github/agent-runtime/repair/profiles/profile.json
        type: string
    secrets:
      EXPKITS_AGENT_TOKEN:
        required: false
      OPENAI_PROXY_KEY_FOR_SELF_HOSTED_RUNNERS:
        required: false

permissions: {}

concurrency:
  group: workflow-action-update-agent-${{ inputs.source_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve repair inputs
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      skip_reason: ${{ steps.resolve.outputs.skip_reason }}
      source_run_id: ${{ steps.resolve.outputs.source_run_id }}
      source_run_url: ${{ steps.resolve.outputs.source_run_url }}
      source_workflow_name: ${{ steps.resolve.outputs.source_workflow_name }}
      target_branch: ${{ steps.resolve.outputs.target_branch }}
      ticket_id: ${{ steps.resolve.outputs.ticket_id }}
      repair_branch: ${{ steps.resolve.outputs.repair_branch }}
      agent_model: ${{ steps.resolve.outputs.agent_model }}
    steps:
      - uses: actions/checkout@v6

      - id: resolve
        uses: ./.github/actions/workflow-action-update-agent-helper
        with:
          command: resolve-inputs
          profile-path: ${{ inputs.profile_path || '.github/agent-runtime/repair/profiles/profile.json' }}
          source-run-id: ${{ inputs.source_run_id || '' }}
          target-branch: ${{ inputs.target_branch || '' }}
          ticket-id: ${{ inputs.ticket_id || 'EXPKITS-1234' }}
          current-ref-name: ${{ github.head_ref || github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.EXPKITS_AGENT_TOKEN || github.token }}

      - name: Summarize skipped run
        if: steps.resolve.outputs.should_run != 'true'
        run: |
          {
            echo "### Workflow Action Update Agent"
            echo
            echo "Skipped: ${{ steps.resolve.outputs.skip_reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

  agent-fix:
    name: Generate repair patch with OpenAI SDK agent
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: self-hosted-ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.prepare.outputs.target_branch }}
          persist-credentials: false

      - uses: ./.github/actions/workflow-action-update-agent-helper
        env:
          GH_TOKEN: ${{ secrets.EXPKITS_AGENT_TOKEN || github.token }}
        with:
          command: collect-context
          source-run-id: ${{ needs.prepare.outputs.source_run_id }}
          source-run-url: ${{ needs.prepare.outputs.source_run_url }}
          source-workflow-name: ${{ needs.prepare.outputs.source_workflow_name }}

      - uses: ./.github/actions/workflow-action-update-agent-helper
        with:
          command: build-markdown
          profile-path: ${{ inputs.profile_path || '.github/agent-runtime/repair/profiles/profile.json' }}
          source-run-id: ${{ needs.prepare.outputs.source_run_id }}
          source-run-url: ${{ needs.prepare.outputs.source_run_url }}
          source-workflow-name: ${{ needs.prepare.outputs.source_workflow_name }}
          target-branch: ${{ needs.prepare.outputs.target_branch }}
          repair-branch: ${{ needs.prepare.outputs.repair_branch }}
          ticket-id: ${{ needs.prepare.outputs.ticket_id }}

      - name: Set up Agent Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install OpenAI agent runtime
        shell: bash
        run: |
          python3 -m venv .agent-runtime/openai-agent-venv
          .agent-runtime/openai-agent-venv/bin/python -m pip install --upgrade pip
          .agent-runtime/openai-agent-venv/bin/python -m pip install -r .github/agent-runtime/runtime/requirements-openai-agents.txt

      - name: Run static regression tests
        run: |
          set -euo pipefail
          .agent-runtime/openai-agent-venv/bin/python -m pip install -r .github/agent-runtime/runtime/requirements-static-analysis.txt
          .agent-runtime/openai-agent-venv/bin/python scripts/private/agent_runtime/static_analysis.py
          python3 -m unittest discover -s tools/expkits-ci/tests -p 'test_detect_secrets_quality_flow.py'
          python3 -m unittest discover -s tools/expkits-ci/tests -p 'test_workflow_action_update_agent_flow.py'

      - name: Run OpenAI SDK repair agent
        shell: bash
        env:
          OPENAI_PROXY_KEY_FOR_SELF_HOSTED_RUNNERS: ${{ secrets.OPENAI_PROXY_KEY_FOR_SELF_HOSTED_RUNNERS }}
        run: |
          .agent-runtime/openai-agent-venv/bin/python scripts/private/agent_runtime/openai_agent_runner.py run-repair \
            --prompt-file .agent-runtime/workflow-action-update-agent/goal.md \
            --output-file "${{ runner.temp }}/workflow-action-update-agent-agent-output.md"

      - id: patch
        uses: ./.github/actions/workflow-action-update-agent-helper
        with:
          command: package-patch
          patch-file: ${{ runner.temp }}/workflow-action-update-agent.patch
          diffstat-file: ${{ runner.temp }}/workflow-action-update-agent.diffstat.txt

      - name: Upload repair artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: workflow-action-update-agent-repair
          path: |
            ${{ runner.temp }}/workflow-action-update-agent.patch
            ${{ runner.temp }}/workflow-action-update-agent.diffstat.txt
            ${{ runner.temp }}/workflow-action-update-agent-agent-output.md
            .agent-runtime/workflow-action-update-agent
          if-no-files-found: warn
          retention-days: 10

      - if: steps.patch.outputs.has_changes != 'true'
        uses: ./.github/actions/workflow-action-update-agent-helper
        with:
          command: require-generated-patch
          source-run-id: ${{ needs.prepare.outputs.source_run_id }}

  open-pr:
    name: Open repair PR
    needs: [prepare, agent-fix]
    if: needs.prepare.outputs.should_run == 'true' && needs['agent-fix'].outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.branch.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.prepare.outputs.target_branch }}
          token: ${{ secrets.EXPKITS_AGENT_TOKEN || github.token }}

      - uses: actions/download-artifact@v6
        with:
          name: workflow-action-update-agent-repair
          path: ${{ runner.temp }}/workflow-action-update-agent-repair

      - id: branch
        uses: ./.github/actions/workflow-action-update-agent-helper
        with:
          command: apply-patch-and-push
          profile-path: ${{ inputs.profile_path || '.github/agent-runtime/repair/profiles/profile.json' }}
          patch-root: ${{ runner.temp }}/workflow-action-update-agent-repair
          repair-branch: ${{ needs.prepare.outputs.repair_branch }}
          source-run-id: ${{ needs.prepare.outputs.source_run_id }}
          source-run-url: ${{ needs.prepare.outputs.source_run_url }}
          source-workflow-name: ${{ needs.prepare.outputs.source_workflow_name }}
          ticket-id: ${{ needs.prepare.outputs.ticket_id }}
          body-file: ${{ runner.temp }}/workflow-action-update-agent-pr-body.md
          pr-title-file: ${{ runner.temp }}/workflow-action-update-agent-pr-title.txt
          commit-subject-file: ${{ runner.temp }}/workflow-action-update-agent-commit-subject.txt
          commit-notes-file: ${{ runner.temp }}/workflow-action-update-agent-commit-notes.txt

      - id: pr
        uses: ./.github/actions/workflow-action-update-agent-helper
        with:
          command: create-draft-pr
          profile-path: ${{ inputs.profile_path || '.github/agent-runtime/repair/profiles/profile.json' }}
          body-file: ${{ runner.temp }}/workflow-action-update-agent-pr-body.md
          pr-title-file: ${{ runner.temp }}/workflow-action-update-agent-pr-title.txt
          target-branch: ${{ needs.prepare.outputs.target_branch }}
          repair-branch: ${{ needs.prepare.outputs.repair_branch }}
        env:
          GH_TOKEN: ${{ secrets.EXPKITS_AGENT_TOKEN || github.token }}

  stabilize-pr:
    name: Stabilize and merge repair PR
    needs: [prepare, open-pr]
    if: needs.prepare.outputs.should_run == 'true' && needs['open-pr'].result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Stabilize repair PR
        uses: ./.github/actions/workflow-action-update-agent-helper
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.EXPKITS_AGENT_TOKEN || github.token }}
        with:
          command: stabilize-pr
          profile-path: ${{ inputs.profile_path || '.github/agent-runtime/repair/profiles/profile.json' }}
          pr-number: ${{ needs['open-pr'].outputs.pr_number }}
          repair-branch: ${{ needs.prepare.outputs.repair_branch }}
          head-sha: ${{ needs['open-pr'].outputs.head_sha }}
          ticket-id: ${{ needs.prepare.outputs.ticket_id }}
          source-run-id: ${{ needs.prepare.outputs.source_run_id }}
          merge-when-stable: "true"
