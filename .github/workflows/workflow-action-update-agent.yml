name: Workflow Action Update Agent (Manual)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub Actions run ID to repair
        required: false
        default: ""
        type: string
      pr_number:
        description: Optional PR number to stabilize instead of running a new repair flow.
        required: false
        default: ""
        type: string
      head_sha:
        description: Optional PR head SHA to pin stabilization to.
        required: false
        default: ""
        type: string
      target_branch:
        description: Optional branch to open the repair PR against. Defaults to the source run head branch.
        required: false
        default: ""
        type: string
      ticket_id:
        description: JIRA ticket ID used for the repair branch and commit metadata.
        required: false
        default: EXPKITS-1234
        type: string
      profile_path:
        description: Repair profile JSON path relative to the repository root.
        required: false
        default: .github/agent-runtime/repair/profiles/profile.json
        type: string

permissions: {}

concurrency:
  group: workflow-action-update-agent-dispatch-${{ inputs.pr_number || inputs.source_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  run-workflow-action-update-agent:
    if: ${{ inputs.pr_number == '' }}
    name: Run workflow action update agent
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: ./.github/workflows/workflow-action-update-agent-reusable.yml
    with:
      source_run_id: ${{ inputs.source_run_id || github.event.workflow_run.id || '' }}
      target_branch: ${{ inputs.target_branch || '' }}
      ticket_id: ${{ inputs.ticket_id || 'EXPKITS-1234' }}
      profile_path: ${{ inputs.profile_path || '.github/agent-runtime/repair/profiles/profile.json' }}
    secrets: inherit # pragma: allowlist secret

  run-agent-stabilizer:
    if: ${{ inputs.pr_number != '' }}
    name: Run agent stabilizer
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/agent-stabilize-pr.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      head_sha: ${{ inputs.head_sha || '' }}
      source_run_id: ${{ inputs.source_run_id || '' }}
      ticket_id: ${{ inputs.ticket_id || 'EXPKITS-1234' }}
      profile_path: ${{ inputs.profile_path || '.github/agent-runtime/repair/profiles/profile.json' }}
    secrets: inherit # pragma: allowlist secret
