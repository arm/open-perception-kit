name: Workflow Dependency Freshness
run-name: Workflow dependency freshness for ${{ github.ref_name }}

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [ main, "feature/**", "sandbox/**" ]
    paths:
      - ".github/workflows/**"
      - "scripts/private/workflow_audit_report.py"
    types: [ opened, synchronize, reopened, ready_for_review ]
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

concurrency:
  group: workflow-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workflow-dependency-freshness:
    name: workflow dependency freshness
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Render workflow dependency freshness report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          python3 scripts/private/workflow_audit_report.py \
            --repo-root . \
            --markdown-output "${RUNNER_TEMP}/workflow-dependency-freshness.md" \
            --json-output "${RUNNER_TEMP}/workflow-dependency-freshness.json" \
            --summary-limit 10 \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload workflow dependency freshness artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: workflow-dependency-freshness
          path: |
            ${{ runner.temp }}/workflow-dependency-freshness.md
            ${{ runner.temp }}/workflow-dependency-freshness.json
          if-no-files-found: warn
          retention-days: 10
