name: Workflow Dependency Freshness
run-name: Workflow dependency freshness for ${{ github.ref_name }}

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: JIRA ticket ID used for the repair branch and commit metadata.
        required: false
        default: EXPKITS-1234
        type: string
      repair_profile_path:
        description: Repair profile JSON path relative to the repository root.
        required: false
        default: .github/agent-runtime/repair/profiles/workflow-audit-profile.json
        type: string
      stabilize_pr_number:
        description: Optional PR number to stabilize instead of running a freshness scan.
        required: false
        default: ""
        type: string
      stabilize_head_sha:
        description: Optional PR head SHA to pin the stabilization attempt to.
        required: false
        default: ""
        type: string
  pull_request:
    branches: [ main, "feature/**", "sandbox/**" ]
    paths:
      - ".github/workflows/**"
      - "scripts/private/workflow_audit_report.py"
      - ".github/agent-runtime/repair/**"
    types: [ opened, synchronize, reopened, ready_for_review ]
  schedule:
    - cron: "0 5 * * *"

permissions: {}

concurrency:
  group: workflow-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workflow-dependency-freshness:
    name: workflow dependency freshness
    runs-on: ubuntu-latest
    if: |
      (github.event_name != 'workflow_dispatch' || github.event.inputs.stabilize_pr_number == '') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      actions: read
      contents: read
    outputs:
      tracked_refs: ${{ steps.report.outputs.tracked_refs }}
      behind_latest: ${{ steps.report.outputs.behind_latest }}
      needs_review: ${{ steps.report.outputs.needs_review }}
      requires_repair: ${{ steps.report.outputs.requires_repair }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Render workflow dependency freshness report
        id: report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          python3 scripts/private/workflow_audit_report.py \
            --repo-root . \
            --markdown-output "${RUNNER_TEMP}/workflow-dependency-freshness.md" \
            --json-output "${RUNNER_TEMP}/workflow-dependency-freshness.json" \
            --github-output "${GITHUB_OUTPUT}" \
            --summary-limit 10 \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload workflow dependency freshness artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: workflow-dependency-freshness
          path: |
            ${{ runner.temp }}/workflow-dependency-freshness.md
            ${{ runner.temp }}/workflow-dependency-freshness.json
          if-no-files-found: warn
          retention-days: 10

  repair-workflow-dependency-freshness:
    name: Repair workflow dependency freshness (nightly/manual only)
    needs: workflow-dependency-freshness
    if: |
      needs.workflow-dependency-freshness.outputs.requires_repair == 'true' &&
      (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.stabilize_pr_number == '')
      )
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: ./.github/workflows/workflow-action-update-agent-reusable.yml
    with:
      source_run_id: ${{ github.run_id }}
      target_branch: ${{ github.ref_name }}
      ticket_id: ${{ inputs.ticket_id || 'EXPKITS-1234' }}
      profile_path: ${{ inputs.repair_profile_path || '.github/agent-runtime/repair/profiles/workflow-audit-profile.json' }}
      source_artifact_name: workflow-dependency-freshness
    secrets: inherit # pragma: allowlist secret

  stabilize-existing-pr:
    name: Stabilize existing PR (manual only)
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.stabilize_pr_number != '' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/agent-stabilize-pr.yml
    with:
      pr_number: ${{ github.event.inputs.stabilize_pr_number }}
      head_sha: ${{ github.event.inputs.stabilize_head_sha || '' }}
      source_run_id: ""
      ticket_id: ${{ inputs.ticket_id || 'EXPKITS-1234' }}
      profile_path: ${{ inputs.repair_profile_path || '.github/agent-runtime/repair/profiles/workflow-audit-profile.json' }}
    secrets: inherit # pragma: allowlist secret
