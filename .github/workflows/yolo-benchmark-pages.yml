name: Publish YOLO Benchmark Reports

on:
  workflow_run:
    workflows: ["YOLO Benchmark"]
    types: [completed]
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write
  pages: write
  pull-requests: read

concurrency:
  group: playwright-pages
  cancel-in-progress: false

jobs:
  publish-report:
    name: Publish latest YOLO benchmark report
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v6

      - name: Run publisher unit tests
        run: python3 -m unittest examples/yolo-benchmark/pages/test_publish_yolo_benchmark_pages.py

      - name: Update Pages content
        id: pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: examples/yolo-benchmark/pages/run.sh publish

      - name: Configure Pages
        if: steps.pages.outputs.deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.pages.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _yolo_benchmark_pages_site

      - name: Deploy Pages
        if: steps.pages.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

  cleanup-closed-pr-reports:
    name: Clean closed PR reports
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v6

      - name: Run publisher unit tests
        run: python3 -m unittest examples/yolo-benchmark/pages/test_publish_yolo_benchmark_pages.py

      - name: Remove old closed PR reports
        id: pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: examples/yolo-benchmark/pages/run.sh cleanup

      - name: Configure Pages
        if: steps.pages.outputs.deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.pages.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _yolo_benchmark_pages_site

      - name: Deploy Pages
        if: steps.pages.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
