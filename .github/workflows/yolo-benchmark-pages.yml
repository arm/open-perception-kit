name: Publish YOLO Benchmark Reports

on:
  workflow_run:
    workflows: ["YOLO Benchmark"]
    types: [completed]
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: "Optional completed YOLO Benchmark run ID to publish. Leave empty for report cleanup."
        required: false
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  pages: write
  pull-requests: read

concurrency:
  group: report-pages
  cancel-in-progress: false

jobs:
  publish-pages:
    name: Publish YOLO benchmark pages
    if: |
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      ) || (
        github.event_name == 'workflow_dispatch' &&
        inputs.upstream_run_id != ''
      )
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v6

      - name: Capture workflow run metadata
        if: github.event_name == 'workflow_run'
        env:
          EVENT_UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          EVENT_UPSTREAM_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_UPSTREAM_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          EVENT_UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_UPSTREAM_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EVENT_UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EVENT_UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          {
            printf 'UPSTREAM_CONCLUSION=%s\n' "${EVENT_UPSTREAM_CONCLUSION}"
            printf 'UPSTREAM_EVENT=%s\n' "${EVENT_UPSTREAM_EVENT}"
            printf 'UPSTREAM_HEAD_BRANCH=%s\n' "${EVENT_UPSTREAM_HEAD_BRANCH}"
            printf 'UPSTREAM_HEAD_REPOSITORY=%s\n' "${EVENT_UPSTREAM_HEAD_REPOSITORY}"
            printf 'UPSTREAM_HEAD_SHA=%s\n' "${EVENT_UPSTREAM_HEAD_SHA}"
            printf 'UPSTREAM_PR_NUMBER=%s\n' "${EVENT_UPSTREAM_PR_NUMBER}"
            printf 'UPSTREAM_RUN_ATTEMPT=%s\n' "${EVENT_UPSTREAM_RUN_ATTEMPT}"
            printf 'UPSTREAM_RUN_ID=%s\n' "${EVENT_UPSTREAM_RUN_ID}"
          } >> "${GITHUB_ENV}"

      - name: Resolve selected upstream run metadata
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_UPSTREAM_RUN_ID: ${{ inputs.upstream_run_id }}
        run: |
          [[ "${SELECTED_UPSTREAM_RUN_ID}" =~ ^[0-9]+$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SELECTED_UPSTREAM_RUN_ID}" --jq '[
            "UPSTREAM_CONCLUSION=" + (.conclusion // ""),
            "UPSTREAM_EVENT=" + (.event // ""),
            "UPSTREAM_HEAD_BRANCH=" + (.head_branch // ""),
            "UPSTREAM_HEAD_REPOSITORY=" + (.head_repository.full_name // ""),
            "UPSTREAM_HEAD_SHA=" + (.head_sha // ""),
            "UPSTREAM_PR_NUMBER=" + ((.pull_requests[0].number // "") | tostring),
            "UPSTREAM_RUN_ATTEMPT=" + (.run_attempt | tostring),
            "UPSTREAM_RUN_ID=" + (.id | tostring)
          ] | .[]' >> "${GITHUB_ENV}"

      - name: Run publisher unit tests
        run: python3 -m unittest examples/yolo-benchmark/pages/test_publish_yolo_benchmark_pages.py

      - name: Update Pages content
        id: pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: examples/yolo-benchmark/pages/run.sh publish

      - name: Cache YOLO performance dataset
        if: steps.pages.outputs.deploy == 'true'
        uses: actions/cache@v4
        with:
          path: _yolo_performance_dataset_cache
          key: yolo-performance-datasets-coco-val2017-4f7e2ccb2866ec5041993c9cf2a952bbed69647b115d0f74da7ce8f4bef82f05

      - name: Restore YOLO dataset overlay
        if: steps.pages.outputs.deploy == 'true'
        run: |
          python3 examples/yolo-benchmark/pages/restore_dataset_overlay.py \
            --site-dir _yolo_benchmark_pages_site \
            --cache-dir _yolo_performance_dataset_cache

      - name: Restore deploy-only report videos
        if: steps.pages.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 examples/yolo-benchmark/pages/publish_yolo_benchmark_pages.py \
            restore-latest _yolo_benchmark_pages_site
          python3 scripts/playwright/pages/publish_playwright_pages.py \
            restore-videos _yolo_benchmark_pages_site

      - name: Configure Pages
        if: steps.pages.outputs.deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.pages.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _yolo_benchmark_pages_site

      - name: Deploy Pages
        if: steps.pages.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

  cleanup-closed-pr-reports:
    name: Clean closed YOLO benchmark PR reports
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.upstream_run_id == '')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v6

      - name: Run publisher unit tests
        run: python3 -m unittest examples/yolo-benchmark/pages/test_publish_yolo_benchmark_pages.py

      - name: Remove old closed PR reports
        id: pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: examples/yolo-benchmark/pages/run.sh cleanup

      - name: Cache YOLO performance dataset
        if: steps.pages.outputs.deploy == 'true'
        uses: actions/cache@v4
        with:
          path: _yolo_performance_dataset_cache
          key: yolo-performance-datasets-coco-val2017-4f7e2ccb2866ec5041993c9cf2a952bbed69647b115d0f74da7ce8f4bef82f05

      - name: Restore YOLO dataset overlay
        if: steps.pages.outputs.deploy == 'true'
        run: |
          python3 examples/yolo-benchmark/pages/restore_dataset_overlay.py \
            --site-dir _yolo_benchmark_pages_site \
            --cache-dir _yolo_performance_dataset_cache

      - name: Restore deploy-only report videos
        if: steps.pages.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 examples/yolo-benchmark/pages/publish_yolo_benchmark_pages.py \
            restore-latest _yolo_benchmark_pages_site
          python3 scripts/playwright/pages/publish_playwright_pages.py \
            restore-videos _yolo_benchmark_pages_site

      - name: Configure Pages
        if: steps.pages.outputs.deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.pages.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _yolo_benchmark_pages_site

      - name: Deploy Pages
        if: steps.pages.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
