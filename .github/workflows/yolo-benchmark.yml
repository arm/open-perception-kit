name: YOLO Benchmark

on:
  workflow_dispatch:
    inputs:
      image_limit:
        description: "Optional COCO val2017 image limit. Use 0 for the full dataset."
        required: false
        default: "0"
        type: string
      benchmark_runs:
        description: "Number of repeated benchmark runs."
        required: false
        default: "10"
        type: string
  pull_request:
    branches: [ main, develop, "feature/**", "sandbox/**" ]
    types: [ labeled, synchronize, reopened ]
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read

jobs:
  yolo-benchmark:
    name: YOLO benchmark
    runs-on: [self-hosted, Linux, ARM64, amp-dev-forge-runner-rpi5]
    timeout-minutes: 240
    if: |
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (github.event.action == 'labeled' && github.event.label.name == 'run-yolo-benchmark') ||
          ((github.event.action == 'synchronize' || github.event.action == 'reopened') &&
            contains(github.event.pull_request.labels.*.name, 'run-yolo-benchmark'))
        )
      )
    env:
      CI_CHECKOUT_PATH: repo-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_PROJECT_NAME: yolo-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
      YOLO_BENCHMARK_IMAGE_NAME: amp-dev-forge-yolo-benchmark:${{ github.run_id }}-${{ github.run_attempt }}
      YOLO_BENCHMARK_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.image_limit || '' }}
      YOLO_BENCHMARK_RUNS: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_runs || '10' }}

    steps:
      # RPI runner drops checkout@v6 temp includeIf credentials during fetch; retry v6 after runner image update.
      - name: Checkout ref
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 1
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Validate benchmark inputs
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          if [ -n "${YOLO_BENCHMARK_LIMIT}" ] && ! [[ "${YOLO_BENCHMARK_LIMIT}" =~ ^[0-9]+$ ]]; then
            echo "image_limit must be a non-negative integer, got '${YOLO_BENCHMARK_LIMIT}'." >&2
            exit 2
          fi
          if [ -z "${YOLO_BENCHMARK_RUNS}" ] || ! [[ "${YOLO_BENCHMARK_RUNS}" =~ ^[0-9]+$ ]]; then
            echo "benchmark_runs must be a positive integer, got '${YOLO_BENCHMARK_RUNS}'." >&2
            exit 2
          fi
          if [ "${YOLO_BENCHMARK_RUNS}" -lt 1 ]; then
            echo "benchmark_runs must be a positive integer, got '${YOLO_BENCHMARK_RUNS}'." >&2
            exit 2
          fi

      - name: Set up YOLO benchmark cache
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./examples/yolo-benchmark/docker/setup.sh

      - name: Run YOLO benchmark
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./examples/yolo-benchmark/docker/run.sh

      - name: Write benchmark summary
        if: always()
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          {
            echo "## YOLO Benchmark"
            echo
            echo "- image_limit: ${YOLO_BENCHMARK_LIMIT:-full}"
            echo "- benchmark_runs: ${YOLO_BENCHMARK_RUNS}"
            echo "- image: ${YOLO_BENCHMARK_IMAGE_NAME}"
            echo
            if compgen -G "artifacts/yolo-benchmark/runs/run-*/comparison.md" > /dev/null; then
              for comparison in artifacts/yolo-benchmark/runs/run-*/comparison.md; do
                echo "## $(basename "$(dirname "${comparison}")")"
                echo
                cat "${comparison}"
                echo
              done
            else
              echo "No comparison.md was generated."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload YOLO benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: yolo-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/artifacts/yolo-benchmark
          if-no-files-found: warn
          retention-days: 10

      - name: Clean YOLO benchmark workspace and image
        if: always()
        run: |
          set +e
          checkout_path="${GITHUB_WORKSPACE}/${CI_CHECKOUT_PATH}"
          case "${checkout_path}" in
            "${GITHUB_WORKSPACE}/repo-"*)
              ;;
            *)
              echo "Skipping cleanup for unexpected checkout_path='${checkout_path}'" >&2
              exit 0
              ;;
          esac
          if [ -f "${checkout_path}/examples/yolo-benchmark/docker/compose.yaml" ]; then
            docker compose -f "${checkout_path}/examples/yolo-benchmark/docker/compose.yaml" down --remove-orphans || true
          fi
          docker image rm -f "${YOLO_BENCHMARK_IMAGE_NAME}" || true
          checkout_root="$(git -C "${checkout_path}" rev-parse --show-toplevel 2> /dev/null || true)"
          if [ "${checkout_root}" != "${checkout_path}" ]; then
            echo "Skipping checkout cleanup because '${checkout_path}' is not a git worktree root." >&2
            exit 0
          fi
          rm -rf -- "${checkout_path}"
