name: YOLO Imageset Benchmark

on:
  workflow_dispatch:
    inputs:
      image_limit:
        description: "Optional COCO val2017 image limit. Use 0 for the full dataset."
        required: false
        default: "0"
        type: string
      benchmark_runs:
        description: "Number of repeated benchmark runs."
        required: false
        default: "1"
        type: string
  pull_request:
    branches: [ main, develop, "feature/**", "sandbox/**" ]
    types: [ labeled, synchronize, reopened ]
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: read

concurrency:
  group: yolo-imageset-benchmark-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'run-yolo-imageset-benchmark' && github.run_id || 'validation' }}
  cancel-in-progress: true

jobs:
  yolo-imageset-benchmark:
    name: YOLO imageset benchmark
    runs-on: [self-hosted, Linux, ARM64, amp-dev-forge-runner-rpi5]
    timeout-minutes: 240
    if: |
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (github.event.action == 'labeled' && github.event.label.name == 'run-yolo-imageset-benchmark') ||
          ((github.event.action == 'synchronize' || github.event.action == 'reopened') &&
            contains(github.event.pull_request.labels.*.name, 'run-yolo-imageset-benchmark'))
        )
      )
    env:
      CI_CHECKOUT_PATH: repo-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_PROJECT_NAME: yolo-imageset-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
      MODELFETCH_RELEASE_TOOL_IMAGE: yolo-modelfetch-release-tools:${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      YOLO_BENCHMARK_IMAGE_NAME: amp-dev-forge-yolo-imageset-benchmark:${{ github.run_id }}-${{ github.run_attempt }}
      YOLO_BENCHMARK_KIND: images
      YOLO_BENCHMARK_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.image_limit || github.event_name == 'pull_request' && '10' || '' }}
      YOLO_BENCHMARK_RUNS: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_runs || '1' }}

    steps:
      - name: Checkout ref
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 1
          path: ${{ env.CI_CHECKOUT_PATH }}

      - name: Create read-only modelfetch token
        id: modelfetch-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: Iv23li0DqDMHoMs0TXT9
          private-key: ${{ secrets.EDGEAI_EXPKITS_APP_PK }}
          owner: Arm-Debug
          repositories: modelfetch
          permission-contents: read

      - name: Prepare pinned modelfetch release
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        env:
          GH_TOKEN: ${{ steps.modelfetch-app-token.outputs.token }}
        run: ./scripts/private/prepare-modelfetch-release-in-container.sh

      - name: Set up YOLO benchmark cache
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./examples/yolo-benchmark/docker/run.sh setup

      - name: Run benchmark unit tests
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: |
          docker compose -f examples/yolo-benchmark/docker/compose.yaml run --rm \
            yolo-benchmark \
            python3 -m unittest discover -s examples/yolo-benchmark/tests

      - name: Run YOLO benchmark
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./examples/yolo-benchmark/docker/run.sh benchmark

      - name: Write benchmark summary
        if: always()
        working-directory: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}
        run: ./examples/yolo-benchmark/docker/run.sh summary

      - name: Upload YOLO benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yolo-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}/artifacts/yolo-benchmark
          if-no-files-found: warn
          retention-days: 10

      - name: Clean YOLO benchmark workspace and image
        if: always()
        run: |
          checkout_path="${{ github.workspace }}/${{ env.CI_CHECKOUT_PATH }}"
          cleanup_status=0
          if [ -x "$checkout_path/examples/yolo-benchmark/docker/run.sh" ]; then
            "$checkout_path/examples/yolo-benchmark/docker/run.sh" cleanup-ci || cleanup_status=$?
          fi
          if [[ -e "$checkout_path" || -L "$checkout_path" ]]; then
            echo "YOLO benchmark checkout cleanup left '${checkout_path}' behind." >&2
            cleanup_status=1
          fi
          if docker image inspect "$MODELFETCH_RELEASE_TOOL_IMAGE" >/dev/null 2>&1; then
            docker image rm --force "$MODELFETCH_RELEASE_TOOL_IMAGE" || cleanup_status=$?
          fi
          exit "$cleanup_status"
