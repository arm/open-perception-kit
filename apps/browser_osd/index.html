<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AMP Browser OSD</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <div class="topbar">
          <div>
            <h1>Browser OSD</h1>
            <p id="status-line">Disconnected</p>
          </div>
        </div>

        <div class="stage" id="stage">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="overlay" aria-hidden="true"></canvas>
          <div id="stage-message" class="stage-message">Waiting for stream</div>
        </div>
      </section>

      <aside class="side-panel">
        <label class="field">
          <span>WebRTC signaling</span>
          <input id="signaling-url" type="text" value="ws://127.0.0.1:8000/ws" autocomplete="off" spellcheck="false" />
        </label>

        <div class="button-row">
          <button id="connect-video-button" type="button">Connect Video</button>
          <button id="disconnect-video-button" class="secondary" type="button" disabled>Disconnect</button>
        </div>

        <label class="field">
          <span>Metadata WebSocket</span>
          <input id="metadata-url" type="text" value="ws://127.0.0.1:8002/ws" autocomplete="off" spellcheck="false" />
        </label>

        <div class="button-row">
          <button id="connect-metadata-button" type="button">Connect Metadata</button>
          <button id="disconnect-metadata-button" class="secondary" type="button" disabled>Disconnect</button>
        </div>

        <section class="toggle-panel" aria-label="Overlay layers">
          <h2>Render Layers</h2>
          <label class="toggle"><input id="render-objects" type="checkbox" checked /> <span>Objects</span><input id="color-objects" class="color-input" type="color" value="#ff3030" aria-label="Objects color" /></label>
          <label class="toggle"><input id="render-faces" type="checkbox" checked /> <span>Faces</span><input id="color-faces" class="color-input" type="color" value="#2600ff" aria-label="Faces color" /></label>
          <label class="toggle"><input id="render-gaze" type="checkbox" checked /> <span>Gaze</span><input id="color-gaze" class="color-input" type="color" value="#fafad2" aria-label="Gaze color" /></label>
          <label class="toggle"><input id="render-camera-contact" type="checkbox" checked /> <span>Camera contact</span><input id="color-camera-contact" class="color-input" type="color" value="#66ff00" aria-label="Camera contact color" /></label>
          <label class="toggle"><input id="render-track-traces" type="checkbox" checked /> <span>Track traces</span><input id="color-track-traces" class="color-input" type="color" value="#ffff00" aria-label="Track traces color" /></label>
          <label class="toggle"><input id="render-classification" type="checkbox" checked /> <span>Classification</span><input id="color-classification" class="color-input" type="color" value="#ffffff" aria-label="Classification color" /></label>
          <label class="toggle"><input id="render-person-status" type="checkbox" checked /> <span>Person status</span><input id="color-person-status" class="color-input" type="color" value="#66ff00" aria-label="Person status color" /></label>
          <label class="toggle"><input id="render-performance" type="checkbox" checked /> <span>Performance</span><input id="color-performance" class="color-input" type="color" value="#66ff00" aria-label="Performance overlay color" /></label>
        </section>

        <div class="metrics">
          <div class="metric">
            <span>Video</span>
            <strong id="video-state">Closed</strong>
          </div>
          <div class="metric">
            <span>Metadata</span>
            <strong id="metadata-state">Closed</strong>
          </div>
          <div class="metric">
            <span>Frame</span>
            <strong id="frame-counter">n/a</strong>
          </div>
          <div class="metric">
            <span>Layers</span>
            <strong id="layer-count">0</strong>
          </div>
          <div class="metric">
            <span>Detections</span>
            <strong id="detection-count">0</strong>
          </div>
          <div class="metric">
            <span>Video Size</span>
            <strong id="video-size">n/a</strong>
          </div>
        </div>
      </aside>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
