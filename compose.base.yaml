services:
  pek-common: &pek-common
    cap_add:
      - SYS_PTRACE

    security_opt:
      - seccomp:unconfined

    privileged: true

    environment:
      - USERNAME=devgoblin

    # <agent-review:suppress-begin>
    # The env_file object form (path + required) is a Compose feature, which is available since 2.24 (released on 20.12.2023).
    # We are not supporting older releases.
    env_file:
      - path: devices.env
        required: false
    # <agent-review:suppress-end>

    ports:
      - 8000:8000
      - 8080:8080
      - 8001:8001
      - 8002:8002
      # <agent-review:suppress-begin> Port 7001 is intentionally published for
      # local/demo metadata workflows; transport auth/TLS is out of scope for
      # these checked-in demo compose defaults.
      - 7001:7001
      # <agent-review:suppress-end>
      - 9999:9999
      - 2222:2222

    stdin_open: true
    tty: true
    restart: unless-stopped

  pek-common-dev: &pek-common-dev
    <<: *pek-common
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - .:/work
      - /run/udev:/run/udev:ro

    environment:
      - WAYLAND_DISPLAY=wayland-0
      - DISPLAY
      - USERNAME=devgoblin
