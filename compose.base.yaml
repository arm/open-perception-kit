x-pek-runtime-environment: &pek-runtime-environment
  USERNAME: dev
  HF_TOKEN_PATH: /run/secrets/huggingface_token

x-pek-development-environment: &pek-development-environment
  WAYLAND_DISPLAY: wayland-0
  DISPLAY: ${DISPLAY:-}

services:
  pek-common: &pek-common
    cap_add:
      - SYS_PTRACE

    security_opt:
      - seccomp:unconfined

    privileged: true

    environment:
      <<: *pek-runtime-environment

    secrets:
      - source: huggingface_token
        target: /run/secrets/huggingface_token
        uid: "${HOST_UID:-1000}"
        gid: "${HOST_GID:-1000}"
        mode: 0400

    # <agent-review:suppress-begin>
    # The env_file object form (path + required) is a Compose feature, which is available since 2.24 (released on 20.12.2023).
    # We are not supporting older releases.
    env_file:
      - path: devices.env
        required: false
    # <agent-review:suppress-end>

    network_mode: host
    stdin_open: true
    tty: true
    restart: unless-stopped

  pek-common-dev: &pek-common-dev
    <<: *pek-common
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - .:/work
      - /run/udev:/run/udev:ro

    environment:
      <<:
        - *pek-runtime-environment
        - *pek-development-environment
