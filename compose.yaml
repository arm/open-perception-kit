services:
  pek-release-deployment:
    platform: linux/arm64
    extends: 
      file: ./compose.base.yaml
      service: pek-common
    network_mode: host
    ports: []
    container_name: pek-deployment-base
    hostname: pek-deployment-base
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /run/udev:/run/udev:ro
    environment:
      PEK_PIPELINE: ${PEK_PIPELINE:-config/pipelines/debug/onnx.json}
    build:
      context: .
      dockerfile: Dockerfile
      target: pek-deployment-base
      args:
        PEK_PIPELINE: ${PEK_PIPELINE:-config/pipelines/debug/onnx.json}

# Topo-specific metadata
# TODO: for some reason in case of topo deployment from WSL the container has x86 binaries inside it instead of arm64. Despite the platform specification in the compose file.
x-topo:
  name: "Perception Experience Kit TOPO Container"
  description: |
    Run Perception Experience Kit container
  args:
    PEK_PIPELINE:
      description: |
        The Perception Experience Kit pipeline to run. Use a pipeline path or ID,
        for example 'config/pipelines/debug/onnx.json',
        '05-full-onnx-raspicam', or '06-full-onnx-usb-cam'.
      default: "config/pipelines/debug/onnx.json"
  features:
    - "SME"
    - "NEON"
