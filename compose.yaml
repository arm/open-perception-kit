# yaml-language-server: $schema=https://raw.githubusercontent.com/arm/topo/refs/heads/main/docs/project-specification/schema/topo-project-specification.json

name: opk-dev

services:
  opk-dev:
    platform: linux/arm64
    container_name: open-perception-kit
    hostname: open-perception-kit
    privileged: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    network_mode: host
    init: true
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - /run/udev:/run/udev:ro
      - ./config/models:/work/config/models:ro
    environment:
      OPK_PIPELINE: ${OPK_PIPELINE:-yolo26n-320}
    build:
      context: .
      dockerfile: Dockerfile
      target: opk-deployment-base
      args:
        OPK_PICAMERA: ${OPK_PICAMERA:-disabled}
        NO_EXAMPLE_CONTENT: ${NO_EXAMPLE_CONTENT:-false}

x-topo:
  name: open-perception-kit
  description: |
    Run Open Perception Kit on an ARM64 target with an optional
    Raspberry Pi camera pipeline.
  args:
    OPK_PIPELINE:
      description: |
        Pipeline ID or path to run. Use yolo26n-320 for the bundled sample
        video, full-onnx-raspicam for the Pi camera, or
        full-onnx-usb-cam for a USB camera.
      default: "yolo26n-320"
    OPK_PICAMERA:
      description: |
        Set to enabled only when the selected pipeline uses a Raspberry Pi
        camera.
      default: "disabled"
    NO_EXAMPLE_CONTENT:
      description: |
        Skip packaging demo videos. Set this only when the selected pipeline
        uses a camera or other supplied media.
      default: "false"
  deployment_success_message: |
    The OPK server is starting on port 9999.
