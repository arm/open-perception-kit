services:
  pek-release-deployment:
    platform: linux/arm64
    extends: 
      file: ./compose.base.yaml
      service: pek-common
    network_mode: host
    ports: []
    container_name: pek-deployment-base
    hostname: pek-deployment-base
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /run/udev:/run/udev:ro
    environment:
      PEK_PIPELINE: ${PEK_PIPELINE:-onnx}
      HF_TOKEN_PATH: /run/secrets/huggingface_token
    secrets:
      - huggingface_token
    build:
      context: .
      dockerfile: Dockerfile
      target: pek-deployment-base
      additional_contexts:
        modelfetch_wheels: .cache/modelfetch
      args:
        PEK_PIPELINE: ${PEK_PIPELINE:-onnx}

secrets:
  huggingface_token:
    file: ${HF_TOKEN_PATH:-/dev/null}

# Topo-specific metadata
# TODO: for some reason in case of topo deployment from WSL the container has x86 binaries inside it instead of arm64. Despite the platform specification in the compose file.
x-topo:
  name: "Perception Experience Kit TOPO Container"
  description: |
    Run Perception Experience Kit container
  args:
    PEK_PIPELINE:
      description: | 
        The Perception Experience Kit pipeline to run. This should be the name of a pipeline defined in pipelines.yaml. Some options include 'onnx', 'gaze', 'video' amd 'single_cam'.
      default: "onnx"
  features:
    - "SME"
    - "NEON"
