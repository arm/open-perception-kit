[binaries]
c = 'x86_64-linux-gnu-gcc'
cpp = 'x86_64-linux-gnu-g++'
ar = 'x86_64-linux-gnu-gcc-ar'
strip = 'x86_64-linux-gnu-strip'
pkg-config = ['env', 'PKG_CONFIG_LIBDIR=/opt/pek-sysroots/amd64/usr/lib/x86_64-linux-gnu/pkgconfig:/opt/pek-sysroots/amd64/usr/share/pkgconfig', 'PKG_CONFIG_SYSROOT_DIR=/opt/pek-sysroots/amd64', 'pkg-config']

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
c_args = ['--sysroot=/opt/pek-sysroots/amd64', '-I/opt/pek-sysroots/amd64/usr/include/x86_64-linux-gnu']
cpp_args = ['--sysroot=/opt/pek-sysroots/amd64', '-I/opt/pek-sysroots/amd64/usr/include/x86_64-linux-gnu']
c_link_args = ['--sysroot=/opt/pek-sysroots/amd64']
cpp_link_args = ['--sysroot=/opt/pek-sysroots/amd64']

[properties]
needs_exe_wrapper = true
pek_onnxruntime_root = '/opt/pek-deps/onnxruntime-amd64'
