<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>WebRTC Stream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="card">
        <div class="card-header">
            <div class="title">
                <span class="title-dot"></span>
                WebRTC for Perception Experience Kit pipelines
            </div>
        </div>

        <div class="card-body">
            <div class="sidebar">

                <div class="sidebar-section">
                    <div class="sidebar-section-title">Controls</div>
                    <div class="controls-row">
                        <div id="status-line" class="status-line status-line--compact connecting">
                            <span class="status-line-dot" aria-hidden="true"></span>
                            <span class="status-line-text">WebRTC connecting</span>
                        </div>
                        <div class="controls-actions">
                            <button id="playPauseBtn" class="control-button control-button--primary" type="button"
                                aria-label="Pause pipeline">
                                <span id="playPauseIcon" class="video-control-icon">⏸</span>
                                <span class="video-control-text">Pause</span>
                            </button>
                            <button id="muteUnmuteBtn" type="button" aria-label="Unmute" style="display:none">
                                <span id="muteUnmuteIcon" class="video-control-icon">🔇</span>
                                <span class="video-control-text">Unmute</span>
                            </button>
                        </div>
                    </div>
                    <label class="perf-toggle-switch" aria-label="Toggle performance overlay">
                        <input id="enablePerfOverlayChk" type="checkbox" role="switch">
                        <span class="perf-toggle-track" aria-hidden="true">
                            <span class="perf-toggle-thumb"></span>
                        </span>
                        <span class="perf-toggle-text">Performance overlay</span>
                    </label>
                </div>

                <div class="sidebar-section sidebar-section--grow sidebar-section--models">
                    <div class="sidebar-section-title">Pipeline Output Model</div>
                    <div id="models-container" class="models-container">
                        <div class="models-loading">
                            <div class="spinner"></div>
                            <span>Loading models...</span>
                        </div>
                    </div>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-section-title">Debug log</div>
                    <div id="log" class="log"></div>
                </div>

            </div>

            <div class="video-wrapper">
                <video id="video" autoplay playsinline muted></video>
                <div id="video-overlay" class="video-overlay">
                    <div class="overlay-chip">
                        <div class="spinner"></div>
                        <div id="overlay-text">Waiting for stream…</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Logic -->
    <script type="module" src="/pek-config.js"></script>
    <script type="module" src="/webrtc.js"></script>
    <script type="module" src="/ctrlws.js"></script>
    <script type="module" src="/models.js"></script>
    <script type="module" src="/video-controls.js"></script>
    <script type="module" src="/audio.js"></script>
    <script type="module" src="/perf_overlay.js"></script>
</body>

</html>
