<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>WebRTC Stream</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="card">
            <div class="card-header">
                <div class="title">
                    <span class="title-dot"></span>
                    WebRTC for Arm Media Pipelines
                </div>
                <div id="status-pill" class="status-pill connecting">
                    <span class="status-dot"></span>
                    <div>
                        <div id="status-label" class="status-label">CONNECTING</div>
                        <div id="status-subtext" class="subtext">Initializing WebRTC &amp; signaling…</div>
                    </div>
                </div>
            </div>

            <div class="card-body">
                <div class="video-wrapper">
                    <video id="video" autoplay playsinline muted></video>

                    <div class="video-controls">
                        <button id="playPauseBtn" class="video-control" type="button" aria-label="Pause pipeline">
                            <span id="playPauseIcon" class="video-control-icon">⏸</span>
                            <span class="video-control-text">Pause</span>
                        </button>

                        <button id="muteUnmuteBtn" class="video-control" type="button" aria-label="Unmute">
                            <span id="muteUnmuteIcon" class="video-control-icon">🔇</span>
                            <span class="video-control-text">Unmute</span>
                        </button>
                    </div>

                    <div id="video-overlay" class="video-overlay">
                        <div class="overlay-chip">
                            <div class="spinner"></div>
                            <div id="overlay-text">Waiting for stream…</div>
                        </div>
                    </div>
                </div>

                <div class="sidebar">
                    <div>
                        <div class="sidebar-section-title">AI Models</div>
                        <div id="models-container" class="models-container">
                            <div class="models-loading">
                                <div class="spinner"></div>
                                <span>Loading models...</span>
                            </div>
                        </div>
                    </div>

                    <div>
                        <div class="sidebar-section-title">Controls</div>
                        <div class="btn-row">
                            <button id="enablePerfOverlayBtn" class="primary">
                                <span class="btn-icon">👁</span>
                                Disable Performance Overlay
                            </button>
                        </div>
                    </div>

                    <div>
                        <div class="sidebar-section-title">Connection</div>
                        <div id="status-line" class="status-line">
                            Starting up…
                        </div>
                    </div>

                    <div>
                        <div class="sidebar-section-title">Debug log</div>
                        <div id="log" class="log"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Logic -->
        <script type="module" src="/amp-config.js"></script>
        <script type="module" src="/webrtc.js"></script>
        <script type="module" src="/ctrlws.js"></script>
        <script type="module" src="/button.js"></script>
        <script type="module" src="/models.js"></script>
        <script type="module" src="/video-controls.js"></script>
        <script type="module" src="/audio.js"></script>
        <script type="module" src="/perf_overlay.js"></script>
    </body>
</html>
