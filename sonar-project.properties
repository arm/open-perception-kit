sonar.projectKey=LinuxVisionKitPek
sonar.cfamily.compile-commands=development/build/compile_commands.json
sonar.exclusions=development/subprojects/**/*,development/build/**/*,etc/**/*,development/web/content/pek-web.js,generated/perception/cpp/fb/**/*,generated/perception/python/src/perception/fb/**/*,generated/perception/python/src/perception/internalfb/**/*,generated/perception/ts/src/perception/fb/**/*
sonar.cpd.exclusions=development/ops-std/preproc/CpuImageKernelsI420.cpp,development/ops-std/preproc/CpuImageKernelsNv12.cpp,development/ops-std/preproc/CpuImageKernelsYuy2.cpp
sonar.scm.provider=git
sonar.python.version=3
sonar.tests=scripts/testing/valgrind
sonar.test.inclusions=scripts/testing/valgrind/test_*.py
sonar.coverageReportPaths=coverage.xml
sonar.python.coverage.reportPaths=python-coverage.xml
sonar.coverage.exclusions=generated/perception/**/*

# Dockerfile uses local multi-stage aliases, not floating external images.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6596
sonar.issue.ignore.multicriteria.e1.resourceKey=Dockerfile

# The generated CPython bridge follows Python's C ABI. These casts, mutable callback
# signatures, sentinel arrays, and function-local C API descriptors are required by
# CPython and cannot be replaced by the C++ alternatives suggested by these rules.
sonar.issue.ignore.multicriteria.e2.ruleKey=cpp:S3630
sonar.issue.ignore.multicriteria.e2.resourceKey=generated/perception/cpp/python_bridge/perception_python_bridge.cpp
sonar.issue.ignore.multicriteria.e3.ruleKey=cpp:S995
sonar.issue.ignore.multicriteria.e3.resourceKey=generated/perception/cpp/python_bridge/perception_python_bridge.cpp
sonar.issue.ignore.multicriteria.e4.ruleKey=cpp:S5945
sonar.issue.ignore.multicriteria.e4.resourceKey=generated/perception/cpp/python_bridge/perception_python_bridge.cpp
sonar.issue.ignore.multicriteria.e5.ruleKey=cpp:S6018
sonar.issue.ignore.multicriteria.e5.resourceKey=generated/perception/cpp/python_bridge/perception_python_bridge.cpp

# The bridge catches std::exception at the Python boundary so all generated SDK
# exceptions are translated into a Python exception instead of crossing the C ABI.
sonar.issue.ignore.multicriteria.e6.ruleKey=cpp:S1181
sonar.issue.ignore.multicriteria.e6.resourceKey=generated/perception/cpp/python_bridge/perception_python_bridge.cpp

# Generated APIs intentionally use the standard exception hierarchy and a single
# envelope facade. Copy construction reads synchronized state after locking, so the
# copied members cannot safely be initialized directly from the source object.
sonar.issue.ignore.multicriteria.e7.ruleKey=cpp:S112
sonar.issue.ignore.multicriteria.e7.resourceKey=generated/perception/cpp/**/*
sonar.issue.ignore.multicriteria.e8.ruleKey=cpp:S1448
sonar.issue.ignore.multicriteria.e8.resourceKey=generated/perception/cpp/perception.h
sonar.issue.ignore.multicriteria.e9.ruleKey=cpp:S3230
sonar.issue.ignore.multicriteria.e9.resourceKey=generated/perception/cpp/perception.h
sonar.issue.ignore.multicriteria.e10.ruleKey=cpp:S6177
sonar.issue.ignore.multicriteria.e10.resourceKey=generated/perception/cpp/**/*

# Semantic versions deliberately accept ASCII digits only; \d would also accept
# Unicode decimal characters and would weaken cross-language version validation.
sonar.issue.ignore.multicriteria.e11.ruleKey=python:S6353
sonar.issue.ignore.multicriteria.e11.resourceKey=generated/perception/python/src/perception/sdk.py
sonar.issue.ignore.multicriteria.e12.ruleKey=typescript:S6353
sonar.issue.ignore.multicriteria.e12.resourceKey=generated/perception/ts/src/perception/envelope.ts

# PyGetSetDef callbacks require an opaque void* closure argument, even when the
# generated getter does not use it.
sonar.issue.ignore.multicriteria.e13.ruleKey=cpp:S5008
sonar.issue.ignore.multicriteria.e13.resourceKey=generated/perception/cpp/python_bridge/perception_python_bridge.cpp

# The envelope explicitly defaults its destructor and implements all copy/move
# operations. Sonar still reports the class because synchronization is shared.
sonar.issue.ignore.multicriteria.e14.ruleKey=cpp:S3624
sonar.issue.ignore.multicriteria.e14.resourceKey=generated/perception/cpp/perception.h
